name: Sanitize

on:
  schedule:
    # This will run the sanitize job Nightly at 2:37AM every day for the GT fork's
    # current dev_v0.<N> integration branch (upstream's 'dev' branch does not exist
    # here -- see the "Resolve integration branch" step below).
    # * is a special character in YAML so you have to quote this string
    - cron: '37 2 * * *'

  workflow_dispatch:

jobs:

  sanitize:
    strategy:
      matrix:
        configuration: [RelWithDebInfo]
        os: [ubuntu-22.04]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.ref }}
          submodules: true
          fetch-depth: 0  # Fetch all history for proper branch switching

      - name: Resolve integration branch
        id: target
        run: |
          # GT fork: no 'dev' branch exists (branch model is master -> dev_v0.<N> ->
          # feature/*, see repo CLAUDE.md §7). Resolve the latest dev_v* branch instead
          # of a hardcoded name -- a hardcoded 'dev_v0.14' would go stale on the next
          # version bump and repeat the exact bug this replaces (git checkout dev,
          # which fails outright since that branch was never created in this fork).
          BRANCH=$(git for-each-ref --format='%(refname:short)' 'refs/remotes/origin/dev_v*' | sed 's#^origin/##' | sort -V | tail -1)
          if [ -z "$BRANCH" ]; then
            echo "::error::No origin/dev_v* branch found"
            exit 1
          fi
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: Conditional Checkout
        run: |
          if [ "${{ github.ref }}" == "refs/heads/master" ]; then
            git checkout ${{ steps.target.outputs.branch }}
          fi

      - name: Check recent commits
        id: changes
        run: |
          COUNT=$(git rev-list --count --since="24 hours ago" origin/${{ steps.target.outputs.branch }})
          echo "$COUNT commits over the last 24 hours found on ${{ steps.target.outputs.branch }}"
          echo "commit_count=$COUNT" >> $GITHUB_OUTPUT

      - name: Skip job
        if: steps.changes.outputs.commit_count == '0'
        run: |
          echo "No new commits on ${{ steps.target.outputs.branch }}. Skipping."
          exit 0

      - uses: ./.github/actions/setup_tools_shared
        if: steps.changes.outputs.commit_count != '0'

      - name: Cache
        if: steps.changes.outputs.commit_count != '0'
        uses: actions/cache@v5
        with:
          path: |
            externals/googletest
            externals/osg
            externals/osi
            externals/sumo
            resources/models
          key: ${{ runner.os }}-external-resources

      - name: CMake Configure - Ubuntu
        if: steps.changes.outputs.commit_count != '0' && runner.os == 'Linux'
        shell: pwsh
        run: cmake . -B build -G Ninja -DENABLE_SANITIZERS=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUSE_OSI=ON -DUSE_GTEST=ON -DUSE_OSG=OFF -DUSE_SUMO=OFF -DUSE_IMPLOT=OFF

      - name: CMake Build
        if: steps.changes.outputs.commit_count != '0'
        run: cmake --build build --config ${{ matrix.configuration }} --target install -j 2

      - name: Run Tests
        if: steps.changes.outputs.commit_count != '0'
        # Use xvfb on Linux and extend timeout allowing for slow execution
        run: |
          ${{ matrix.os == 'ubuntu-22.04' && 'xvfb-run' || '' }} ./scripts/run_tests.sh -b ${{ matrix.configuration }} -t 120
