scenario: cutin_hard_brake
category: 07_aeb
# REQ-AD-001 (safety, positive): カットインして急制動する先行車への追突を AEB が抑止する。
#
# 受入 = MITIGATION（衝突速度低減）。本シナリオ（Ego 30 m/s ≈108 km/h、先行車が ~48 m 前で
# カットイン後 8 m/s² で急制動）は、最速の正当検知時刻（横侵入が可視化される t≈1.75s、隣接レーンの
# 単なる並走を誤検知しないための下限）でも完全回避に ~13.5 m/s²（≈1.38g）を要する。これはモデル車
# （Civic クラス, max_dec=10 m/s² ≈1.02g = 乾燥路の実車ABS実測レンジ 0.87–1.08g の上端）の物理
# 天井を超えるため回避不能（1.38g 級は 911 GT2 RS / Corvette ZR1 等スーパーカーが特殊タイヤ+閉鎖路で
# 出す領域・Web実測裏取り済）。ゆえに AEB の価値は「衝突速度の低減」で測る（Euro NCAP カラーバンド思想）。
#
# impact_speed_below: 接触が起きる場合、初回接触フレームの閉じ（衝突）速度が閾値以下であること。
# 接触が全く起きなければ（＝完全回避）無条件 PASS（avoid/mitigate 両対応）。無AEB時の閉じ速度は
# ~18 m/s、AEB 有効時は ~8.75 m/s（約51%低減）。閾値 10.0 m/s は達成値に ~1.25 m/s のマージンを持ち、
# 無AEB(~18)の遥か下 ⇒ AEB 弱化の回帰を検出できる。
# 完全回避側の検証はカーブ変種（curvature 制限で回避可能域）の min_obb_separation_above が担う。
# Requires OSI capture (batch osi:true)。
must:
  - event: impact_speed_below
    threshold: 10.0            # 初回接触時の閉じ速度上限 [m/s]（達成 ~8.75、無AEB ~18）
    after: { sim_time: 2.0 }   # from cut-in onset
    reason: "カットイン+急制動で完全回避不能な域でも、AEBが衝突速度を安全レベルまで低減する(緩和・REQ-AD-001)"
