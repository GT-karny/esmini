name: aeb_safety_negative
# AEB (safety-tier) MISFIRE verification batch — the SOTIF negative counterpart to
# 07_aeb_batch.yaml (REQ-AD-001, positive). Mirrors its structure exactly, but
# asserts the opposite direction: with AebSafety ENABLED (policies:[lead,aeb]) on
# three non-collision-course scenarios, the emergency STOP_AT_S constraint
# (source:"aeb") must NEVER appear in telemetry.jsonl's policy.constraints.
# REQ-AD-013: "WHILE no collision-course object exists on the ego's path, VD must
# not emit emergency_decel (comfort_decel is the ceiling)."
#
#   - normal_following.xosc  : same-lane lead, comfortable gap, no cut-in, no brake
#                               -> AebSafety admits the candidate (in_path) but its
#                               gate never trips.
#   - benign_cutin.xosc       : SAME cut-in geometry as cutin_hard_brake.xosc (so the
#                               encroachment cue legitimately fires) but a huge gap
#                               and no brake -> the collision-course GATE (not the
#                               detector) must reject it. Strongest test in the batch.
#   - parallel_overtake.xosc  : adjacent-lane car overtakes but never changes lanes
#                               -> never admitted as a candidate at all (gate never
#                               even reached).
#
# osi:true -> gt_sim_test captures the OSI groundtruth scene (used by benign_cutin's
# sanity-check min_obb_separation_above matcher; the primary
# no_emergency_without_conflict matcher only needs telemetry.jsonl policy.constraints
# and would work without OSI capture, but osi:true is kept for parity with
# 07_aeb_batch.yaml and so per-scenario snapshots/scene rendering stay available).
#
# Run:
#   py GT_esmini/scripts/verification/gt_sim_test.py batch \
#       resources/xosc/verification/07_aeb_negative_batch.yaml --out test_results/web/aeb_negative
defaults:
  dt: 0.05
  max_time: 16.0   # >= longest StopTrigger (benign_cutin=14s) + ~2s grace, mirrors 07_aeb_batch.yaml's StopTrigger+2 convention
  snapshots: 3
  osi: true
scenarios:
  # REQ-AD-013 — normal same-lane following (comfort-tier "lead" handles it; AEB dormant)
  - scenario: resources/xosc/verification/07_aeb/normal_following.xosc
    expectations: resources/xosc/verification/07_aeb/normal_following.expectations.yaml
    policies: [lead, aeb]
  # REQ-AD-013 — benign cut-in: detector fires, gate correctly rejects (large gap, no brake)
  - scenario: resources/xosc/verification/07_aeb/benign_cutin.xosc
    expectations: resources/xosc/verification/07_aeb/benign_cutin.expectations.yaml
    policies: [lead, aeb]
  # REQ-AD-013 — adjacent-lane overtake, never cuts in: never admitted as a candidate
  - scenario: resources/xosc/verification/07_aeb/parallel_overtake.xosc
    expectations: resources/xosc/verification/07_aeb/parallel_overtake.expectations.yaml
    policies: [lead, aeb]
