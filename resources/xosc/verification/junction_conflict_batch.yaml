name: junction_conflict
origin: vd-phase:Phase3d
# Phase 3d (F2) oncoming-yield / left-turn-across-traffic verification batch.
# ConflictPointResolver (CORRIDOR space-time model) on the representative pair:
#   p017 (14 m/s oncoming) -> YIELD  (ego crawls ~1.35 m/s, lets it pass, then turns)
#   p007 ( 8 m/s oncoming) -> PROCEED (corridor timing clears, no yield)
# Each vehicle's future motion is a width-inflated path corridor; the conflict
# region is the TRUE polygon intersection of the two corridors, and length-aware
# constant-speed timing (with a PET pad) decides yield. The discriminator is the
# oncoming SPEED: the VirtualDriver slows to ~4.9 m/s for the junction turn, so its
# crossing is ~9-10 s; a 14 m/s oncoming then occupies the region as the ego arrives
# (yield), an 8 m/s one clears first (proceed). See the expectations files.
#
# Anti-collision gate = min_obb_separation_above (oriented bounding box, SAT), NOT
# center-to-center: the adjacent-lane side-by-side pass has ~2.9 m center distance
# yet the 5x2 m footprints do NOT overlap (clean), while the OFF baseline OVERLAPS.
# Needs the captured OSI scene -> osi: true.
#
# policies:[conflict] enables ConflictPointResolver via a per-run absolute-path
# ConfigFile (base config + policy_conflict_enabled=true), injected by gt_sim_test.
#
# Run:
#   py GT_esmini/scripts/verification/gt_sim_test.py batch \
#       resources/xosc/verification/junction_conflict_batch.yaml --out test_results/web/phase3d
defaults:
  dt: 0.05
  max_time: 35.0
  snapshots: 3
  osi: true   # min_separation_above (anti-collision gate) reads the captured OSI scene
scenarios:
  - scenario: resources/scenario_authoring/scenario_templates/generated/07_oncoming_yield__p017.xosc
    expectations: resources/xosc/verification/07_oncoming_yield/p017_yield.expectations.yaml
    policies: [conflict]
  - scenario: resources/scenario_authoring/scenario_templates/generated/07_oncoming_yield__p007.xosc
    expectations: resources/xosc/verification/07_oncoming_yield/p007_proceed.expectations.yaml
    policies: [conflict]
