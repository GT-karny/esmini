scenario: yellow_decision_stop
category: 03_traffic_signals
# Yellow onset at t=4s (the xosc's green Phase duration; yellow then runs 8s)
# catches the ego far enough out that the safe choice is to stop. require_red is
# relaxed: the stop onset may begin during yellow (before the red at t=12s).
# Pre-Phase-3b the ego runs through -> stopped_at_signal FAILS.
must:
  - event: stopped_at_signal
    signal_id: 1
    road_id: 3
    s_range: [96, 110]
    min_duration: 1.0
    stop_speed: 0.3
    require_red: false       # stop decision may begin on yellow
    reason: "黄信号で停止判断し停止線手前に停止"
