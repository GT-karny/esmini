scenario: decelerate_for_left_turn
category: 05_anticipation
# No Default baseline: mid/long judgment is from VirtualDriver telemetry only.
# Tight-junction turn anticipation. This is the Phase-1 residual-bug scenario:
# without the mid/long planner the car enters the R~8m connecting road at cruise,
# Pure-Pursuit steering saturates, and it drifts onto the wrong road. All checks
# below are EXPECTED TO FAIL pre-Phase-2 and to pass once A2's planner lands.
must:
  - event: speed_reduction_before_landmark
    landmark_s: 109            # road 3 s at the junction / connecting-road entry
    road_id: 3
    target_speed: 5.0          # ~sqrt(2.0 * 8) = 4 m/s; allow up to 5
    tolerance: 1.0
    reason: "Anticipate the tight right turn; do not enter the junction at cruise"
  - event: deceleration_profile_smooth
    # Scoped to the deceleration approach [onset -> junction entry s=109] via
    # landmark_s/road_id. A 14->5 m/s slow for a tight junction is a firm but
    # controlled maneuver: max_decel is the comfort gate; max_jerk is a slam-stop
    # guard at a 0.45 s comfort timescale (smooth_window 9).
    max_decel: 4.0            # m/s^2 — firm but not a slam-stop
    max_jerk: 9.0             # m/s^3 @ smooth_window 9 — slam-stop guard
    smooth_window: 9
    landmark_s: 109
    road_id: 3
    after: { sim_time: 4.0 }   # skip the launch-from-rest transient
    reason: "Anticipatory braking into the turn is controlled (bounded decel/jerk), not a slam-stop"
  - event: steer_not_saturated
    threshold: 0.98
    after: { sim_time: 4.0 }
    reason: "Steering must not saturate through the turn (it can take the corner)"
  - event: indicator_leads_junction_turn
    min_distance_m: 29.5   # legal 30.0, minus frame-quantization slack (design doc section 4-2;
                            # the same slack, same reason as section 11-9's lane-change
                            # min_lead_s: 2.9 vs the legal 3.0s -- code lights on the first frame
                            # dist <= 30.0, so the measured lead is always a shade under 30.0)
    expect_dir: left       # Correct: the maneuver IS geometrically a LEFT turn
                            # (junction_turn_signal.md section 5). Connecting road 13 in
                            # fabriksgatan_traffic_lights.xodr is <arc curvature="+0.108108">,
                            # length 14.8696, entry hdg 0.1457 rad: heading delta =
                            # 0.108108 * 14.8696 = +1.608 rad (+92 deg), so the ego turns from
                            # ~8.3 deg (east-ish) to ~100.5 deg (north-ish) -- OpenDRIVE positive
                            # curvature is counter-clockwise, i.e. a left turn. The indicator is
                            # therefore correct to light LEFT here. The scenario was renamed from
                            # decelerate_for_right_turn to decelerate_for_left_turn on 2026-08-04
                            # to match this geometry (junction_turn_signal.md section 5/7).
    reason: "req-vd-ad:REQ-AD-021 defect regression guard: indicator anticipates the (geometric
      left) junction turn by the legal >=30 m, not just the old ~7 m short-connector distance"
notes: >
  Geometry: route road3(lane -1) -> fabriksgatan junction (R~8m) -> road2(lane 1),
  same as resources/xosc/traffic_lights.xosc with signals/pedestrians removed.
  The discriminators are speed_reduction_before_landmark + deceleration_profile_smooth:
  pre-Phase-2 the car enters the junction at ~8 m/s with huge jerk (no anticipation);
  post-Phase-2 it should slow to ~4 m/s smoothly. lane_keep on the destination road is
  intentionally NOT asserted here — slowing for the turn makes the car reach road 2
  later, so a time-gated lane_keep would couple to speed; the wrong-road *drift* is
  covered by the Step 3 traffic_lights regression (stop-then-go context).
