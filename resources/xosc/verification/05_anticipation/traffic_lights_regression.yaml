name: traffic_lights_regression
# Step 3: Phase-1 residual-bug regression. Confirms the "green-start -> junction
# over-speed -> drift onto wrong road" bug is numerically resolved by Phase 2.
# Run after A2's Phase-2 planner is accepted (pre-Phase-2 these correctly fail).
defaults:
  dt: 0.05
  max_time: 36.0
  snapshots: 3
scenarios:
  - scenario: resources/xosc/verification/05_anticipation/traffic_lights_junction.xosc
    expectations: resources/xosc/verification/05_anticipation/traffic_lights_junction.expectations.yaml
    report: decel
