name: anticipation_v2
# Mid/long anticipation batch. NOTE: no `baseline:` entries — for the mid/long
# case, position equivalence vs the Default controller is meaningless (a
# zero-inertia Default car takes curves/turns at cruise that a physics car
# cannot). Judgment is done entirely from VirtualDriver telemetry via the
# deceleration_profile_smooth / speed_reduction_before_landmark matchers.
# (These scenario xosc embed the VirtualDriverController, so they cannot be
# re-run as Default to synthesize a baseline anyway.) The `compare` path stays
# available in the CLI for scenarios that have a genuine Default source.
defaults:
  dt: 0.05
  max_time: 30.0
  snapshots: 3
scenarios:
  - scenario: resources/xosc/verification/05_anticipation/decelerate_for_curve.xosc
    expectations: resources/xosc/verification/05_anticipation/decelerate_for_curve.expectations.yaml
    report: decel
  - scenario: resources/xosc/verification/05_anticipation/decelerate_for_right_turn.xosc
    expectations: resources/xosc/verification/05_anticipation/decelerate_for_right_turn.expectations.yaml
    report: decel
  - scenario: resources/xosc/verification/05_anticipation/cross_straight_junction.xosc
    expectations: resources/xosc/verification/05_anticipation/cross_straight_junction.expectations.yaml
    report: decel
  - scenario: resources/xosc/verification/05_anticipation/speed_limit_change.xosc
    expectations: resources/xosc/verification/05_anticipation/speed_limit_change.expectations.yaml
    report: decel
