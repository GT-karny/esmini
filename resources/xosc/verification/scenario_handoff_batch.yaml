name: scenario_handoff
origin: feature:F7   # 由来（工程）はメタデータ。名前には焼き込まない — capability_model.md §7.1 規約2
# feature:F7 scenario-driven control handover (docs/virtualdriver/design/
# scenario_control_handoff_design.md). No OSI capture needed -- the sole
# matcher (vd_control_relinquished) reads telemetry.vd_active only. No
# `baseline:` -- judgment is from VirtualDriver telemetry, same convention as
# car_following_traffic_control (which this manifest deliberately does NOT
# touch: a separate manifest + separate baseline, per design doc Fact M).
#
# Run:
#   DriverScript/.venv/Scripts/python.exe GT_esmini/scripts/verification/gt_sim_test.py batch \
#       resources/xosc/verification/scenario_handoff_batch.yaml --out test_results/regression/scenario_handoff
defaults:
  dt: 0.05
  max_time: 20.0
  snapshots: 3
  osi: false
scenarios:
  - scenario: resources/xosc/verification/08_handoff/scenario_deactivate_vd.xosc
    expectations: resources/xosc/verification/08_handoff/scenario_deactivate_vd.expectations.yaml
  # feature:F7 — the OTHER route out of control. The scenario above hands back
  # via Activate()-with-OFF-modes; this one has a domain taken away, which
  # upstream implements as DeactivateDomains() on the incumbent. Two different
  # code paths to the same obligation (release the servo), so both are gated.
  #
  # This was briefly left out on the reasoning that teardown and re-activation
  # cancel within one frame and so could not be seen in per-frame telemetry.
  # That was wrong, and measuring settled it: after the per-domain teardown the
  # following Activate() is ACTIVE->ACTIVE, which deliberately does NOT re-run
  # SetUpControlOutputs(), so vd_active stays false for the rest of the run.
  - scenario: resources/xosc/verification/08_handoff/scenario_domain_takeover_vd.xosc
    expectations: resources/xosc/verification/08_handoff/scenario_domain_takeover_vd.expectations.yaml
  # feature:F7 — the third case is not a route out of control but a SPLIT of it:
  # ManualDrive keeps lateral while VirtualDriver keeps longitudinal, both active
  # at once, for the whole run. The two above assert that a controller let go;
  # this one asserts that two controllers coexist with one domain each and a
  # single physics integrator underneath (docs/virtualdriver/design/
  # domain_split_ownership.md). It is the only entry here whose matcher checks
  # the travelled/reported speed ratio, because a split is the only shape that
  # can silently merge at the state stage and report a speed the vehicle is not
  # actually doing.
  - scenario: resources/xosc/verification/08_handoff/scenario_split_domain_md_vd.xosc
    expectations: resources/xosc/verification/08_handoff/scenario_split_domain_md_vd.expectations.yaml
