{
  "metadata": {
    "controller": "PythonDriverController",
    "acceptance_gate": "scenario_semantics_aligned_kpi"
  },
  "features": [
    {
      "id": "F01",
      "name": "Embedded input decode",
      "validation_goal": "C++→Python→C++のフレーム単位データ受け渡しが整合し、制御ループが継続動作する",
      "scenario": "GT_esmini/test/scenarios/pythondriver_f01_udp_input_decode.xosc",
      "run_args": "--record sim.dat --log_level info",
      "required_patterns": ["PythonDriverController::Activate\\(\\) called", "PythonDriverBridge: Initialized successfully"],
      "forbidden_patterns": ["PYTHON INITIALIZATION FAILED", "Python bridge is not initialized", "PythonDriverController: Python initialization failed", "PythonDriverController: step\\(\\) failed"],
      "kpi_checks": [
        {"metric": "duration_s", "min": 9.0},
        {"metric": "xy_path_length_m", "min": 50.0}
      ],
      "kpi_checks_any": []
    },
    {
      "id": "F02",
      "name": "LightMask mapping",
      "validation_goal": "Pythonが返す全ライト制御（light_mask + brake/reverse）がOSI出力へ厳密一致で反映される",
      "scenario": "GT_esmini/test/scenarios/pythondriver_f02_lightmask_mapping.xosc",
      "run_args": "--record sim.dat --log_level info",
      "collect_osi_light_metrics": true,
      "required_patterns": ["PythonDriverController::Activate\\(\\) called", "PythonDriverBridge: Initialized successfully"],
      "forbidden_patterns": ["PYTHON INITIALIZATION FAILED", "Python bridge is not initialized", "PythonDriverController: Python initialization failed", "PythonDriverController: step\\(\\) failed"],
      "kpi_checks": [
        {"metric": "light_mapping_match_ratio", "equals": 1.0},
        {"metric": "light_mapping_latency_frames_max", "max": 1},
        {"metric": "light_mapping_missing_samples", "equals": 0},
        {"metric": "light_state_observed", "equals": true}
      ],
      "kpi_checks_any": []
    },
    {
      "id": "F03",
      "name": "Auto brake/reverse lights",
      "validation_goal": "AutoLight（Brake/Reverse/Indicator）が手動ライト指定なしで正しく反映される",
      "scenario": "GT_esmini/test/scenarios/pythondriver_f03_brake_reverse_auto_light.xosc",
      "run_args": "--record sim.dat --log_level info --autolight",
      "collect_osi_light_metrics": true,
      "required_patterns": ["PythonDriverController"],
      "forbidden_patterns": ["PYTHON INITIALIZATION FAILED", "Python bridge is not initialized", "PythonDriverController: Python initialization failed", "PythonDriverController: step\\(\\) failed"],
      "kpi_checks": [
        {"metric": "signed_speed_min_mps", "max": -0.5},
        {"metric": "reverse_on_ratio_in_reverse_window", "min": 0.9},
        {"metric": "brake_on_ratio_in_braking_window", "min": 0.9},
        {"metric": "indicator_on_ratio_in_lanechange_window", "min": 0.7},
        {"metric": "indicator_off_ratio_outside_lanechange_window", "min": 0.9},
        {"metric": "indicator_dominant_side_ratio_in_lanechange_window", "min": 0.8},
        {"metric": "light_transition_latency_frames_max", "max": 2},
        {"metric": "light_missing_samples", "equals": 0},
        {"metric": "light_state_observed", "equals": true}
      ],
      "kpi_checks_any": []
    },
    {
      "id": "F04",
      "name": "Longitudinal profile transition quality",
      "validation_goal": "目標速度への遷移品質を3区間モデル（加速・収束・維持）で検証する",
      "scenario": "GT_esmini/test/scenarios/pythondriver_f04_lon_profile_output.xosc",
      "run_args": "--record sim.dat --log_level info",
      "required_patterns": ["PythonDriverController"],
      "forbidden_patterns": ["PYTHON INITIALIZATION FAILED", "Python bridge is not initialized", "PythonDriverController: Python initialization failed", "PythonDriverController: step\\(\\) failed"],
      "kpi_checks": [
        {"metric": "accel_phase_mean_acc", "min": 0.5},
        {"metric": "settle_time_s", "max": 4.0},
        {"metric": "overshoot_ratio", "max": 0.15},
        {"metric": "steady_state_std_mps", "max": 0.8}
      ],
      "kpi_checks_any": []
    },
    {
      "id": "F05",
      "name": "Waypoint/Route following over intersections",
      "validation_goal": "交差点を跨ぐRoute指定に対して縦横安定を維持しながら経路追従する",
      "scenario": "GT_esmini/test/scenarios/pythondriver_f05_waypoint_output.xosc",
      "run_args": "--record sim.dat --log_level info",
      "required_patterns": ["PythonDriverController", "AssignRoute"],
      "forbidden_patterns": ["PYTHON INITIALIZATION FAILED", "Python bridge is not initialized", "PythonDriverController: Python initialization failed", "PythonDriverController: step\\(\\) failed"],
      "kpi_checks": [
        {"metric": "s_progress_m", "min": 60.0},
        {"metric": "lane_change_count", "max": 1},
        {"metric": "t_abs_max_m", "max": 3.0},
        {"metric": "road_id_mode", "in": [197, 242, 230]},
        {"metric": "road_id_change_count", "min": 1}
      ],
      "kpi_checks_any": []
    },
    {
      "id": "F06",
      "name": "AssignRoute handling",
      "validation_goal": "AssignRouteで指定した経路拘束に沿って交差点経由で前進する",
      "scenario": "GT_esmini/test/scenarios/pythondriver_f06_assign_route.xosc",
      "run_args": "--record sim.dat --log_level info",
      "required_patterns": ["PythonDriverController", "AssignRoute"],
      "forbidden_patterns": ["PYTHON INITIALIZATION FAILED", "Python bridge is not initialized", "PythonDriverController: Python initialization failed", "PythonDriverController: step\\(\\) failed"],
      "kpi_checks": [
        {"metric": "s_progress_m", "min": 60.0},
        {"metric": "lane_change_count", "max": 1},
        {"metric": "road_id_mode", "in": [217, 240, 235]},
        {"metric": "road_id_change_count", "min": 1}
      ],
      "kpi_checks_any": []
    },
    {
      "id": "F07",
      "name": "LaneChange handling",
      "validation_goal": "複数車線区間で明示的レーンチェンジを完了する",
      "scenario": "GT_esmini/test/scenarios/pythondriver_f07_lane_change.xosc",
      "run_args": "--record sim.dat --log_level info",
      "required_patterns": ["PythonDriverController", "LaneChange"],
      "forbidden_patterns": ["PYTHON INITIALIZATION FAILED", "Python bridge is not initialized", "PythonDriverController: Python initialization failed", "PythonDriverController: step\\(\\) failed"],
      "kpi_checks": [
        {"metric": "lane_change_count", "min": 1},
        {"metric": "lane_id_end", "equals": -2},
        {"metric": "t_span_m", "min": 1.0},
        {"metric": "s_progress_m", "min": 40.0}
      ],
      "kpi_checks_any": []
    },
    {
      "id": "F08",
      "name": "LaneOffset handling",
      "validation_goal": "曲線路で同一レーン内オフセット制御を実行し、過大逸脱なく追従する",
      "scenario": "GT_esmini/test/scenarios/pythondriver_f08_lane_offset.xosc",
      "run_args": "--record sim.dat --log_level info",
      "required_patterns": ["PythonDriverController", "LaneOffset"],
      "forbidden_patterns": ["PYTHON INITIALIZATION FAILED", "Python bridge is not initialized", "PythonDriverController: Python initialization failed", "PythonDriverController: step\\(\\) failed"],
      "kpi_checks": [
        {"metric": "lane_change_count", "equals": 0},
        {"metric": "t_span_m", "min": 0.5},
        {"metric": "t_abs_max_m", "max": 3.0},
        {"metric": "s_progress_m", "min": 40.0}
      ],
      "kpi_checks_any": []
    },
    {
      "id": "F09",
      "name": "FollowTrajectory handling",
      "validation_goal": "曲線路で指定軌道追従により横挙動変化を発生させる",
      "scenario": "GT_esmini/test/scenarios/pythondriver_f09_follow_trajectory.xosc",
      "run_args": "--record sim.dat --log_level info",
      "required_patterns": ["PythonDriverController", "FollowTrajectory"],
      "forbidden_patterns": ["PYTHON INITIALIZATION FAILED", "Python bridge is not initialized", "PythonDriverController: Python initialization failed", "PythonDriverController: step\\(\\) failed"],
      "kpi_checks": [
        {"metric": "s_progress_m", "min": 40.0}
      ],
      "kpi_checks_any": [
        {"metric": "t_span_m", "min": 0.3},
        {"metric": "lane_change_count", "min": 1}
      ]
    },
    {
      "id": "F10",
      "name": "LongitudinalDistanceAction handling",
      "validation_goal": "先行車との目標車間を維持する縦制御挙動を示す",
      "scenario": "GT_esmini/test/scenarios/pythondriver_f10_longitudinal_distance_action.xosc",
      "run_args": "--record sim.dat --log_level info",
      "required_patterns": ["PythonDriverController", "LongitudinalDistanceAction"],
      "forbidden_patterns": ["PYTHON INITIALIZATION FAILED", "Python bridge is not initialized", "PythonDriverController: Python initialization failed", "PythonDriverController: step\\(\\) failed"],
      "kpi_checks": [
        {"metric": "lead_gap_end_m", "target": 12.0, "tolerance": 6.0},
        {"metric": "speed_min_mps", "min": 0.0}
      ],
      "kpi_checks_any": []
    },
    {
      "id": "F11",
      "name": "SpeedProfileAction handling",
      "validation_goal": "速度プロファイルアクションによる明確な加減速遷移を示す",
      "scenario": "GT_esmini/test/scenarios/pythondriver_f11_speed_profile_action.xosc",
      "run_args": "--record sim.dat --log_level info",
      "required_patterns": ["PythonDriverController", "SpeedProfileAction"],
      "forbidden_patterns": ["PYTHON INITIALIZATION FAILED", "Python bridge is not initialized", "PythonDriverController: Python initialization failed", "PythonDriverController: step\\(\\) failed"],
      "kpi_checks": [
        {"metric": "speed_max_mps", "min": 11.0},
        {"metric": "speed_span_mps", "min": 4.5}
      ],
      "kpi_checks_any": []
    },
    {
      "id": "F12",
      "name": "SynchronizeAction handling",
      "validation_goal": "同期アクションにより目標車両との相対位置へ収束する",
      "scenario": "GT_esmini/test/scenarios/pythondriver_f12_synchronize_action.xosc",
      "run_args": "--record sim.dat --log_level info",
      "required_patterns": ["PythonDriverController", "Synchronize"],
      "forbidden_patterns": ["PYTHON INITIALIZATION FAILED", "Python bridge is not initialized", "PythonDriverController: Python initialization failed", "PythonDriverController: step\\(\\) failed"],
      "kpi_checks": [
        {"metric": "lead_gap_end_m", "target": 5.0, "tolerance": 3.0},
        {"metric": "speed_min_mps", "min": 0.0}
      ],
      "kpi_checks_any": []
    },
    {
      "id": "F13",
      "name": "HostVehicleData and ADAS passthrough",
      "validation_goal": "HostVehicleData/ADAS中継が継続し、制御継続性を損なわない",
      "scenario": "GT_esmini/test/scenarios/pythondriver_f13_hvd_adas_passthrough.xosc",
      "run_args": "--record sim.dat --log_level info",
      "required_patterns": ["PythonDriverController"],
      "forbidden_patterns": ["PYTHON INITIALIZATION FAILED", "Python bridge is not initialized", "PythonDriverController: Python initialization failed", "PythonDriverController: step\\(\\) failed"],
      "kpi_checks": [
        {"metric": "duration_s", "min": 9.0},
        {"metric": "s_progress_m", "min": 30.0}
      ],
      "kpi_checks_any": []
    },
    {
      "id": "F14",
      "name": "DriverScript longitudinal/ACC",
      "validation_goal": "ACC由来の縦制御で前進維持しつつ速度変化が観測される",
      "scenario": "GT_esmini/test/scenarios/pythondriver_f14_driverscript_acc.xosc",
      "run_args": "--record sim.dat --log_level info",
      "required_patterns": ["PythonDriverController"],
      "forbidden_patterns": ["PYTHON INITIALIZATION FAILED", "Python bridge is not initialized", "PythonDriverController: Python initialization failed", "PythonDriverController: step\\(\\) failed"],
      "kpi_checks": [
        {"metric": "s_progress_m", "min": 40.0},
        {"metric": "speed_span_mps", "min": 2.0}
      ],
      "kpi_checks_any": []
    },
    {
      "id": "F15",
      "name": "DriverScript lateral/LKAS/lane-change",
      "validation_goal": "LKAS維持とレーンチェンジイベント応答を複数車線路で確認する",
      "scenario": "GT_esmini/test/scenarios/pythondriver_f15_driverscript_lateral_lkas.xosc",
      "run_args": "--record sim.dat --log_level info",
      "required_patterns": ["PythonDriverController", "LaneChange"],
      "forbidden_patterns": ["PYTHON INITIALIZATION FAILED", "Python bridge is not initialized", "PythonDriverController: Python initialization failed", "PythonDriverController: step\\(\\) failed"],
      "kpi_checks": [
        {"metric": "lane_change_count", "min": 1},
        {"metric": "lane_id_end", "equals": -2},
        {"metric": "t_abs_max_m", "max": 3.5},
        {"metric": "s_progress_m", "min": 40.0}
      ],
      "kpi_checks_any": []
    }
  ]
}
