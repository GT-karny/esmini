  - road/lateralProfile/shape@c
  - road/lateralProfile/shape@d
  # P7 RED: <shape> (lateralProfile cross-section poly) lands L1 in a later WP with degrade-to-equivalent-
  # superelevation (WARN). Audit must then emit ZERO entries; baseline DLL emits 'road/lateralProfile/shape
  # (road=1)', so this fixture is RED now.
  expected_unsupported_entries: []
  # Harness extension A: sample world z at center (t=0) and t=+/-3 at a few s. Constant linear crossfall
  # z(t)=0.02*t is authored (plus a cubic term from s=50). rm_expect_z is DEFERRED to WP2 (the degrade
  # semantics constant is fixed there); leaving the assertion unset for now -- z_probe values still record.
  rm_z_probe:
  - [0.0, 0.0]
  - [0.0, 3.0]
  - [0.0, -3.0]
  - [50.0, 0.0]
  - [50.0, 3.0]
  - [50.0, -3.0]
  - [100.0, 0.0]
  # WP2 (P7) analytic pin. Degrade: shape b=0.02 (same at all s) -> equivalent superelevation
  # roll = atan(0.02); esmini world z(t) = z_centerline + sin(roll)*t (Track2XYZ rot_mat_road_[2][1]=
  # cos(pitch)*sin(roll)*t, pitch=0, z_centerline=0). sin(atan(0.02)) = 0.02/sqrt(1.0004) = 0.019996001,
  # so z(t=+/-3) = +/-0.059988. Piecewise-constant roll -> identical at s=0/50/100.
  rm_expect_z:
  - {road: '1', s: 0.0,  t: 0.0,  z: 0.0}
  - {road: '1', s: 0.0,  t: 3.0,  z: 0.059988}
  - {road: '1', s: 0.0,  t: -3.0, z: -0.059988}
  - {road: '1', s: 50.0, t: 0.0,  z: 0.0}
  - {road: '1', s: 50.0, t: 3.0,  z: 0.059988}
  - {road: '1', s: 50.0, t: -3.0, z: -0.059988}
  - {road: '1', s: 100.0, t: 0.0, z: 0.0}
