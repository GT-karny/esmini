# which have been DELETED. Regenerate baselines per GT_esmini/test/odr_fixtures/README.md.
#
# Conventions:
#   * ALL paths are repo-root-relative with forward slashes.
#   * control_set  = repo-owned roads (resources/xodr + road_catalog/generated). Goldens REQUIRED;
#                    this is the audit-zero-warn universe (plan sec 3.3). expected.rm_init is pass
#                    for every entry; expected.schema is the FROZEN observed baseline (some repo
#                    assets carry pre-existing schema nonconformance -- resources/ is off-limits).
#   * fixtures     = conformance fixtures (official ASAM + hand-authored + injector-generated).
#                    official/* require the ASAM zips (requires: [asam_zips]) and are skip-eligible
#                    when absent. expected{} freezes the P0 baseline; XPASS (expected fail but
#                    passed) fails the run to force manifest acknowledgement.
#   * expected/observed schema: pass|fail ; rm_init: pass|fail (crash is frozen as fail).

