    evidence: "3766-3797, 6905-6960 (id via EstablishUniqueIds)"
    notes: "@id read twice: EstablishUniqueIds (6913/6915, string+ullong for unique-id assignment) and directly as rid_str (3772). @junction looked up via LookupJunctionIdFromStr; '-1'/absent tolerated. @rule only 'LHT'/'lht' recognized -> LEFT_HAND_TRAFFIC, else RIGHT_HAND_TRAFFIC default."
