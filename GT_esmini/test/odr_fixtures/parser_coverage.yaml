# What GT_RoadManager.cpp (fork of upstream v3.3.0 ab7c404d, patch 1-A only) reads from xodr DOM.
# Path convention: relative to OpenDRIVE root, no leading slash; laneSection sides explicit (left|center|right).
# Generated by static audit 2026-07-02 for plan P1; every entry carries line evidence.
#
# Scope = DOM reads on the xodr parse path only:
#   OpenDrive::LoadOpenDriveFile (5535) -> ParseOpenDriveXML (3701-5498) and everything they reach,
#   plus the parse-time helper functions those call:
#     - RoadLink::RoadLink(LinkType, node)            (2562-2612)  road/link/successor|predecessor
#     - LaneRoadMark::ParseColor(node)                (1527-1578)  reads @color on caller node
#     - ReadUserData(node, code, default)             (652-663)    reads userData@code/@value on caller node
#     - ReadAttribute(node, name, required)           (3642-3668)  reads named attr on caller node
#     - OpenDrive::EstablishUniqueIds(parent, name)   (6905+)      reads @id on road / junction
#     - OpenDrive::ParseGeoLocalization(str)          (7134+)      parses geoReference TEXT (no attrs)
# CheckConnections() / SetRoadOSI() and later passes operate on built structures (out of scope).
