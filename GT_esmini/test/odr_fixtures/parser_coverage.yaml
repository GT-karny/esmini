summary:
  # 2026-07-02 (plan P1 OdrCoverageAudit): +9 whitelist-only paths added on top of the
  # original 78 audited-read paths. 8 are intermediate CONTAINERS the parser navigates by
  # name via node.child() but reads no attributes of (road/link, road/planView,
  # road/elevationProfile, road/lateralProfile, road/objects/object/markings, and the three
  # road/lanes/laneSection/{left,center,right}/lane/link) - needed so the audit DFS descends
  # to their already-listed children instead of flagging the container as topmost-unsupported.
  # 1 is road/surface (empty container in control files; consumed:none, cluster 18 backlog).
  #
  # Additionally, 9 whitelist-only ATTRIBUTES were added (consumed: none) so the 1.4/1.5 control
  # set stays warning-free: the 8 standard optional <header> attrs name/version/date/north/south/
  # east/west/vendor (present on ~every real file; the parser reads only revMajor/revMinor) and the
  # standard <lane> @level (present on ~every lane; the parser does not read it). These are STANDARD
  # <=1.5 attributes, NOT 1.6-1.9 extensions, so suppressing them raises no honesty concern; genuine
  # 1.8 lane attrs (direction/advisory/dynamic*/roadWorks) remain unlisted and still flag.
  # Also whitelisted-only (consumed: none, all STANDARD <=1.5, keep control set clean):
  #   object@subtype/dynamic/validLength, outline@fillType/laneType/outer, roadMark@material.
  #
  # P5 (cluster 5/7/22) added 4 junction element paths that ARE consumed at side-model L1 (not by the
  # fork parser): junction/crossPath, junction/crossPath/startLaneLink, junction/crossPath/endLaneLink,
  # junction/roadSection -> captured into OdrJunctionExtras (OdrJunctionExtras.cpp). junction/priority
  # was reclassified from whitelist-only(consumed:none) to L1-captured (cluster 7, F3 source). The
  # laneLink @overlapZone/@fromLayer/@toLayer attributes were added to the junction/connection/laneLink
  # attr set (also L1-captured). These are NOT [ODR-UNSUPPORTED] suppressions -- they are real L1 storage.
  total_element_paths: 92                  # +4 P5 junction paths (crossPath/startLaneLink/endLaneLink/roadSection)
  total_element_paths_original_read: 78
  total_element_paths_whitelist_only: 9    # 9 containers/surface (junction/priority reclassified to L1-captured, P5)
  total_element_paths_side_model_l1: 5     # P5: crossPath + start/endLaneLink + roadSection + priority (OdrJunctionExtras.cpp)
  total_distinct_attributes_read: 94
  total_distinct_attributes_whitelist_only_note: >
    Whitelist-only attrs (consumed: none): header name/version/date/north/south/east/west/vendor,
    lane @level, object subtype/dynamic/validLength, outline fillType/laneType/outer, roadMark
    @material, junction/priority high/low. All are STANDARD <=1.5 attributes the parser deliberately
    does not read; none is a 1.6-1.9 extension. Genuine 1.6-1.9 attrs (lane direction/advisory/
    dynamic*/roadWorks, lanes @layer, laneSection @length, laneLink from/toLayer, junction mainRoad/
    orientation/sStart/sEnd, object temporary/invalidated, signal temporary/invalidated, repeat
    bT/cT/dT/detachFromReferenceLine) remain UNLISTED and still flag as [ODR-UNSUPPORTED].
  attribute_reconciliation:
    grep_pattern: '.attribute("<name>"'
    total_attribute_call_hits_whole_file: 233
    distinct_attribute_name_literals_whole_file: 81   # sort -u of .attribute("name")
    distinct_literals_mapped_in_yaml: 81              # 100% - grep-minus-yaml is EMPTY
    distinct_literals_unmapped: 0
    extra_attrs_via_ReadAttribute_helper: 13          # object/repeat attrs not read via .attribute("name") literal
    note: >
      RECONCILIATION RESULT: 81 distinct .attribute("name") string literals appear in the file
      (accurate `grep -oE | sort -u` count; an earlier raw count of 82 double-counted). ALL 81
      are mapped to element paths above (set difference grep-minus-yaml is empty). The YAML lists
      94 distinct attributes because object/repeat reads 13 further attributes
      (distance,tStart,tEnd,heightStart,heightEnd,zOffsetStart,zOffsetEnd,widthStart,widthEnd,
      lengthStart,lengthEnd,radiusStart,radiusEnd) via ReadAttribute(repeat_node,"name",...) at
      5042-5062 rather than a literal .attribute("name") - these are real reads through the helper,
      so 94 = 81 literals + 13 helper reads (with s,length overlapping). Every one of the 233 raw
      .attribute( call hits is either a mapped named literal, a mapped as_ullong/as_uint/as_double
      variant of one, or the ReadAttribute helper indirection - none is out of scope.
    out_of_scope_tokens:
      - name: "+a / +proj / +units / +zone / +lat_0 / +lon_0 / ... (geoReference keys)"
        reason: "NOT XML attributes - '+key' tokens inside the geoReference TEXT content, parsed by ParseGeoLocalization (7168+) via std::getline on space/'=' chars, never via node.attribute(). Do not whitelist as header/geoReference@<key>."
    parse_range_helpers_in_scope:
      - "ReadUserData 652-663 (userData@code,@value) - reached from roadMark/marking/tunnel/object"
      - "LaneRoadMark::ParseColor 1527-1578 (@color) - reached from roadMark, roadMark/type/line, roadMark/explicit implicit, object/marking"
      - "RoadLink ctor 2562-2612 (@elementType,@elementId,@contactPoint) - reached from road/link/successor|predecessor"
      - "RMObject::Str2Type 2990-3005 (no attr read; string map; LOG_ERROR 3002)"
      - "ReadAttribute 3642-3668 (named attr) - reached from object/repeat"
      - "EstablishUniqueIds 6905-6960 (@id) - reached for road and junction"
      - "ParseGeoLocalization 7134-7233 (geoReference TEXT tokens, no .attribute())"
  subtleties:
    - "countryRevision INVERTED-READ BUG (4821-4824, upstream-inherited): 'if (attr.empty()) country_revision = attr.as_uint()' - the attribute is read ONLY when ABSENT (yielding 0); an explicit value is IGNORED. Explicit alpha-2/revision dynamic signals get demoted from TrafficLight to static Signal (plan breakage #1). Plan P1 keeps absent->0 legacy-preserving semantics; naive absent->2013 kills all existing TrafficLights."
    - "Unknown lane @type -> LOG_ERROR (4223) then LANE_TYPE_NONE. walking/curb/shared/slipLane (1.6/1.8) are not in the string map, so they silently degrade to NONE -> OSI TYPE_UNKNOWN (plan breakage #2, cluster 3)."
    - "Unknown object @type -> LOG_ERROR 'Unsupported object type' (3002) inside RMObject::Str2Type, then NONE."
    - "Unknown outline corner element -> SILENTLY skipped: the first_child() loop (5174) only builds a corner for names 'cornerRoad'/'cornerLocal'; any other child leaves corner=nullptr and is dropped with no diagnostic (5197). curveLocal (1.9) hits this."
    - "junction/connection abort (5433-5437): a missing connectingRoad -> LOG_WARN + 'return false' aborting the ENTIRE ParseOpenDriveXML (not just the connection). Plan P1 degrades this to WARN+continue for official 1.8 fixture loadability."
    - "virtual junction -> LOG_WARN + treated as DEFAULT (5406); crossing junction has no branch and also falls through to DEFAULT -> ghost TYPE_INTERSECTION + dropped crossPath (plan breakage #3, cluster 5/6)."
    - "lateralProfile is consumed for <superelevation> ONLY (4053 next_sibling('superelevation')); <shape> children are never visited (cluster 17 backlog), so a road with only <shape> gets no lateral profile silently."
    - "<lanes> generic children loop (4077) recognizes exactly laneOffset + laneSection; the laneSection children loop (4102) recognizes left/right/center (+userData debug-skip). Anything else -> LOG_ERROR. No <lanes @layer> read (1.9 lane layers, cluster 4)."
    - "roadMark @color 'missing' handling is version-gated: only when versionMajor==1 && versionMinor>4 does UNDEFINED get promoted to STANDARD white with a WARN (4374); this is the ONLY consumer of versionMinor_ - there is otherwise no version gate anywhere (plan 1.1)."
    - "signal @length is (mis)named 'depth' locally (4878) and used as the sign board depth, not a longitudinal length."
    - "geoReference '+proj' style keys are TEXT tokens parsed by string-splitting in ParseGeoLocalization (7168+), NOT XML attributes - do not treat them as header/geoReference@proj etc. in the audit."
    - "consumed: partial reads that still whitelist (no warning) but discard data: junction/connection@id ((void)idc 5418); lane/material @surface/@roughness (only sOffset+friction, 4660); roadMark @material (hardcoded, never read); laneSection/userData (detected+LOG_DEBUG skipped, 4107)."
    - "@id is read via TWO mechanisms for road and junction: EstablishUniqueIds (6913 string + 6915 as_ullong, for internal unique-id assignment/conflict resolution) AND the direct rid_str/jid_str reads - both are the same DOM attribute."
