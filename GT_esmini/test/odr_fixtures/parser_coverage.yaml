  - path: header
    attrs: [revMajor, revMinor, name, version, date, north, south, east, west, vendor]
    evidence: "3733-3737 (revMajor/revMinor read); rest whitelisted-only (see notes)"
    notes: >
      READ: revMajor->versionMajor_, revMinor->versionMinor_ (versionMinor_ is only consumed at
      4374, the roadMark color default gate versionMinor_>4; no other version gate exists, plan 1.1).
      WHITELISTED-ONLY (consumed: none): name, version, date, north, south, east, west, vendor are
      the STANDARD optional <header> attributes defined since OpenDRIVE <=1.5. GT_RoadManager.cpp
      does not read them (confirmed: only revMajor/revMinor are pulled in the header block, 3733-3737;
      header/offset note at 3748+ explicitly lists these as 'NOT read'). They appear on essentially
      every real xodr (name/date/north/south/east/west in all 113 audited universe files, version in
      58) so they are whitelisted with empty semantics to keep the 1.4/1.5 control set warning-free
      (plan P1). They are NOT 1.6-1.9 extensions -> no diagnostic is warranted. Added to the whitelist
      2026-07-02 for plan P1 OdrCoverageAudit (originally only revMajor/revMinor were listed).
