    attrs: [id, name, type]
    evidence: "5393-5410, 6905-6960 (id via EstablishUniqueIds)"
    notes: "@id read twice (EstablishUniqueIds 6913/6915 + jid_str 5397). @type 'direct'->DIRECT, 'virtual'->LOG_WARN+DEFAULT (5406), else DEFAULT. 'crossing' junctions fall through to DEFAULT (plan breakage #3). @mainRoad/@sStart/@sEnd/@orientation (virtual) NOT read."
  - path: junction/connection
    attrs: [id, incomingRoad, connectingRoad, linkedRoad, contactPoint]
    evidence: "5412-5462"
    notes: "@linkedRoad read ONLY for DIRECT junctions; @connectingRoad read otherwise (5423-5430) - mutually exclusive by junction type. @id read then discarded ((void)idc 5418) -> consumed: partial. Missing connecting road -> LOG_WARN + return false (ABORTS whole parse, subtlety 5436). @type/@from/@to (crossing crossPath) NOT read."
  - path: junction/connection/laneLink
    attrs: [from, to]
    evidence: "5466-5471"
    notes: "@fromLayer/@toLayer/@overlapZone (1.9/1.8) NOT read."
  - path: junction/controller
    attrs: [id, type, sequence]
    evidence: "5477-5484"
    notes: "junction-scoped controller (distinct from top-level controller)."
  - path: junction/priority
    attrs: [high, low]
    evidence: "n/a (NOT read by parser)"
    notes: >
      consumed: none. <priority high low> (junction connection priority) is a STANDARD OpenDRIVE
      element since <=1.5 (XSD t_junction_priority 1272-1276) that GT_RoadManager.cpp does NOT read.
      It is cluster 7 (junction priority; the canonical priority source for feature F3, targeted for
      real L1 storage in plan P5 / the F3 week). Emitted by priority_injector.py, so it appears in
      generated road-catalog fixtures (4way_priority__*, t_junction_priority__*). Whitelisted here as
      a known tracked element (attrs high/low listed) to keep the control set warning-free in P1;
      the actual priority data is captured into OdrJunctionExtras in P5. Added 2026-07-02 for plan P1.
