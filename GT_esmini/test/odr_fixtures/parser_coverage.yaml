    notes: "Dispatched by name in header children loop. Stored in geo_offset_ and applied to planView geometry (3941-3946). Other header attrs (name, version, date, north/south/east/west, vendor) and children (license, defaultRegulations) are NOT read by upstream; license/defaultRegulations are stored by the GT side model (P4, below)."
