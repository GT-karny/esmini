# g2: 1.9 lane-layer construct ("<lanes layer> x2", plan 1.2).
# In 1.9 t_road allows <lanes> maxOccurs="2": one permanent + one temporary
# layer (e_layerType = permanent|temporary). We mark the existing lanes
# permanent and inject a second, temporary <lanes> layer with its own
# laneSection.
#   * permanent laneSection must NOT carry @length (1.9 assert) -> base has none.
#   * temporary layer carries laneSection/@length (a sub-range roadworks layer
#     idiom); a temporary layer is where @length becomes meaningful.
# The two <lanes> must be adjacent in t_road's sequence, so the new layer is
# inserted before <objects>.
id: g2_lanes_layer_19
base: resources/xodr/straight_500m.xodr
rev: "9"
ops:
  # Base normalisation: center lane forbids <userData> under 1.8+ (see g1 note).
  - op: remove_element
    xpath: "road[@id='1']/lanes/laneSection/center/lane/userData"
  - op: set_attr
    xpath: "road[@id='1']/lanes"
    attr: "layer"
    value: "permanent"
  - op: add_xml
    xpath: "road[@id='1']"
    before: "objects"
    xml: |
      <lanes layer="temporary">
          <laneSection s="0.0" length="500.0">
              <center>
                  <lane id="0" type="none" level="false"/>
              </center>
              <right>
                  <lane id="-1" type="driving" level="false">
                      <width sOffset="0.0" a="3.5" b="0.0" c="0.0" d="0.0"/>
                  </lane>
              </right>
          </laneSection>
      </lanes>
