manifest: resources/xosc/verification/manualdrive_adas_batch.yaml
note: 'Committed baseline for ADAS running ALONGSIDE a human driver (gate:manualdrive-adas-regression,
  run_regression_gate.ps1 Step 2.10). Scope: req-vd-ad:REQ-AD-025 (AEB+FCW), REQ-AD-026 (ACC),
  REQ-AD-027 (LKA+LDW), REQ-AD-028 (face-3 observability incl. DriverOverride), REQ-AD-030 (MSL),
  REQ-AD-031 (Stop&Go a/b) -- realized by vd-func:FUNC-075 / FUNC-079 / FUNC-080 / FUNC-081.
  ALL THIRTY ARE GREEN as recorded (2026-08-06): this baseline carries NO known-red, so ANY
  deviation is a real regression -- including an unexpected PASS, which on the negative rows
  (md_aeb_no_conflict, md_aeb_no_conflict [adas_off], md_lka_drift [below_band],
  md_lka_lane_change_with_indicator, ...) would mean a discriminator stopped discriminating.

  Positives and negatives share ONE manifest and ONE baseline deliberately: nearly every claim
  here is only a claim as a pair ("intervenes on a collision course" needs "does not intervene
  otherwise"; "assists lane keeping" needs "yields instantly to a steering driver"). Splitting
  them would let the trade "loosen a threshold, pass the positive, break the negative" walk
  through the gate. Several rows are the SAME xosc run under two configurations (the batch
  ''variant'' key, shown as `<scenario>__<variant>` run dirs): those pairs are how the
  UNAVAILABLE-vs-STANDBY three-value discipline and the speed-limit/speed-band gates are
  asserted at all, so a variant row going missing is itself a regression.

  EVERY new feature in this batch ships DEFAULT OFF; the batch turns them on per scenario via
  injected ManualDrive config. So a red here means the ManualDrive ADAS stack changed -- it does
  not mean default behaviour changed.

  Freeze provenance (2026-08-06, build from commit 2937062d): the batch was run THREE times
  back to back before this file was written. All three were 30/30 pass with error=0 and no
  access violation, and their decision fields (post-arbitration throttle/brake/steering/gear
  plus the per-function State, DriverOverride and custom_state columns) were byte-identical
  across all 20400 frames of each run -- the self-determinism control that verification plan
  sec7-5 requires BEFORE any expectation is frozen. Freezing on a single run risks baking in
  either the intermittent native crash recorded in docs/virtualdriver/measurements/
  gt_sim_test_intermittent_crash_2026-08-05.md (which makes scenarios error out, not fail) or
  a non-deterministic frame. If a future red shows `error`, check for an access violation
  FIRST and re-run that scenario alone: deviations are not evidence about a scenario that never
  got measured.

  Compared per-scenario/per-matcher by scripts/check_regression_baseline.py. Refresh ONLY after
  an intentional behaviour change, with --update, and review the diff before committing.'
