  red_hold_stop_line_paired_farside:
    status: pass
    matchers:
    - event: stopped_at_signal
      status: pass
    - event: speed_below
      status: pass
  stop_sign_stop_line_paired:
    status: pass
    matchers:
    - event: stopped_at_stop_sign
      status: pass
    - event: speed_above
      status: pass
