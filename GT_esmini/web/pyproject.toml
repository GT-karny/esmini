[project]
name = "gt-esmini-web"
version = "0.1.0"
description = "REST API + Web UI for GT_Sim simulation management"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.18",
    "aiosqlite>=0.21.0",
    "pyyaml>=6.0",
    "grpcio>=1.78.0",
    "protobuf>=5.26.0",
    "watchdog>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pytest-asyncio>=0.24.0",
]
build = [
    "pyinstaller>=6.0",
    "grpcio-tools>=1.78",
]

# This subtree is consumed via pathex (PyInstaller) and uvicorn string-import
# at runtime, not as an installed Python package. Disable setuptools auto-
# discovery so `pip install -e .` only resolves [project.dependencies].
[tool.setuptools]
packages = []

# Backend unit tests (audit WEB-7/TST-5). Run from the repository root with the
# project venv (bare python/pip is denied by the guard hook):
#
#   DriverScript/.venv/Scripts/python.exe -m pytest GT_esmini/web/backend/tests
#
# tests/conftest.py puts the repo root on sys.path (the backend is imported as
# the namespace package GT_esmini.web.backend, same as the server does).
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
