[project]
name = "gt-esmini-web"
version = "0.1.0"
description = "REST API + Web UI for GT_Sim simulation management"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.18",
    "aiosqlite>=0.21.0",
    "pyyaml>=6.0",
    "grpcio>=1.78.0",
    "protobuf>=5.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pytest-asyncio>=0.24.0",
]
