appId: com.gt.gt-sim
productName: GT_Sim

# Bundled main process + preload
files:
  - dist/**/*
  - package.json
  - assets/**/*

# Resources copied alongside the asar
extraResources:
  # Built React frontend (served by FastAPI)
  # Note: In packaged mode, FastAPI serves the frontend from its own bundle.
  # This is reserved for future use (e.g., offline fallback).
  []

win:
  target:
    - target: dir
      arch: x64
  icon: assets/icon.ico
  signDlls: false
forceCodeSigning: false

# Native modules that must be unpacked from asar
asar: true
asarUnpack: []

npmRebuild: true
