  # ----- B3 意図伝達（tactical・自車の意図を外へ出す） -----
  - { id: FUNC-061, tier: compliance, layer: tactical, kind: behavior, agent: AD, dim: none, status: partial, by: 'vd-component:auto-indicator-policy', note: "方向指示器の自発操作。マニューバ発起(FUNC-055..059)に同期して法定タイミングで合図。AutoIndicator/IndicatorFSM が基盤(単体テスト有)。2026-08-02: **FUNC-055(経路要求LC)の発起に同期**(DetectManeuverDir を storyboard LC→AD発起LC→0 の3段へ拡張)。2026-08-02: **法定タイミングを距離で実装**(req-vd-ad:REQ-AD-018 段a、同 §11。DetectManeuverDir を4段へ拡張し lc_signal_dir_ が発起しきい値の v×lane_change_indicator_lead_time_s だけ手前で先行点灯。既定3.0s=道交法53条1項/施行令21条1項の「進路変更は3秒前」。matcher:indicator_leads_lane_change が判定)。2026-08-03: **距離形を前進予測形へ置き換え、REQ-AD-018 段b/段c を達成**(同 §11-11)。`dist - (v+v_pred)/2*T <= required(v_pred)`、`v_pred = min(v + max(0,a)*T, max(v, v_cap))`。a=0 で旧式と厳密一致するため定速時の挙動は不変(実測でも定速リードが修正前後 2.95s のまま・t_arm は4本とも同一＝発起側不変)。a は pos_.GetAccLong()(1フレーム遅延)、v_cap は既存メンバ last_action_target_(補間中の target_speed ではない — あれを使うと前進予測が無効化される)。チャタリング対策は EMA でなく**ホップ単位のラッチ**。**実測: リード 0.40→2.30s(強加速)/4.45→7.00s(ギャップ待ち)/3.05s(定速・t_sig 近傍 a=0.00066 m/s²)/2.10→3.05s(緩加速)**、立ち上がりは全4本1回でチャタリング無し。段b/c 用に検証資産2本追加(lane -3 発進で n_remaining=1 にして助走を確保)。残る未達3件=(1)最終バンド(dist_to_connection==-1)では先行しない(ShouldAttempt は true・ShouldSignal は false の非対称。発起側を触るためスコープ外) (2)経路要求以外の車線変更発起が未同期=REQ-AD-018 段d。**2026-08-03 に段dの範囲を切り直した**: FUNC-057(交差点)は右左折であって車線変更でなく法定も距離規定なので REQ-AD-018 から外し req-vd-ad:REQ-AD-021 へ分離、FUNC-058(発進)は dim:lon の Stop&Go 出口で指示器不要(対象は「車線外から車線内へ横移動する発進=出庫」だが対応するマヌーバ機能IDが未存在)、FUNC-059(合流)は経路要求として現れる分は既に段a-cの機構で合図が出る。段dに残る実体は FUNC-056(追い越し)と出庫と非経路の合流 (3)~~右左折側~~=**req-vd-ad:REQ-AD-021 は 2026-08-04 に段a/b/c すべて達成、解消済み**(下記)。＝partial の理由は現在(1)(2)のみ。2026-08-04: **右左折側(REQ-AD-021)を根治し段a/b/cを達成**(docs/virtualdriver/design/junction_turn_signal.md)。2026-08-03 実測の欠陥3件=接続路33.2mで**点灯フレーム0**・接続路14.87mで**7.18m手前**(法定の約1/4)・**旋回完了2.76秒前に消灯**。原因は1つの関数に集中していた: RouteLookaheadJunctionTurnDirection は junction 所属 road を素通りし出口側の腕に到達して初めて返すため、(i)点灯に`入口までの距離+接続路長 < lookahead`が要り接続路長が単独でlookaheadを超えると構造的に点灯不能、(ii)ego が接続路に乗ると current_track 自身が junction road になり passed_junction が立たず旋回中は必ず0を返す。**根治は「1つの lookahead が2つの役目(方向の特定/合図の開始)を兼ねていた」ことの分離**: (a)方向を**接続路自身の幾何**(進入/退出ヘディング差、既存 IsSharpJunctionConnector と同じ SetTrackPos(0)/(length)+GetH() 手法から fabs を外し GetDrivingDirectionRelativeRoad() で走行方向補正)から決め接続路長依存を消す、(b)トリガを**距離第一級** `max(indicator_min_distance_m=30.0, v*indicator_lead_time)` にし旧`+10`(接続路長に食われるぶんの代償・根拠なし)を削除、(c)`start`自身が junction road なら走査に入らずその接続路の幾何から返す(**ラッチでなく状態を持たない判定**なので DetectJunctionTurn は const のまま・交差点内で信号待ち/譲り待ちで停止しても速度非依存で落ちない)。さらに**1フレーム先を見る項** `reach = trigger + v*dt` を追加: 離散サンプリングでは`dist<=30.0`を最初に満たすフレームが既に法定地点を通過済みで、この項の前は接続路33.2mで**29.74m**と法定をわずかに割っていた(施行令21条1項は合図を開始していなければならない地点を定めるので早い側は適合・遅い側は不適合)。§11-11 と同じ動き。**実測(2026-08-04)**: 14.87m接続路 7.18→**30.63m**、33.2m接続路 0フレーム→**30.32m**、直進通過は800フレーム全消灯、旋回中は進入11.85s→接続路脱出14.90sまで継続。点灯時刻で`v*lead`=22.5/23.2mと30.0を下回り**法定の床が支配項**だったので段c(低速)も同時に実証。matcher:indicator_leads_junction_turn / signal:junction_turn_signal_distance を新設し**常設ゲート(anticipation_driving_batch=Step2.7+CI)に結線済み**(REQ-AD-018 の sustained-by 未結線を再生産しないため同サイクルで実施)。**副産物**: decelerate_for_right_turn は名前に反し幾何は**左折**(arc curvature +0.108108・delta +1.608rad)で、実測 left は正しく方向バグではない。改名は別サイクル" }
  - { id: FUNC-062, tier: courtesy,   layer: tactical, kind: behavior, agent: AD, dim: none, status: none,    by: '', note: "制動灯/ハザードによる後続への伝達。急減速・停止時の予告。OSI vehicle_lights に出る＝観測可能" }
