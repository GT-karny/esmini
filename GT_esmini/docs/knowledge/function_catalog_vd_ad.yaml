  - { id: FUNC-051, tier: '-',    layer: strategic,   kind: behavior, agent: AD, dim: both, status: none,    by: '', note: "動的リルート。閉塞・通行不能・工事を検知して経路を再計画。イレギュラー対応の strategic 側" }
  - { id: FUNC-052, tier: '-',    layer: strategic,   kind: behavior, agent: AD, dim: both, status: none,    by: '', note: "ルート維持・逸脱復帰。off-route を検知し復帰経路を立てる。issue #31 の予測walkerが off-route に落ちる件と同根の欠落" }
  - { id: FUNC-053, tier: safety, layer: tactical,    kind: behavior, agent: AD, dim: both, status: none,    by: '', note: "経路上の静止障害物回避。停止車・落下物・路上作業を避けつつルートへ復帰する（避けた先で FUNC-052 に戻る）。**発端の「障害物回避してルート維持」軸の本体**。動機は safety だが階層は tactical" }
  - { id: FUNC-054, tier: '-',    layer: strategic,   kind: behavior, agent: AD, dim: lon,  status: none,    by: '', note: "到達判定・ミッション終了。目的地/退出点の認識と安全な停車。シナリオ終端条件と VD 内部状態の整合" }

