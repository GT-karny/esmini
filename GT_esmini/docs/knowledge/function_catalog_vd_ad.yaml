  - { id: FUNC-056, tier: comfort,    layer: tactical, kind: behavior, agent: AD, dim: both, status: partial, by: 'vd-component:overtake-maneuver', note: "追い越しの発起・完遂。2026-08-04実装(OvertakeManeuver): req-vd-ad:REQ-AD-023(追い越す)と req-vd-ad:REQ-AD-024(経路を逃さない)を実現。FUNC-055 の1ホップ機構(ArmLaneChangeHop/ResumeMergeProfile)の上に**動機を1つ足す**形で、軌道生成は無改造流用。**既定 OFF**(overtake_enabled。lane_change_initiation_enabled とは独立キー)。対向車線追い越しは overtake_use_opposing_lane_enabled で二重に閉じ既定 OFF。設計の主題は『**追い越しには締切が無い**』こと(overtake_maneuver.md §1) — FUNC-055 は法定3秒を距離のしきい値競争で解いたが、追い越しは待つ代償が無いので**合図→ドウェル T 秒→発起のタイマ形**にした。結果リードは近似でなく設計上ちょうど T。**『遅い』に定数を置いていない**: t_pass = L_clear/dv <= overtake_max_pass_time_s に畳むと速度差の下限 dv_min = L_clear/t_max が導出量になり config に現れない。追い越しレーンは『レーン id が 0 に近づく側の隣接レーン』の1規則で RHT/LHT 両方が正しい。**制限速度は守り切る**(v_pass = min(last_action_target_, GetSpeedLimit())、追い越し用の上乗せ経路は無い)。**実測(2026-08-04、実Releaseビルド、overtake_batch.yaml 4/4 pass・21/21 must)**: 往路リード2.95s/復路3.00s(方向L→Rで逆転)、lane -2→-1→-2、対向車線側は -1→+1→-1、deviation_count=0 で junction を実通過(track 0→101→2)。**partial の理由は FUNC-030(追い越し禁止区間)未実装で禁止区間を無視して追い越すこと**(REQ-AD-023 段f)と**見通し距離モデルが無いこと**(同 段g)、および復路の隙間が空かない場合の振る舞いが未観測(REQ-AD-024 段d)。FUNC-044(譲り)との相互作用は未着手" }
