  #  どう耐えるか・他者をどう読むか」＝運転タスクの残り半分。
  # ============================================================================

  # ----- B1 Mission / 経路計画（strategic・"目的地到達"軸の本体） -----
  - { id: FUNC-049, tier: '-',    layer: strategic,   kind: behavior, agent: AD, dim: both, status: partial, by: 'road', note: "目的地ルーティング。起点→目的地の road/lane 列を生成し保持する。RoadPath による経路探索が基盤。req-vd-ad:REQ-AD-016（将来課題）。**issue #31 は RoadPath の欠陥ではなくルート記述側の欠落**（junction 跨ぎは 元Arm→ConnectingRoad→行先Arm の各 Road に Waypoint が要る）で、車線変更しないと成立しないレーン接続を人間が Waypoint で手当てせねばならないこと自体が本機能と FUNC-050/055 の不在を示す。tier='-'＝動機でなくタスク達成そのもの" }
