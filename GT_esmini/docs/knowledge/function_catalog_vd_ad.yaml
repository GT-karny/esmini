  - { id: FUNC-028, tier: compliance, layer: strategic,   kind: behavior, agent: AD, dim: lat,  status: partial, by: 'road',                     note: "通行区分(LHT/RHT)遵守。どちら側を走るか＝strategic。道路遷移/indicatorで一部実現" }
