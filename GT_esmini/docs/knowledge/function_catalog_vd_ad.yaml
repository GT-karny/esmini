  - { id: FUNC-030, tier: compliance, layer: tactical,    kind: behavior, agent: AD, dim: lat,  status: none,    by: '', note: "追い越し禁止/実線遵守。no-overtakingゾーン＝FUNC-056発起の抑止条件。道路標示データ依存" }
  - { id: FUNC-031, tier: compliance, layer: operational, kind: behavior, agent: AD, dim: lon,  status: none,    by: '', note: "踏切一時停止。鉄道横断の停止義務。OdrRailroad(道路)有・VD挙動未" }
  - { id: FUNC-032, tier: compliance, layer: operational, kind: behavior, agent: AD, dim: lon,  status: none,    by: '', note: "スクールゾーン/速度ゾーン遵守。区域データ依存" }
  - { id: FUNC-033, tier: compliance, layer: strategic,   kind: behavior, agent: AD, dim: both, status: none,    by: '', note: "進入禁止/一方通行遵守。経路計画(FUNC-049)の制約として効く。道路属性依存" }
  - { id: FUNC-034, tier: compliance, layer: strategic,   kind: behavior, agent: AD, dim: lat,  status: none,    by: '', note: "右左折禁止(turn restriction)遵守。同上＝経路探索の制約" }
  - { id: FUNC-035, tier: compliance, layer: strategic,   kind: behavior, agent: AD, dim: lat,  status: none,    by: '', note: "バス/専用レーン遵守。レーンレベル経路計画(FUNC-050)の制約" }
