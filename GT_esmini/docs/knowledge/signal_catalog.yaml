      距離を測る matcher が原理的に書けない（同 §3-4）。
      dir は gate 前の**生**の検出方向である。点灯前から非0になるので、matcher は
      「dir!=0 を伴うランプの立ち上がり」で車線変更由来の点灯と区別できる。
      dist_to_entry_m は 2.0 m 刻み走査の量子化を pos.GetS() で補正した値（同 §2-4）。
      exposure=frame は lane_change_signal_timing と同じ理由（OSI/HVD に対応概念が無い GT 独自
