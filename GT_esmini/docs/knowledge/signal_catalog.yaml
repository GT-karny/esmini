    note: >-
      matcher:indicator_leads_junction_turn が読む。**距離**が観測対象であり、
      signal:lane_change_signal_timing（**秒**）とは測る次元が違う（junction_turn_signal.md §4-1）。
      法定が距離規定（道交法53条1項／施行令21条1項「交差点の手前の側端から 30 m 手前」）である
      ためで、車線変更の「3秒前」とは根拠から別物。
      **on_connector が本 signal の要である**: テレメトリには「その road が junction 所属か」を
      示す情報が他に一切無く（road id だけでは判定できない）、Python 側の検証ハーネスは xodr への
