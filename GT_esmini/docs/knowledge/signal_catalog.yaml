  - id: lane_id_indicator_nonvd
    title: lane_id / 方向指示器（Kinematic・RouteDrive）
    exposure: [osi]
    state: "(b)"
    emit: GT_OSIReporter_Moving.cpp:835（lane_id）／:568（indicator）
    note: >-
      OSI には汎用経路で出ているが、**telemetry frame を作るのは VD だけ**なので
      frame/matcher に一切届かない。面3が面2テレメトリに依存している構造的帰結
      （§0.3 の結合負債が「VD以外を検証できない」形で表面化した例）。
      lane_id の emit 実体は 2026-07-21（spine-work:osi-assigned-lane-driving）以降
      キャッシュ走行レーン（`Position::GetLaneId` 由来、`ResolveMovingObjectAssignedLaneGlobalId`）
      ＝旧 `GetLaneGlobalId()` の (s,t) 再探索を廃し border/sidewalk へのドリフトを解消。
      2026-07-24 から **deprecated field 移行の dual emit**: MovingObject 直下 field4
      （OSI 3.7.0 で deprecated）と後継 `MovingObjectClassification.assigned_lane_id` の
      両方に同値を出す。旧 field を残す理由は replayer `osi_receiver.cpp` と upstream UDP
      サンプル群が field4 直読みで R1 により GT から修正不可のため。GT 自前消費者
      （gt_sim_test `lane_global_id`）は classification 優先＋旧 field fallback に移行済み。
      片寄せ（旧 field 廃止）は upstream/OSI 4.0 の動きに合わせて別途判断。
      自車側の消費（lane_keep / lane_change_count が OSI 車線で判定）は 2026-07-24 に
      面1化済み＝ signal:ego_lane を参照。本 signal の (b) は「非VD車のレーンが
      frame に届かない」構造問題として残る。

