  - id: manualdrive_driver_override
    title: ManualDrive の運転者上書き事象（DriverOverride / custom_state）
    exposure: [hvd, frame]
    state: "●"
    emit: >-
      GT_HostVehicleReporter.cpp（UpdateFromObjectState の ADAS 行ループ、
      AdasFunctionOverride.reported が真の行にだけ driver_override を書き、
      custom_state は非空のときだけ set）／AdasFunctionReport.cpp
      （BuildManualAdasFunctionReport、ゲートが開いている行に reported を立て、
      アクセル起因は active + custom_state="DRIVER_OVERRIDE_ACCEL"）／
      AdasCoexistenceStack.cpp（producer: decision.driver_override_accel = kickdown_effective）
    note: >-
      **2026-08-05 フェーズB（req-vd-ad:REQ-AD-028 段b）で新設**。上の
      `manualdrive_adas_states` が「機能がどの状態だったか」を運ぶのに対し、この signal は
      「その状態を**運転者が上書きしたか、何によって上書きしたか**」を運ぶ。OSI 上でも
      別フィールド（`VehicleAutomatedDrivingFunction.driver_override` と `custom_state`）で
      あり、State 列からは導出できない——だから独立した観測量として起こす。
      matcher:driver_override_reported が唯一の消費者（on-demand 原則）。

      **規格制約**: `DriverOverride.Reason` 列挙は brake_pedal / steering_input の**2値のみ**で、
      アクセル起因を表す値が無い（osi_hostvehicledata.proto 実物を確認済み）。したがって
      アクセル経路は `custom_state="DRIVER_OVERRIDE_ACCEL"` で補完する（設計書§8-3）。
      この signal を読む側は、`reasons` が空でも `custom_state` を見なければ上書きを
      見落とすことに注意。

      **`reported`（＝OSI submessage の有無）が意味を持つ**: submessage を書くのは
      「その機能が実際に動いていたフレーム」だけで、config OFF / ドメイン非所有の行は
      **書かない**。これにより面3は「評価して上書き無しと測った」（present かつ
      active=false）と「誰も見ていない」（present 無し）を区別できる——後者を前者と
      同一視すると、スタックが一度も走っていない実行で負の matcher が緑になる。
      `manualdrive_adas_states` の STANDBY/UNAVAILABLE 規律と同じ形を上書きチャネルへ
      適用したもの。

      **●であっても producer は1経路だけ**: 現時点で上書きを生むのはキックダウン
      （アクセル起因）のみ。brake 理由は ACC（フェーズC）、steering 理由は LKA
      （フェーズD）が実装されて初めて生じる。ただしそれらの機能自体が存在しない以上
      「観測できていない上書き」も存在しないため、観測可能性としては ● で正しい。
      増分は `req-vd-ad:REQ-AD-028` の `acceptance_ladder`（段b は `met: false` のまま）
      が持つ——signal の state を曖昧化して持たせない、というこの上の項と同じ規約。

  - id: manualdrive_acc_settings
    title: 手動運転中 ACC の設定値と実効値（設定速度・実効上限・車間段階・実測THW）
    exposure: [hvd, frame]
    state: "●"
    emit: >-
      AdasCoexistenceStack.cpp（`gt.acc.set_speed_mps` / `gt.acc.effective_cap_mps` /
      `gt.acc.thw_setting_s` / `gt.acc.thw_actual_s` / `gt.acc.thw_stage` /
      `gt.acc.stop_hold` / `gt.acc.engaged` / `gt.acc.setting_changed` ほかを PolicyDetail へ）
      → AdasFunctionReport.cpp（`gt.acc.` 接頭辞で gt.acc 行へ振り分け）
      → GT_HostVehicleReporter → HVD custom_detail → vd_metrics.py の hvd.adas["gt.acc"].detail
    note: >-
      **2026-08-05 フェーズC（req-vd-ad:REQ-AD-026 / REQ-AD-031）で新設**。
      この signal の要点は **「設定した」と「効いた」が別の観測量として出ている**ことにある。
      REQ-AD-026 段e/g/h はいずれも「運転者が設定を変えた」ではなく「変更が実際に効いた」を
      問うており、片方しか出ていない実装——設定を保存して適用しないもの——は、設定値だけを
      読む観測からは正しく見える。だから `set_speed_mps` と `effective_cap_mps`、
      `thw_setting_s` と `thw_actual_s` を対で持つ。
      `thw_actual_s` は LeadVehicleAware 自身が出す `gt.lead_vehicle.gap_m` を自車速で割った
      再輸出であり、独立の先行車探索はしない（PolicyDetail.hpp の TryGetDetail 参照）——
      「追従している相手」の定義が2つに割れる方が、観測チャネルを1段経由するより悪い。
      消費者: matcher:setting_reflected（設定→実効の段差）、matcher:stop_hold_stationary
      （`gt.acc.stop_hold` を保持区間のアンカーに使う）、matcher:adas_state_sequence /
      adas_state_matches（状態列は manualdrive_adas_states 側）。
      `gt.acc.setting_changed` は matcher の**構造的赤**のための量: 操作が1回も起きなかった
      run と、設定を保存して適用しない実装は、どちらも定数列を作る。区別できないまま緑に
      するくらいなら赤にする、という判断を matcher 側が実装している。

      **★2026-08-06（フェーズE / req-vd-ad:REQ-AD-029）: 消費者が面3だけではなくなった**。
      運転席 UI（`GT_esmini/web/frontend/src/components/HvdGaugePanel.tsx`）が、
