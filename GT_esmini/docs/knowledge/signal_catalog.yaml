    exposure: [frame]
    state: "(b)"
    emit: VirtualDriverTelemetryJson.cpp:25-28（transition エッジは feature:F7 commit 91c9fed7 で追加）
    note: >-
      gt_lib.py が毎フレーム GT_GetVirtualDriverTelemetry を telemetry.jsonl へ取り込むため
      frame 面には既に届いている（PM 直読 2026-07-25）が、読む matcher が無い＝未配線。
      配線候補: テイクオーバー系 matcher（例: resumed_to_auto_within）を起こすときに observes 辺で結線。
      OSI 側 DriverOverride は未populate（vd-func:FUNC-075 の④と同根）。

  - id: lane_change_signal_timing
    title: AD発起の車線変更で、合図要求と方向指示器ランプが発起に対していつ立つか
    exposure: [frame]
    state: "●"
    emit: ControllerVirtualDriver.cpp:1068-1099（lc_signal_dir_ 確定）→ :1721（telemetry_.lane_change.signal_active）→ VirtualDriverTelemetryJson.cpp:263-272（lane_change ブロック）／ランプ側は AutoIndicatorPolicy.cpp:6-39 → ControllerVirtualDriver.cpp:1425-1426（ApplyLights）→ VirtualDriverTelemetryJson.cpp:157（indicator ブロック）
    note: >-
      matcher:indicator_leads_lane_change が読む。**2つの量の時間関係**が観測対象であり、
      片方だけでは足りない（lane_change_initiation.md §11-8）: signal_active は「AD-LC 経路が
      指示器を要求している」という**意図**で、意図が AutoIndicatorPolicy に握り潰されても真に
      なりうる。indicator.left/right は**ランプの実態**だが、点灯理由が AD-LC の先行合図なのか
      DetectJunctionTurn の交差点旋回なのかを区別できない。matcher は両方を見て
      「signal_active の立ち上がりが armed の立ち上がりに先行し、その区間ランプが実際に
      点いていた」ことを判定する。signal:vehicle_lights とは**別の signal** — あちらは
      AutoLightController → OSI 経路の灯火であり、canonical 面も emit 経路も異なる。
      exposure=frame は route_lane_conformance と同じ理由（OSI/HVD に対応概念が無い GT 独自
      VD テレメトリ）。

  - id: route_lane_conformance
    title: ego が route の要求するレーン帯（目標レーン集合）に居るか
    exposure: [frame]
    state: "●"
    emit: RouteLanePlan.cpp:233,360（BuildRouteLanePlan/EvaluateRouteLaneStatus）→ ControllerVirtualDriver.cpp:1451-1462（telemetry_.route_lane 代入）→ VirtualDriverTelemetryJson.cpp:241-258（route_lane ブロック）
    note: >-
      matcher:route_lane_plan_holds が読む（vd_metrics.py:1520-1677）。target_lanes/
      on_target_lane/dist_to_connection/deviation_count/diagnostic を route_lane 1ブロックに
      まとめて持つ（route_lane_plan_design.md §4-2）。RouteLanePlan は ITrafficPolicy を
      経由しない独立層（同 §3-2、policy ではない）のため、policy_constraint_tier /
      aeb_trigger_flag と同型の「OSI/HVD に対応概念が無い GT 独自 VD テレメトリ専用」
      exposure=frame。route を持たないエンティティ（AssignRouteAction 未使用シナリオが
      大半）では diagnostic=="no_route" として現れる（劣化ではなく通常状態、同 §4-5）。
