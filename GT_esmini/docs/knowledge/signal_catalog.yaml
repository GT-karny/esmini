      導入コミット d6c5f10c が意図的にそう設定）＝**主要な運用面では emit されている**。
      OFF なのはライブラリ既定・生CLI・**検証ハーネス**（gt_sim_test.py は vehicle_physics を
      一度も参照しない＝grep 0件）。→ 欠は emit でなく**検証パスへの配線**: 打ち手は
      「検証ハーネスにフラグを通して matcher を作る」＝(b)。
      語彙の教訓: (a)/(b) に収まらない第3の状態に見えたら、まず**打ち手を書き下す**。
      打ち手が既存分類のどれかと一致するなら、それは新語彙ではなく分類の誤り。

