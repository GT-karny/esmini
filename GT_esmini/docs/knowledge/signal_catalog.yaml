      （ControllerManualDrive.hpp:36）＝**W1 と完全に同型**（GT_esminiLib.cpp:1512 が空のまま返り
      `size()>=24` ガードで素通り、AddADASFunctionEx 不到達）② AebSafety は ITrafficPolicy 実装で
      ControllerVirtualDriver.cpp:103 でのみ生成＝ManualDrive からの到達連鎖が無い ③「横だけ自動」の
      実体は ManualDriveCoordinator.cpp:21-26 の素の OSC private action 追従（VD/Kinematic/AEB 非介在）
      ④ OSI DriverOverride（W4）は populate 箇所ゼロ。GT_esminiLib.cpp:1312-1315 で ManualDrive
      搭載車は自動スタックから明示除外。→ **派生レポートが (a) に挙げるのは誤検出ではなく真の検出**。
      (-) に寄せると穴が消える。機能ギャップ（ManualDrive 中の ADAS 全停止）は別プログラム規模。

