  - from: matcher:speed_reduction_before_landmark
    to: gate:anticipation-driving-regression
    type: sustained-by
    source: resources/xosc/verification/anticipation_driving_batch.yaml
    note: 4シナリオ（curve/right_turn/speed_limit/traffic_lights）。ランドマーク手前で目標速度到達。
  - from: matcher:indicator_leads_junction_turn
    to: gate:anticipation-driving-regression
    type: sustained-by
    source: resources/xosc/verification/anticipation_driving_batch.yaml
    note: >-
