      片方だけを守ると「閾値を下げて正例を通し負例を壊す」取引が素通りするため。

  # ---- ⑥常設: 先読み運転 matcher を常設ゲートへ（2026-07-21・§5.1 の穴を塞ぐ） ----
  # sustained-by 欠6件（全て 05_anticipation 系）のうち5件を gate:anticipation-driving-regression
  # で閉じる（run_regression_gate.ps1 Step 2.7）。lane_change_count は本バッチに車線変更シナリオが
  # 無いため未カバー＝下の「引けなかった辺」に残す。速度系（speed_above/below/min_speed_above）は
