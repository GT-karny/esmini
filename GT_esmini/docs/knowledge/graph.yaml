  # 実際には vd-func:FUNC-050 -[realizes]-> req-vd-ad:REQ-AD-017 が既にあり、要求経由で
  # FUNC-050 への追跡可能性は保たれる。既存 verifies 辺 11/12 も宛先は req-vd-ad で、
  # 面3→面3 に収まっている。**検知器とテスト期待値は一切変えず、グラフ側を厳格な既存
  # パターンへ寄せる**ことで解消した（期待値を緩めるのは許容差の緩和にあたるため採らない）。
  # 検証しているのは REQ-AD-017 の段 a/b のみ。**どの段を検証済みかは要求側の
  # acceptance_ladder[].verified_by が持つ**（辺の粒度では段を表現できないため。
