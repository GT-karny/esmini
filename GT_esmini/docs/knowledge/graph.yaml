    type: sustained-by
    source: resources/xosc/verification/car_following_traffic_control_batch.yaml

  # ---- ⑥常設: AEB安全層を常設ゲートへ（2026-07-21・§5.1 の穴を塞ぐ） ----
  # 2026-07-20 の初回結線で「AEB(REQ-AD-001家族)を判定する matcher が常設ゲートに1件も
  # 乗っていない」ことが引けなかった辺として可視化された。gate:aeb-safety-regression を
  # 新設し（run_regression_gate.ps1 Step 2.6）、その3 matcher と要求2件を結線する。
  - from: matcher:impact_speed_below
    to: gate:aeb-safety-regression
    type: sustained-by
    source: resources/xosc/verification/aeb_safety_batch.yaml
    note: cutin_hard_brake（直進）。完全回避不能域での緩和＝閉じ速度 <= 10 m/s
  - from: matcher:min_obb_separation_above
    to: gate:aeb-safety-regression
    type: sustained-by
    source: resources/xosc/verification/aeb_safety_batch.yaml
    note: >-
      cutin_hard_brake_curve の完全回避判定（0.5m）＋ benign_cutin のサニティ（20m）。
      本 matcher は junction/crosswalk 系の手動マニフェストでも使われるが、
      **常設で守られるのは AEB 経由のこの2用法のみ**。
  - from: matcher:no_emergency_without_conflict
    to: gate:aeb-safety-regression
    type: sustained-by
    source: resources/xosc/verification/aeb_safety_batch.yaml
    note: 負例3件（normal_following / benign_cutin / parallel_overtake）の主判定
  - from: req-vd-ad:REQ-AD-001
    to: gate:aeb-safety-regression
    type: sustained-by
    source: resources/xosc/verification/aeb_safety_batch.yaml
    note: 正例2シナリオ（直進=緩和 / カーブ=完全回避）
  - from: req-vd-ad:REQ-AD-013
    to: gate:aeb-safety-regression
    type: sustained-by
    source: resources/xosc/verification/aeb_safety_batch.yaml
    note: >-
      負例3シナリオ（SOTIF ミラー）。正負を同一ゲート・同一ベースラインに置くのは、
      片方だけを守ると「閾値を下げて正例を通し負例を壊す」取引が素通りするため。

  # ---- ⑥常設: 手動運転中ADASを常設ゲートへ（2026-08-06・フェーズE） ----
  # フェーズA〜Dで①〜⑤は縫えていたが⑥が空で、--brief vd-func:FUNC-075 が
  # REQ-AD-025/028 について「判定 matcher はあるが常設ゲートに乗っていない
  # （一度検証したきり）」を出し続けていた。gate:manualdrive-adas-regression を
  # 新設し（run_regression_gate.ps1 Step 2.10 + manualdrive_adas_batch.yaml +
  # committed baseline）、要求6件・matcher 14件・機能4件を結線して閉じる。
  #
  # 二重結線しない: 本バッチは min_speed_above / speed_below / impact_speed_below
  # でも発火するが、この3件の常設保証は既に gate:vd-behavior-regression /
  # gate:aeb-safety-regression 側で済んでいる（gate:anticipation-driving-regression が
  # 速度系について立てたのと同じ判断）。
  - from: matcher:manual_aeb_fires
    to: gate:manualdrive-adas-regression
    type: sustained-by
    source: resources/xosc/verification/manualdrive_adas_batch.yaml
    note: 手動運転中の AEB 実介入（REQ-AD-025 段a）。md_aeb_unresponsive ほか4シナリオ
  - from: matcher:brake_not_stacked
    to: gate:manualdrive-adas-regression
    type: sustained-by
    source: resources/xosc/verification/manualdrive_adas_batch.yaml
    note: >-
      人間のブレーキに AEB を上乗せしない＝max合成（REQ-AD-025 段c）。
      **E2E 側の識別力には限界がある**（この幾何ではブレーキが 1.0 に飽和し、max合成と
      「合算してクランプ」が同じ観測値になる）。合成規則そのものの赤実証は
      test_PedalArbitrator.cpp が gate:unit-ctest 側で担う。
  - from: matcher:fcw_leads_intervention
    to: gate:manualdrive-adas-regression
    type: sustained-by
    source: resources/xosc/verification/manualdrive_adas_batch.yaml
    note: >-
      FCW が AEB 介入に先行する（REQ-AD-025 段e）。常設で守られるのは
      **候補が徐々に閾値へ近づく遭遇**（md_aeb_stationary_lead、実測リード 1.450 s）だけで、
      cut-in 類型ではリードが構造的に消える（design §3-2）。
  - from: matcher:adas_state_matches
    to: gate:manualdrive-adas-regression
    type: sustained-by
    source: resources/xosc/verification/manualdrive_adas_batch.yaml
    note: >-
      機能別 State の 3値規律（REQ-AD-028 段a）。本バッチ最多の 25 用法で、
      UNAVAILABLE（切ってあった）と STANDBY（見張っていて撃たなかった）の区別を
      同一 xosc の `variant` 2構成で判定している。
  - from: matcher:no_intervention_in_window
    to: gate:manualdrive-adas-regression
    type: sustained-by
    source: resources/xosc/verification/manualdrive_adas_batch.yaml
    note: 誤介入しないこと（REQ-AD-025 段b／REQ-AD-026 段b・f）。負側の主判定
  - from: matcher:driver_override_reported
    to: gate:manualdrive-adas-regression
    type: sustained-by
    source: resources/xosc/verification/manualdrive_adas_batch.yaml
    note: >-
      DriverOverride の面3報告（REQ-AD-028 段b）。3経路 accel（custom_state）/
      brake（REASON_BRAKE_PEDAL）/ steering（REASON_STEERING_INPUT）が
      **すべて常設で発火する**のは本ゲートが初めて。負方向は
      `driver_override.present` を要求する（書かれていなければ pass ではなく skip）。
  - from: matcher:adas_state_sequence
    to: gate:manualdrive-adas-regression
    type: sustained-by
    source: resources/xosc/verification/manualdrive_adas_batch.yaml
    note: ACC の状態遷移が操作と整合すること（REQ-AD-026 段b/c/f）
  - from: matcher:setting_reflected
    to: gate:manualdrive-adas-regression
    type: sustained-by
    source: resources/xosc/verification/manualdrive_adas_batch.yaml
    note: >-
      走行中の設定変更が実効値へ反映されること（REQ-AD-026 段e/h）。
      「設定した」と「効いた」を別の観測量で見るのが要点。
  - from: matcher:speed_capped_at
    to: gate:manualdrive-adas-regression
    type: sustained-by
    source: resources/xosc/verification/manualdrive_adas_batch.yaml
    note: 設定速度・制限速度キャップ・MSL の実効上限（REQ-AD-026 段a/g／REQ-AD-030）
  - from: matcher:no_brake_output
    to: gate:manualdrive-adas-regression
    type: sustained-by
    source: resources/xosc/verification/manualdrive_adas_batch.yaml
    note: MSL はスロットルを絞るだけでブレーキを出さない（REQ-AD-030 の負側）
  - from: matcher:stop_hold_stationary
    to: gate:manualdrive-adas-regression
    type: sustained-by
    source: resources/xosc/verification/manualdrive_adas_batch.yaml
    note: >-
      停止保持が実際に車両を止め続けること（REQ-AD-031 段a）。
      この判定は停止判定しきい値がクリープ床より上にあって初めて到達可能である
      （design §12 の恒久ルール）。
  - from: matcher:restart_after_trigger
    to: gate:manualdrive-adas-regression
    type: sustained-by
    source: resources/xosc/verification/manualdrive_adas_batch.yaml
    note: 人間の再発進操作で追従が復帰すること（REQ-AD-031 段b）
  - from: matcher:lane_kept_within
    to: gate:manualdrive-adas-regression
    type: sustained-by
    source: resources/xosc/verification/manualdrive_adas_batch.yaml
    note: >-
      LKA 補正で車線内に留まること（REQ-AD-027 段a）。**両極性を1つの matcher で持つ**
      ——速度域外の構成では逸脱が起きることを期待する側で判定する。
  - from: matcher:steer_output_absent
    to: gate:manualdrive-adas-regression
    type: sustained-by
    source: resources/xosc/verification/manualdrive_adas_batch.yaml
    note: >-
      抑制時に補正が出ないこと（REQ-AD-027 段b/c）。指示器・人間操舵・速度域外の
      3つの抑制経路それぞれで発火する。
  - from: req-vd-ad:REQ-AD-025
    to: gate:manualdrive-adas-regression
    type: sustained-by
    source: resources/xosc/verification/manualdrive_adas_batch.yaml
    note: 手動運転中 AEB＋FCW。正例（介入する）と負例（介入しない）が同一ベースラインに同居
  - from: req-vd-ad:REQ-AD-026
    to: gate:manualdrive-adas-regression
    type: sustained-by
    source: resources/xosc/verification/manualdrive_adas_batch.yaml
    note: 手動運転中 ACC（追従・解除と復帰・設定変更・速度域・制限速度キャップ・AEB独立性）
  - from: req-vd-ad:REQ-AD-027
    to: gate:manualdrive-adas-regression
    type: sustained-by
    source: resources/xosc/verification/manualdrive_adas_batch.yaml
    note: >-
      手動運転中 LKA＋LDW。**段d（FFB 反力として手に届くか）はこのゲートの射程外**で、
      G29 実機限定として field-test/realmachine_open_items.md R-7 に残る。
  - from: req-vd-ad:REQ-AD-028
    to: gate:manualdrive-adas-regression
    type: sustained-by
    source: resources/xosc/verification/manualdrive_adas_batch.yaml
    note: 面3観測性（State 3値規律・DriverOverride 3経路・ハーネスの HVD 直読）
  - from: req-vd-ad:REQ-AD-030
    to: gate:manualdrive-adas-regression
    type: sustained-by
    source: resources/xosc/verification/manualdrive_adas_batch.yaml
    note: MSL（スロットル片側クランプ・制限速度連動・キックダウン一時解除・ACC排他）
  - from: req-vd-ad:REQ-AD-031
    to: gate:manualdrive-adas-regression
    type: sustained-by
    source: resources/xosc/verification/manualdrive_adas_batch.yaml
    note: Stop&Go 段a/b のみ（段c/d＝時限・自動再発進は実装スコープ外）
  - from: vd-func:FUNC-075
    to: gate:manualdrive-adas-regression
    type: sustained-by
    source: scripts/run_regression_gate.ps1
    note: >-
      AEB 並行監視と横断基盤（ペダル envelope・HVD 報告経路・DriverOverride・警報チャネル）。
      gate:unit-ctest が部品の単体を守るのに対し、本ゲートは
      **ManualDriveCoordinator 経由の統合挙動**を守る（両方要る）。
  - from: vd-func:FUNC-079
    to: gate:manualdrive-adas-regression
    type: sustained-by
    source: scripts/run_regression_gate.ps1
    note: AccLonController の統合挙動（gate:unit-ctest は同機能の単体側）
  - from: vd-func:FUNC-080
    to: gate:manualdrive-adas-regression
    type: sustained-by
    source: scripts/run_regression_gate.ps1
    note: LaneKeepAssist の統合挙動（gate:unit-ctest は同機能の単体側）
  - from: vd-func:FUNC-081
    to: gate:manualdrive-adas-regression
    type: sustained-by
    source: scripts/run_regression_gate.ps1
    note: SpeedLimiter の統合挙動（gate:unit-ctest は同機能の単体側）

  # ---- ⑥常設: 先読み運転 matcher を常設ゲートへ（2026-07-21・§5.1 の穴を塞ぐ） ----
  # sustained-by 欠6件（全て 05_anticipation 系）のうち5件を gate:anticipation-driving-regression
  # で閉じる（run_regression_gate.ps1 Step 2.7）。lane_change_count は本バッチに車線変更シナリオが
  # 無いため未カバー＝下の「引けなかった辺」に残す。速度系（speed_above/below/min_speed_above）は
  # 本バッチでも発火するが gate:vd-behavior-regression で既に守られているため二重結線しない。
  - from: matcher:deceleration_profile_smooth
    to: gate:anticipation-driving-regression
    type: sustained-by
    source: resources/xosc/verification/anticipation_driving_batch.yaml
    note: >-
      decelerate_for_curve / decelerate_for_left_turn / speed_limit_change の3シナリオ。
      osi:true で **a=osi の面1直読加速度**（ego_accel_long ●）から bounded decel/jerk を判定。
  - from: matcher:speed_reduction_before_landmark
    to: gate:anticipation-driving-regression
    type: sustained-by
    source: resources/xosc/verification/anticipation_driving_batch.yaml
    note: 4シナリオ（curve/left_turn/speed_limit/traffic_lights）。ランドマーク手前で目標速度到達。
  - from: matcher:indicator_leads_junction_turn
    to: gate:anticipation-driving-regression
    type: sustained-by
    source: resources/xosc/verification/anticipation_driving_batch.yaml
    note: >-
      3シナリオ（decelerate_for_left_turn / junction_turn_signal_long_connector /
      cross_straight_junction）。このバッチは run_regression_gate.ps1 Step 2.7 と CI の
      vd-behavioral-regression ジョブの**両方**で走るため、新しい gate を起こさずに
      ⑥常設を満たせる（junction_turn_signal.md §4-3）。
      **req-vd-ad:REQ-AD-018 が sustained-by 未結線のまま放置されている状態を再生産しない**
      ために、matcher の新設と同じサイクルで結線した（あちらの route_lane_batch.yaml は
      baseline すら無く、ゲートにも CI にも載っていない孤立 matcher になっている）。
  - from: matcher:lane_keep
    to: gate:anticipation-driving-regression
    type: sustained-by
    source: resources/xosc/verification/anticipation_driving_batch.yaml
    note: >-
      curve / speed_limit / traffic_lights の3シナリオ。road_id / lane とも面1 lane_map
      (source_reference) 経由（★2026-07-24 更新: 旧「lane は telemetry＝assigned_lane_id は
      別量のため」は 7baf202d の走行レーン由来化と c22aeb5d の lane 面1化で解消。
      junction 内 171/15800 フレームのみ telemetry fallback）。
  - from: matcher:steer_not_saturated
    to: gate:anticipation-driving-regression
    type: sustained-by
    source: resources/xosc/verification/anticipation_driving_batch.yaml
    note: decelerate_for_left_turn / traffic_lights_junction。コーナーで操舵飽和なし（面2 driver.steer）。
  - from: matcher:no_constraint_kind
    to: gate:anticipation-driving-regression
    type: sustained-by
    source: resources/xosc/verification/anticipation_driving_batch.yaml
    note: cross_straight_junction。直進通過の接続路で junction 制約を上げない（面2 midlong.constraints）。

  # ---- ⑥常設: AutoLight/F6 の判定・常設は GT_Loader 統合テストに内包 ----
  # spine-work:vertical-wiring（2026-07-24）: 行列の生成ビュー化で AutoLight 行の
  # ⑤⑥が「✕＝結線欠落」と出た。実体は matcher でなく GT_esmini_Integration_* の
  # per-test アサーション（AutoLight/LightStateAction 6 ＋ F6 環境ヘッドライト 5）
  # ＝ gate:integration-ctest 内オラクル。sustained-by の from は従来 req/matcher
  # だが、matcher 台帳の外で判定される主張（feature 級）はこの辺でしか⑥に到達
  # できないため feature を from に許す（意味は同じ「どの常設ゲートで守られるか」。
  # opt-in・blocking:false の弱い常設であることは gate 側の台帳が持つ）。
  - from: feature:F6
    to: gate:integration-ctest
    type: sustained-by
    source: GT_esmini/docs/knowledge/gate_catalog.yaml
    note: >-
      F6 環境ヘッドライト 5本＋AutoLight/LightStateAction 6本の per-test
      アサーション（run_gt_tests.ps1 -IncludeIntegration、opt-in＝既定ゲート外）。
      「ビューワー目視未」は残る（アサーションは灯火状態変化のみ）。

  # ---- ゲート同士の構造（傘ラダーの構成） ----
  - from: gate:regression-gate
    to: gate:unit-ctest
    type: depends-on
    source: scripts/run_regression_gate.ps1
    note: Step 1（ハード）
  - from: gate:regression-gate
    to: gate:odr-conformance-quick
    type: depends-on
    source: scripts/run_regression_gate.ps1
    note: Step 1.5（ハード、-SkipOdr で除外可）
  - from: gate:regression-gate
    to: gate:vd-behavior-regression
    type: depends-on
    source: scripts/run_regression_gate.ps1
    note: Step 2（既定 WARN、-FailOnBehavioral でハード化）
  - from: gate:regression-gate
    to: gate:aeb-safety-regression
    type: depends-on
    source: scripts/run_regression_gate.ps1
    note: >-
      Step 2.6（既定 WARN、-FailOnBehavioral でハード化、-SkipAeb で単独スキップ）。
      Step 2 と同じ recipe（共有関数 Invoke-BehavioralBatch）を別マニフェスト・別ベースラインで回す。
  - from: gate:regression-gate
    to: gate:anticipation-driving-regression
    type: depends-on
    source: scripts/run_regression_gate.ps1
    note: >-
      Step 2.7（既定 WARN、-FailOnBehavioral でハード化、-SkipAnticipation で単独スキップ）。
      Step 2/2.6 と同じ共有関数 Invoke-BehavioralBatch を別マニフェスト・別ベースラインで回す。
  - from: gate:regression-gate
    to: gate:manualdrive-adas-regression
    type: depends-on
    source: scripts/run_regression_gate.ps1
    note: >-
      Step 2.10（既定 WARN、-FailOnBehavioral でハード化、-SkipManualAdas で単独スキップ）。
      Step 2/2.6/2.7 と同じ共有関数 Invoke-BehavioralBatch を別マニフェスト・別ベースラインで回す。
      番号は連番ラベルであって小数ではない（2.9 の次が 2.10）。
  - from: gate:odr-conformance-quick
    to: gate:fork-census
    type: depends-on
    source: scripts/run_odr_conformance.py
    note: >-
      :1556-1558 はプロファイル分岐より前で無条件＝CI の schema-only 起動でも走る。
      census/drift/resync-guards が「独立スクリプト」ではなく適合ハーネスに内包された
      常設ゲートであることは、名前からは読めない事実。
  - from: gate:odr-conformance-quick
    to: gate:fork-drift
    type: depends-on
    source: scripts/run_odr_conformance.py
  - from: gate:odr-conformance-quick
    to: gate:resync-guards
    type: depends-on
    source: scripts/run_odr_conformance.py
  - from: gate:odr-conformance-schema-ci
    to: gate:fork-census
    type: depends-on
    source: .github/workflows/ci.yml
    note: schema層のみの CI 起動でも census は走る（同上）
  - from: gate:fork-sync
    to: gate:fork-census
    type: complements
    source: GT_esmini/docs/fork_sync_manifest.yaml
    note: INBOUND（上流未取込）と OUTBOUND（フォーク会計）の対。どちらもLHTの*正しさ*は見ない
  - from: gate:odr-conformance-full
    to: gate:odr-conformance-quick
    type: supersedes
    source: scripts/run_odr_conformance.py
    note: >-
      full は quick の上位集合（+OSI層）だが**手動実行のみ**でどのラダーにも配線されていない。
      capability_model.md §2.3 D9 が OSI層を (b) と採点している当の理由。

  # ---- 引けなかった辺（縦串の切れた箇所・2026-07-20 実測の一次記録） ----
  # observes を引けなかった matcher（読む量に対応する signal が canonical 面に無い）:
  #   - ~~lane_keep / lane_change_count -> ego の lane_id~~
  #     ★2026-07-24 解消: 7baf202d（assigned_lane_id の走行レーン由来化）→ c22aeb5d
  #     （lane 面1化）で signal:ego_lane が成立し、observes 辺を結線済み（上記）。
  #     「同名の量が2面に別経路で存在し検証は面2側を見ている」状態は終了。
  #   - steer_not_saturated -> `driver.steer`（面2の操舵指令）。
  #     ★2026-07-20 訂正: 当初「乗り換え先の signal:hvd_steering_angle は (b′) 誤配線なので
  #     先に直す必要がある」と書いたが、**その (b′) 判定自体が誤診だった**
  #     （OSI VehicleSteeringWheel.angle はハンドル角で、12.9 はギア比＝変換は正当）。
  #     hvd_steering_angle は健全に emit されており **面1側の乗り換え先になり得る**。
  #     ただし単位が異なる（面2=操舵指令 / 面1=ハンドル角 rad）ため、
  #     「飽和」の閾値定義を面1の量で立て直す必要がある＝依存ではなく再定義の作業。
  #   - no_constraint_kind -> `midlong.constraints[].kind`（面2プランナ内部）。
  #     OSI に受け皿となる概念が無い。
  # sustained-by を引けなかった matcher（常設ゲートで守られていない）:
  #   min_obb_separation_above / impact_speed_below / no_emergency_without_conflict /
  #   lane_keep / lane_change_count / deceleration_profile_smooth /
  #   speed_reduction_before_landmark / steer_not_saturated / no_constraint_kind
  #   = 9件。使用先は junction_conflict / junction_priority / 07_aeb 等の**手動実行マニフェストのみ**。
  #   AEB(REQ-AD-001家族)を判定する matcher が常設ゲートに1件も乗っていない。
  #
  # ★2026-07-21 更新（この穴のうち AEB 分を実際に塞いだ）:
