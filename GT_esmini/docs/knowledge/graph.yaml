  # ---- 引けなかった辺: RouteLanePlan (vd-func:FUNC-050, 2026-08) ----
  # 縦串3辺の結線時に検討したが張らなかった2辺と、その理由（一次記録）。
  #
  # ★ 2026-08-02 更新: (2) は **解消済み**。vd-component 名前空間を新設し
  #   vd-component:route-lane-plan -> realizes -> vd-func:FUNC-050 を結線した（上記）。
  #   下の (2) の記述は「なぜ当時張れなかったか」の一次記録として残す。判断自体は正しく、
  #   欠けていたのはノード型のほうだった（同じ欠落は function_catalog の by: に
  #   'planner'/'driver' という未登録の擬似ID として前から露出していた）。
  #   併せて req-vd-ad:REQ-AD-016 を 016（経路を導ける）/ 017（経路どおりに走り切る）へ
  #   分割し、段階受入（acceptance_ladder）で部分達成を要求の内側に書けるようにした。
  #   (1) は未解消のまま残る（手書き検証 xosc を指す face:3 名前空間は、--spine-report の
  #   ②刺激欠を全数見てから設計する。母数を見ずに切ると片肺の語彙が増えるため）。
  #
  # (1) req-vd-ad:REQ-AD-016 -> stimulated-by -> [06_route_lane の刺激資産]
  #   資産は実在し実行済み（resources/xosc/verification/06_route_lane/
  #   merge_required_for_exit_ramp.xosc, route_valid_off_target_lane_for_exit_ramp.xosc、
  #   route_lane_batch.yaml 経由、overall=pass）。しかし face:3 の登録ハンドルが無い:
  #   (a) scenario_authoring 生成物ではない手書き xosc なので scenario-variant 命名
  #       （[a-z0-9_]+__p[0-9]{3}）に該当しない。
  #   (b) 07_aeb/06_lead/03/04 の先例（scenario-variant 未登録でも policy を「唯一の登録
  #       ハンドル」として stimulated-by の to にする回避策、上記コメント参照）がここでは
  #       使えない。RouteLanePlan は ITrafficPolicy を経由しない独立層
  #       （route_lane_plan_design.md §3-2、route_lane_batch.yaml 自身のコメントも明記）
  #       ＝ 迂回先の policy 自体が存在しない。
  #   資産と要求/機能の対応は route_lane_batch.yaml の `origin: vd-func:FUNC-050`
  #   フィールド（バッチファイルのメタデータ、graph.yaml の辺ではない）に残る。
  #
  # (2) [RouteLanePlan 実装] -> realizes -> vd-func:FUNC-050
  #   既存の realizes 辺は全て `policy:<slug> -> vd-func` の形を取る（policy は face:2 の
  #   閉じた列挙、namespaces.yaml OPAQUE_LEGACY_NAMESPACES に凍結登録済み＝新値追加は
  #   lint が拒否する）。RouteLanePlan は design doc が「policies/ に ITrafficPolicy
  #   実装として置くのは不採用」と明記した独立層のため、policy 列挙に新値を足すのは
  #   (a) 凍結違反 (b) アーキテクチャ判断への逆行の両方で不適当。実装そのものを指せる
  #   既存の登録名前空間が無い＝**登録提案**（親判断・本セッションでは新設しない）。
  #   FUNC-050 の部分実現は現状 matcher:route_lane_plan_holds -> verifies -> vd-func:FUNC-050
  #   （上記）と function_catalog_vd_ad.yaml の status: partial 更新のみで表現しており、
  #   同カタログの by: フィールドも意図的に空のまま残している（実装元は policy:slug /
  #   planner / driver / road のいずれかが期待される書式だが、どれも RouteLanePlan の
  #   実体を正しく表さないため、根拠の無い値を書くより空欄の方が正直と判断した）。
  #
  # 両者とも「名前の類似で辺を張らない・根拠が薄い辺は張らない（誤った辺 > 欠けた辺）」に
  # 従い未結線のまま残す。新設が要るなら: (i) face:3 に「手書き検証 xosc」用の名前空間、
  # または (ii) policy とは別の「VD 実装層（非 ITrafficPolicy）」名前空間の登録が候補。
  # いずれも新設していない（凍結名前空間ポリシーの遵守）。

