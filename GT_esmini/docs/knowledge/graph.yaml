  # （vd_metrics.py の OBB 実装コメント自身がこの移行理由を述べている）。参照資産0件（実測）。
  # 実装削除時に namespaces.yaml の matcher id_pattern / count 16→15 も同時更新済み。
  - from: matcher:min_obb_separation_above
