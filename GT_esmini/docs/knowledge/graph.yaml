  # ---- ④観測: matcher -> observes -> signal（capability_model.md §5, フェーズ1） ----
  # vd_metrics.py::eval_must の全分岐を実読して引いた辺。**引けなかった辺こそ情報**で、
  # 末尾の「引けなかった列」コメントに残す（縦串の切れた箇所の一次記録）。
  - from: matcher:speed_above
    to: signal:ego_speed
    type: observes
    source: GT_esmini/web/backend/services/vd_metrics.py
    note: frames[i]["ego"]["speed"]（面2テレメトリ投影経由）
  - from: matcher:speed_below
    to: signal:ego_speed
    type: observes
    source: GT_esmini/web/backend/services/vd_metrics.py
    note: 同上（speed_above と同一分岐）
  - from: matcher:min_speed_above
    to: signal:ego_speed
    type: observes
    source: GT_esmini/web/backend/services/vd_metrics.py
    note: 同上
  - from: matcher:speed_reduction_before_landmark
    to: signal:ego_speed
    type: observes
    source: GT_esmini/web/backend/services/vd_metrics.py
    note: ego.speed ＋ ego.s（ランドマーク手前の減速率）
  - from: matcher:speed_reduction_before_landmark
    to: signal:ego_pose
    type: observes
    source: GT_esmini/web/backend/services/vd_metrics.py
    note: ego.s（走行距離）で窓を切る
  - from: matcher:deceleration_profile_smooth
    to: signal:ego_speed
    type: observes
    source: GT_esmini/web/backend/services/vd_metrics.py
    note: >-
      **本来は signal:ego_accel_long を観測すべき matcher**。OSI に加速度が emit 済み
      (GT_OSIReporter_Moving.cpp:772-774) なのに speed の中心差分で自前推定している
      (vd_metrics.py:253-259)。この辺を ego_accel_long に付け替えるのが §2.3a の
      「配線差し替えだけで面1経由に移せる最有力候補」。
  - from: matcher:stopped_at_stop_sign
    to: signal:ego_speed
    type: observes
    source: GT_esmini/web/backend/services/vd_metrics.py
    note: _sustained_stop（速度が閾値未満の継続時間）
  - from: matcher:stopped_at_signal
    to: signal:ego_speed
    type: observes
    source: GT_esmini/web/backend/services/vd_metrics.py
    note: 主判定は面2テレメトリの速度（vd_metrics.py:565-595）
  - from: matcher:stopped_at_signal
    to: signal:traffic_light_state
    type: observes
    source: GT_esmini/web/backend/services/vd_metrics.py
    note: >-
      require_red サブチェックのみ OSI GroundTruth 経由（scene.traffic_lights[].color）
      ＝14 matcher 唯一の混在型。`--osi`/batch `osi: true` が無いと scene=None で skip。
  - from: matcher:maintained_following_distance
    to: signal:object_poses
    type: observes
    source: GT_esmini/web/backend/services/vd_metrics.py
    note: scene.objects[]（正規IF＝面1 OSI 直結の4件のうち1件）
  - from: matcher:maintained_following_distance
    to: signal:ego_speed
    type: observes
    source: GT_esmini/web/backend/services/vd_metrics.py
    note: THW = gap / speed の分母
  - from: matcher:min_separation_above
    to: signal:object_poses
    type: observes
    source: GT_esmini/web/backend/services/vd_metrics.py
    note: 中心間ユークリッド距離。min_obb_separation_above に置換され現用資産では未使用（下記参照）
  - from: matcher:min_obb_separation_above
    to: signal:obb_separation
    type: observes
    source: GT_esmini/web/backend/services/vd_metrics.py
    note: SAT による OBB 分離（隣接レーン通過での誤検出を避けるため中心間距離から移行）
  - from: matcher:impact_speed_below
    to: signal:obb_separation
    type: observes
    source: GT_esmini/web/backend/services/vd_metrics.py
    note: OBB 接触判定と接近速度の組み合わせ
  - from: matcher:impact_speed_below
    to: signal:object_poses
    type: observes
    source: GT_esmini/web/backend/services/vd_metrics.py
    note: 相手の位置・方位・速度
  - from: matcher:no_emergency_without_conflict
    to: signal:aeb_trigger_flag
    type: observes
    source: GT_esmini/web/backend/services/vd_metrics.py
    note: policy.constraints[].source == "aeb"（負matcher＝誤作動ゼロ）

  # ---- ⑥常設: matcher -> sustained-by -> gate（capability_model.md §5, フェーズ1） ----
  # 常設ゲート gate:phase3-baseline（12シナリオ）が実際に発火させる matcher だけを引く。
  # phase3_batch.yaml が参照する expectations を機械集計した結果＝6件（2026-07-20実測）。
  - from: matcher:speed_above
    to: gate:phase3-baseline
    type: sustained-by
    source: resources/xosc/verification/phase3_batch.yaml
  - from: matcher:speed_below
    to: gate:phase3-baseline
    type: sustained-by
    source: resources/xosc/verification/phase3_batch.yaml
  - from: matcher:min_speed_above
    to: gate:phase3-baseline
    type: sustained-by
    source: resources/xosc/verification/phase3_batch.yaml
  - from: matcher:maintained_following_distance
    to: gate:phase3-baseline
    type: sustained-by
    source: resources/xosc/verification/phase3_batch.yaml
  - from: matcher:stopped_at_signal
    to: gate:phase3-baseline
    type: sustained-by
    source: resources/xosc/verification/phase3_batch.yaml
    note: OSC拡張パース（TrafficSignalController系）の唯一の常設検出経路でもある
  - from: matcher:stopped_at_stop_sign
    to: gate:phase3-baseline
    type: sustained-by
    source: resources/xosc/verification/phase3_batch.yaml

  # ---- ゲート同士の構造（傘ラダーの構成） ----
  - from: gate:regression-gate
    to: gate:unit-ctest
    type: depends-on
    source: scripts/run_regression_gate.ps1
    note: Step 1（ハード）
  - from: gate:regression-gate
    to: gate:odr-conformance-quick
    type: depends-on
    source: scripts/run_regression_gate.ps1
    note: Step 1.5（ハード、-SkipOdr で除外可）
  - from: gate:regression-gate
    to: gate:phase3-baseline
    type: depends-on
    source: scripts/run_regression_gate.ps1
    note: Step 2（既定 WARN、-FailOnBehavioral でハード化）
  - from: gate:odr-conformance-quick
    to: gate:fork-census
    type: depends-on
    source: scripts/run_odr_conformance.py
    note: >-
      :1556-1558 はプロファイル分岐より前で無条件＝CI の schema-only 起動でも走る。
      census/drift/resync-guards が「独立スクリプト」ではなく適合ハーネスに内包された
      常設ゲートであることは、名前からは読めない事実。
  - from: gate:odr-conformance-quick
    to: gate:fork-drift
    type: depends-on
    source: scripts/run_odr_conformance.py
  - from: gate:odr-conformance-quick
    to: gate:resync-guards
    type: depends-on
    source: scripts/run_odr_conformance.py
  - from: gate:odr-conformance-schema-ci
    to: gate:fork-census
    type: depends-on
    source: .github/workflows/ci.yml
    note: schema層のみの CI 起動でも census は走る（同上）
  - from: gate:fork-sync
    to: gate:fork-census
    type: complements
    source: GT_esmini/docs/fork_sync_manifest.yaml
    note: INBOUND（上流未取込）と OUTBOUND（フォーク会計）の対。どちらもLHTの*正しさ*は見ない
  - from: gate:odr-conformance-full
    to: gate:odr-conformance-quick
    type: supersedes
    source: scripts/run_odr_conformance.py
    note: >-
      full は quick の上位集合（+OSI層）だが**手動実行のみ**でどのラダーにも配線されていない。
      capability_model.md §2.3 D9 が OSI層を (b) と採点している当の理由。

  # ---- 引けなかった辺（縦串の切れた箇所・2026-07-20 実測の一次記録） ----
  # observes を引けなかった matcher（読む量に対応する signal が canonical 面に無い）:
  #   - lane_keep / lane_change_count -> ego の lane_id。OSI は lane_id を emit する
  #     （GT_OSIReporter_Moving.cpp:777）が、matcher が読むのは frame の `ego.lane`
  #     ＝面2コントローラ由来。同名の量が2面に別経路で存在し、検証は面2側を見ている。
  #   - steer_not_saturated -> `driver.steer`（面2の操舵指令）。HVD の操舵角
  #     (signal:hvd_steering_angle) は同じ量に見えて (b′) 誤配線であり、乗り換え先に
  #     ならない。**面2直結を解消するには先に (b′) を直す必要がある**という依存関係。
  #   - no_constraint_kind -> `midlong.constraints[].kind`（面2プランナ内部）。
  #     OSI に受け皿となる概念が無い。
  # sustained-by を引けなかった matcher（常設ゲートで守られていない）:
  #   min_obb_separation_above / impact_speed_below / no_emergency_without_conflict /
  #   lane_keep / lane_change_count / deceleration_profile_smooth /
  #   speed_reduction_before_landmark / steer_not_saturated / no_constraint_kind
  #   = 9件。使用先は phase3d/phase3e/07_aeb 等の**手動実行マニフェストのみ**。
  #   AEB(REQ-AD-001家族)を判定する matcher が常設ゲートに1件も乗っていない。
  #   min_separation_above はどの資産からも参照されず（実測0件）＝実装のみのデッド matcher。
