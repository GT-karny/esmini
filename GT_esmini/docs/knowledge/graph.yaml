  - from: vd-component:overtake-maneuver
    to: vd-component:lane-change-initiation
    type: depends-on
    note: >-
      追い越しは車線変更の「動機」を1つ足す層であり、ホップ機構
      （ArmLaneChangeHop / ArmResumeMerge / ScanAdjacentLaneGap / EvaluateGapAcceptance /
      RequiredLaneChangeDistance / ShouldSignalLaneChangeHop）を丸ごと借りている。
      ただし**enable フラグは独立**（overtake_enabled と lane_change_initiation_enabled）。
      同居させると「経路追従の車線変更だけ欲しい」利用者が追い越しまで有効化してしまうため。
      安全弁が ShouldAttemptLaneChangeHop / ShouldSignalLaneChangeHop を呼ぶときだけ
      cfg.enabled=true に上書きしたコピーを渡す（両関数が enabled を内部で見るため）。
    source: GT_esmini/docs/virtualdriver/design/overtake_maneuver.md

  - from: vd-component:overtake-maneuver
    to: vd-func:FUNC-061
    type: realizes
    note: >-
      追い越しの往路・復路それぞれに方向指示器を同期させる（req-vd-ad:REQ-AD-018 段 d の
      **追い越しぶん**）。既存の lc_signal_dir_ に同じ契約で書き込むだけで、
      DetectManeuverDir の段構造は変えていない。
      **FUNC-055 の前進予測形は流用していない** — あれは dist_to_connection と n_remaining を
      引数に取る締切専用の述語で、追い越しには対応する量が存在しない。
      追い越しには締切が無いので「合図してから T 秒待って発起する」タイマ形で足り、
      法定リードは近似ではなく設計上ちょうど T になる（実測 往路 2.95 s / 復路 3.00 s）。
    source: GT_esmini/docs/virtualdriver/design/overtake_maneuver.md

  - from: matcher:overtake_decision_holds
    to: signal:overtake_decision
    type: observes
    note: >-
      vd_metrics.py の overtake_decision_holds 分岐が frames[i]["overtake"] を読む。
      must で指定されたキー（expect_considered / expect_blocked_reason / expect_phases /
      forbid_phases / expect_cleared_lead）だけを評価し、**何も指定しない must は skip**
      （route_lane_plan_holds / indicator_leads_lane_change と同じ「何も評価しないものを
      pass にしない」規律）。overtake ブロックを持つフレームが窓に1つも無ければ skip＝
      古い DLL の検出。
    source: GT_esmini/docs/virtualdriver/design/overtake_maneuver.md

  - from: matcher:overtake_decision_holds
    to: req-vd-ad:REQ-AD-023
    type: verifies
    note: >-
      overtake_batch.yaml の4本で検証。段 a は expect_considered、段 b/c は expect_phases
      （signal_out → out → pass → signal_back → back → idle の部分列）と expect_cleared_lead、
      段 e は同じ判定を対向車線シナリオで。**段 d（指示器）はこの matcher では判定しない** —
      matcher:indicator_leads_lane_change の担当。段 f/g は未達で検証対象外。
      どの段を検証済みかは要求側の acceptance_ladder[].verified_by が持つ。
    source: resources/xosc/verification/overtake_batch.yaml

  - from: matcher:overtake_decision_holds
    to: req-vd-ad:REQ-AD-024
    type: verifies
    note: >-
      段 b は overtake_declined_before_route_branch で **considered=true かつ
      blocked_reason=route_budget かつ phase が終始 idle** の3点同時成立を判定する
      （forbid_phases で「一度も合図すらしていない」ことも押さえる）。
      considered を落とすと「そもそも検討していないから緑」＝偽 PASS と区別できない。
      段 c は overtake_aborted_for_route_branch で **cleared_lead=false（全フレーム）**
      と blocked_reason=route_budget を判定する。
      この2本は完遂側 overtake_slow_lead_on_two_lane_road と**同じフィールドの逆極性**を
      主張しており、それによって検知器の両極性が実証されている。
    source: resources/xosc/verification/overtake_batch.yaml

  - from: matcher:indicator_leads_lane_change
    to: req-vd-ad:REQ-AD-023
    type: verifies
    note: >-
      **段 d のみ**（往路・復路の両方で進路変更の前から予告する）。追い越しは車線変更が2回なので、
      同 matcher を **window で往路・復路に分けて2エントリ**呼ぶ — matcher は窓内の最初の
      signal_active / armed しか拾わないため（vd_metrics.py の next(...)）。
      matcher 自体は変更していない。direction と点灯側の一致検査が入っているので、
      復路で左右が反転していることも同時に検査される。
      実測 2026-08-04: 往路 t_sig=0.05 / t_arm=3.00 = 2.95 s、復路 t_sig=10.25 / t_arm=13.25 = 3.00 s。
      min_lead_s: 2.9 は法定 3.0 s からフレーム量子化（dt=0.05）ぶんを引いた値で主張の緩和ではない。
    source: resources/xosc/verification/08_overtake/overtake_slow_lead_on_two_lane_road.expectations.yaml

  - from: req-vd-ad:REQ-AD-024
    to: req-vd-ad:REQ-AD-017
    type: depends-on
    note: >-
      経路ガードは RouteLanePlan が出す target_lanes / dist_to_connection にそのまま依存する。
      **現在バンドの target_lanes には下流の要求が既に畳み込まれている**（BuildRouteLanePlan が
      最終ウェイポイントから後ろ向きに伝播させるため）ので、追い越しガードは次のバンドを
      先読みする必要が無い。REQ-AD-017 段 a/b が成立していなければこのガードは成立しない。
    source: GT_esmini/docs/virtualdriver/design/overtake_maneuver.md

  # req-vd-ad:REQ-AD-023 -[depends-on]-> vd-func:FUNC-030 の辺は**意図的に張らない**。
  # 要求(面3)から機能(面2)への直結は正規IF signal を経由しない近道で、
  # scripts/test_check_knowledge_graph.py の「面3→面2 直結辺」検知器が正しく発火する
  # （既知の stimulated-by(req→policy) 以外は 0 件であることを恒久化した検査）。
  # 「段 f は FUNC-030 待ち」という事実は3か所に載っており辺は要らない:
  #   (1) REQ-AD-023 の acceptance_ladder 段 f が met: false
  #   (2) 同 related に vd-func:FUNC-030
  #   (3) FUNC-030 の note に「FUNC-056 実装で本項の不在が実害になった」旨

  # ===== ManualDrive中ADAS フェーズA 縦串（vd-func:FUNC-075 / req-vd-ad:REQ-AD-025・028、2026-08-05） =====
  # FUNC-075 の realizes 辺は2026-08-04に張り済み（未実装注記つき、上部参照）。ここはフェーズA
  # 実装後に追加する②刺激・④観測・⑤判定・⑥常設の縦串。根拠は実際に発火/観測する資産
  # （test_results/mdadas_run1/*/verdict.json の実測、GT_esmini/scripts/verification/
  # test_manualdrive_matchers.py の35テスト実行、GT_esmini/test/CMakeLists.txt の69新規ケース）。
  #
  # ②刺激の対象は policy:aeb（末尾コメント line ~942 の慣行と同型）: 10_manualdrive_adas/ の
  # 5xosc は scenario-variant 化されていない手書き資産（07_aeb/06_lead/03/04 と同じ扱い）で、
  # manualdrive_adas_batch.yaml は VD の「policies:」リスト機構を使わない
  # （controller: manualdrive + manualdrive_config、検証計画§7-1）。それでも実際に発火する実装は
  # AebSafety（policy:aeb）そのもの — AdasCoexistenceStack::Step は ITrafficPolicy の Evaluate()
  # を毎フレーム呼ぶだけで policy 本体は無改修（design §2-1/§2-3、AdasCoexistenceStack.cpp:198-202,218）。
  # 「policies リストに乗る」ではなく「同じ policy クラスを別経路から起動する」形で face:2 実装
  # ノードを共有するため、req-vd-ad(face:3) -> policy:aeb(face:2) の直結は既知の許容パターン。
  - from: req-vd-ad:REQ-AD-025
    to: policy:aeb
    type: stimulated-by
    source: resources/xosc/verification/manualdrive_adas_batch.yaml
    note: >-
      10_manualdrive_adas/ の5シナリオ（md_aeb_unresponsive / md_aeb_no_conflict /
      md_aeb_strong_brake_driver / md_aeb_kickdown_suppress / md_fcw_warning_only、
      controller: manualdrive）が AdasCoexistenceStack 経由で AebSafety(policy:aeb) を
      毎フレーム発火させる（design §2-1、ゼロ改修流用）。実測（test_results/mdadas_run1/
      md_aeb_unresponsive/verdict.json）: gt.aeb が t=2.00 で ACTIVE、impact_speed 8.26 m/s
      まで低減（段a）。段b-eは同バッチの他4シナリオが刺激する。段d（キックダウン抑制）・
      段e（FCWリード）は閾値未校正・実測で design §3-2 の想定と食い違いが判明済み
      （design doc 訂正・下の verifies 辺の note を参照）。
  - from: req-vd-ad:REQ-AD-028
    to: policy:aeb
    type: stimulated-by
    source: resources/xosc/verification/manualdrive_adas_batch.yaml
    note: >-
      要求自身の scenario 欄が明記するとおり「REQ-AD-025/026/027 の刺激と同一バッチで
      判定面として使う」（専用刺激を持たない横断適用）。段a（正規Name列挙でのState報告）は
      matcher:adas_state_matches が同じ5シナリオの実行から判定する（下の verifies 辺）。
      段c（ハーネスがHVDを読めること）は、このバッチが frames=0 エラー無く440フレームずつ
      実行できたこと自体で実証済み（test_results/mdadas_run1/*/telemetry.jsonl 実測）。
      **段b（DriverOverride）は 2026-08-05 のフェーズBで populate 機構が入り、同じバッチが
      刺激になった**（md_aeb_kickdown_suppress のキックダウン保持窓＝正、md_aeb_unresponsive
      ＝負、同 kickdown 行の gt.fcw＝同一実行内の対照）。ただし刺激できるのは**アクセル経路
      だけ**である: 段b の claim が挙げる3経路のうち、brake 理由の producer は ACC
      （フェーズC）、steering 理由の producer は LKA（フェーズD）にしか無く、本バッチには
      それらを発火させる資産が原理的に存在しない。

  # ---- ④観測: ManualDrive ADAS matcher -> signal:manualdrive_adas_states ----
  # いずれも vd_metrics.py の _hvd_adas_record(frames[i], function) 経由で
  # frame["hvd"]["adas"][function] を読む。これは signal:manualdrive_adas_states
  # が指す HVD ADAS states そのもの（GetADASFunctions -> AddADASFunctionEx 経路、design §8-1）。
  # ★2026-08-05 訂正: ここに「signal_catalog.yaml の当該エントリが state:"(a)"（未実装
  # スタブ）のまま凍結されている」と書かれていたが、その後 state:"●" へ更新済みである
  # （フェーズA報告時のファイル所有制約に由来する当時の記述で、現状と食い違っていた）。
  - from: matcher:manual_aeb_fires
    to: signal:manualdrive_adas_states
    type: observes
    source: GT_esmini/web/backend/services/vd_metrics.py
    note: 窓内でfunctionのstate_nameが一度でもactiveになるかをframe["hvd"]["adas"][function]から判定
  - from: matcher:no_intervention_in_window
    to: signal:manualdrive_adas_states
    type: observes
    source: GT_esmini/web/backend/services/vd_metrics.py
    note: >-
      窓内でactiveが一度も無いことに加え、reported かつ not-unavailable（＝正しく
      STANDBYで見張っていた）であることも要求する（REQ-AD-028のSTANDBY/UNAVAILABLE区別に
      判定が依存する、vd_metrics.py:1646-1649のコメント）。
  - from: matcher:brake_not_stacked
    to: signal:manualdrive_adas_states
    type: observes
    source: GT_esmini/web/backend/services/vd_metrics.py
    note: active区間のcustom_detail（driver_brake/brake_request/brake_outキー）を読み、max合成かを判定
  - from: matcher:fcw_leads_intervention
    to: signal:manualdrive_adas_states
    type: observes
    source: GT_esmini/web/backend/services/vd_metrics.py
    note: warning_function/intervention_functionの2行を読み、最初のactive遷移の時刻差をリードとする
  - from: matcher:adas_state_matches
    to: signal:manualdrive_adas_states
    type: observes
    source: GT_esmini/web/backend/services/vd_metrics.py
    note: functionのstate_name列が窓内でexpectと一致するか（modeパラメータでall/any切替）を判定する汎用matcher

  # ---- ⑤判定: 5 matcher -> verifies -> req-vd-ad ----
  - from: matcher:manual_aeb_fires
    to: req-vd-ad:REQ-AD-025
    type: verifies
    source: resources/xosc/verification/10_manualdrive_adas/md_aeb_unresponsive.expectations.yaml
    note: >-
      段a（無反応ドライバ＋衝突コースでAEB介入）の主判定。md_aeb_kickdown_suppressでは
      キックダウン前区間の前提（段d抑制の対照）としても使う。実測: t=2.00でACTIVE
      （test_results/mdadas_run1/md_aeb_unresponsive/verdict.json）。
  - from: matcher:no_intervention_in_window
    to: req-vd-ad:REQ-AD-025
    type: verifies
    source: resources/xosc/verification/10_manualdrive_adas/md_aeb_no_conflict.expectations.yaml
    note: >-
      段b（衝突コース不在で誤介入しない）の主判定。md_aeb_kickdown_suppressでは段d
      （抑制後の窓）、md_fcw_warning_onlyでは段e（警報単独エピソードでAEB非介入）にも使う。
  - from: matcher:brake_not_stacked
    to: req-vd-ad:REQ-AD-025
    type: verifies
    source: resources/xosc/verification/10_manualdrive_adas/md_aeb_strong_brake_driver.expectations.yaml
    note: >-
      段c（人間がAEB要求以上を踏んでいるとき上乗せしない＝max合成）の主判定。この E2E 資産は
      threshold未校正で needs-review（test_results/mdadas_run1/batch_summary.md）＝緑担保に
      留まらず未計測。赤実証は matcher:brake_not_stacked の実装を直接叩く Python ユニット
      テストが担う（検証計画§4-1の unit-level 許容、verification_plan.md §4-2で訂正済み）。
  - from: matcher:fcw_leads_intervention
    to: req-vd-ad:REQ-AD-025
    type: verifies
    source: resources/xosc/verification/10_manualdrive_adas/md_aeb_unresponsive.expectations.yaml
    note: >-
      段e（警報が介入に先行しリード≥0.8s）の判定。実測ではcut-inにつきリード0.000sでfail
      （gt.fcw/gt.aebが同一フレームt=1.75でACTIVE、test_results/mdadas_run1/
      md_aeb_unresponsive/verdict.json）。design §3-2訂正・検証計画の対象。
      **この辺は「matcherが正しく判定を出す」ことを主張するのであって「要求段eが
      現状達成されている」ことは主張しない**（現に fail）。
  - from: matcher:adas_state_matches
    to: req-vd-ad:REQ-AD-025
    type: verifies
    source: resources/xosc/verification/10_manualdrive_adas/md_aeb_no_conflict.expectations.yaml
    note: >-
      段b（config OFFでなくSTANDBYで見張っていたことの確認、負系の意味を担保）と
      段e（md_fcw_warning_only、gt.fcwが少なくとも一度activeになること）の補助判定。
  - from: matcher:adas_state_matches
    to: req-vd-ad:REQ-AD-028
    type: verifies
    source: GT_esmini/web/backend/services/vd_metrics.py
    note: >-
      コード自身のコメント（vd_metrics.py:1853-1854）が「req-vd-ad:REQ-AD-026 step c /
      REQ-AD-028 step a」の主判定と明記。正規Name列挙のstate_nameが期待どおりに出ることの
      確認そのものが観測性要求（3値規律のUNAVAILABLE/STANDBY/ACTIVE区別）の判定にあたる。

  # ---- フェーズB（req-vd-ad:REQ-AD-028 段b、2026-08-05）: 上書きチャネル ----
  # State 列とは別の OSI フィールド（driver_override / custom_state）を読むため、
  # 別 signal（manualdrive_driver_override）として起こしたうえで observes を張る。
  # 「State を見れば上書きも分かる」は成り立たない: 抑制中のAEBは STANDBY のままで、
  # 対象が消えて撃たなかった場合と State 上は区別できない。
  - from: matcher:driver_override_reported
    to: signal:manualdrive_driver_override
    type: observes
    source: GT_esmini/web/backend/services/vd_metrics.py
    note: >-
      frame["hvd"]["adas"][function] の driver_override{present,active,reasons} と
      custom_state を読み、指定窓で期待どおりの上書きが出ている（または出ていない）かを判定する。
      present（＝OSI submessage の有無）を読むのが肝で、正方向は present 不要（行が出ている
      時点で計器は生きているので submessage 欠如は真の負観測＝fail）、負方向は present を
      必須にする（誰も書かなかったチャネルは「上書きしなかった」証拠にならない）。
  - from: matcher:driver_override_reported
    to: req-vd-ad:REQ-AD-028
    type: verifies
    source: resources/xosc/verification/10_manualdrive_adas/md_aeb_kickdown_suppress.expectations.yaml
    note: >-
      段b（運転者上書き事象が DriverOverride{active,reason} に出る／アクセル起因は
      custom_state で補完）の主判定。
      ~~この辺は「matcher が段bを判定できる」ことを主張し、「段bが全経路で達成されている」
      ことは主張しない~~ → **2026-08-05 フェーズDで3経路すべてがそろい、段bは met へ昇格した**。
      経緯を残すのは、この辺が長く「器具はあるが producer が無い」状態だったことが記帳の
      形として重要だからである: フェーズBが機構とアクセル経路（custom_state=
      DRIVER_OVERRIDE_ACCEL、md_aeb_kickdown_suppress）、フェーズCがブレーキ経路
      （REASON_BRAKE_PEDAL、ACC の解除＝md_acc_cancel_resume）、フェーズDがステア経路
      （REASON_STEERING_INPUT、LKA の中断＝md_lka_human_steer）を順に足した。3経路を1つの段で
      主張している以上、1経路の達成で met を上げるのは overclaim であり、実際に上げたのは
      3つ目が緑になった時点である。
      赤実証は GT_esmini/scripts/verification/test_manualdrive_matchers.py（populate停止・
      入力プロファイル時刻ずらしの2赤）。

  # ---- フェーズC（req-vd-ad:REQ-AD-026 / 030 / 031、2026-08-05）: ACC / Stop&Go / MSL ----
  # 新設 signal を2つ起こした理由は signal_catalog.yaml の各 note にある。要点だけ再掲すると、
  # ACC 側は「設定した」と「効いた」を別の量として持たないと段e/g/h が判定できず、MSL 側は
  # 「ブレーキを出さない」という負の主張を観測可能にしないと反証できないため。
  - from: matcher:setting_reflected
    to: signal:manualdrive_acc_settings
    type: observes
    source: GT_esmini/web/backend/services/vd_metrics.py
    note: >-
      設定キー（gt.acc.set_speed_mps / gt.acc.thw_setting_s）と実効キー
      （gt.acc.effective_cap_mps / gt.acc.thw_actual_s）を時系列として読み、設定の段差が
      settle_s 以内に実効値の**同方向の**移動として現れるかを見る。等値でなく方向を見るのは、
      実効値が min(設定, policy天井, 制限速度) の合成であり、新しい設定に届かないことが
      正当にありうるため。**窓内で設定変更が1回も起きなければ pass ではなく fail** を返す
      （操作列が壊れた run と、設定を保存して適用しない実装が同じ定数列を作るため）。
  - from: matcher:adas_state_sequence
    to: signal:manualdrive_adas_states
    type: observes
    source: GT_esmini/web/backend/services/vd_metrics.py
    note: >-
      state_name 列をラン長圧縮したうえで expect の**部分列**一致を見る。順序だけを主張し
      滞在時間は主張しない（20Hz で数十フレーム続く状態に厳密一致を課すと、誰も書いていない
      dwell time の assertion になる）。空虚化を防ぐため expect が2要素未満、または隣接重複を
      含む場合は skip を返す。
  - from: matcher:speed_capped_at
    to: signal:manualdrive_msl_cap
    type: observes
    source: GT_esmini/web/backend/services/vd_metrics.py
    note: >-
      cap_key（gt.msl.cap_mps）で毎フレームのキャップを読み、自車速がそれ＋許容差を超えない
      ことを見る。キャップをリテラルで書かず signal から読むのは、制限速度連動モードでは
      キャップ自体が道路に沿って動くため。未記録のキャップは 0 と読まず frame ごと skip する。
  - from: matcher:no_brake_output
    to: signal:manualdrive_msl_cap
    type: observes
    source: GT_esmini/web/backend/services/vd_metrics.py
    note: >-
      gt.msl.brake_out を読み、窓内で恒等的に 0 であることを見る。**車両の実効ブレーキでは
      なく機能自身の寄与を読む**のが肝で、人間が踏んだブレーキは主張と無関係に非零になりうる。
      チャネルが一度も書かれていなければ skip（誰も書かなかったチャネルは「出さなかった」証拠に
      ならない）。
  - from: matcher:stop_hold_stationary
    to: signal:manualdrive_acc_settings
    type: observes
    source: GT_esmini/web/backend/services/vd_metrics.py
    note: >-
      gt.acc.stop_hold が真の**連続区間ごとに**変位を測る。区間で分けるのは、1回の run で
      停止→再発進→再停止が起きうるため（区間をまたいで測ると再発進の移動をクリープとして
      数える）。速度だけを見ないのは「動かなかった」が「誰も保持していない車」にも当てはまる
      ため——保持中であることを機能自身のフラグで固定して初めて保持の主張になる。

  # ---- ⑤判定: フェーズC matcher -> verifies -> req-vd-ad ----
  - from: matcher:setting_reflected
    to: req-vd-ad:REQ-AD-026
    type: verifies
    source: resources/xosc/verification/10_manualdrive_adas/md_acc_setting_changes.expectations.yaml
    note: >-
      段e（走行中の設定速度増減が追従目標に反映される）と段h（車間段階の切替が実測THWに
      反映される）の主判定。段h は md_acc_follow_lead 側で、1本の刺激が2段階以上を跨ぐ
      （mid→long→short）ことで判定する。実測 20/20 緑。
  - from: matcher:adas_state_sequence
    to: req-vd-ad:REQ-AD-026
    type: verifies
    source: resources/xosc/verification/10_manualdrive_adas/md_acc_cancel_resume.expectations.yaml
    note: >-
      段c（操作列に対応する状態遷移列がHVDに出る）の主判定。段f（速度域の域外で
      ACTIVE→STANDBY）にも md_acc_speed_range_gate で使う。設計§6 の ACC/MSL 排他も
      同じ matcher で判定する（md_acc_msl_exclusion、gt.acc と gt.msl の2行）。
  - from: matcher:speed_capped_at
    to: req-vd-ad:REQ-AD-026
    type: verifies
    source: resources/xosc/verification/10_manualdrive_adas/md_acc_speed_limit_cap.expectations.yaml
    note: >-
      段g（制限速度制御の有無で実効上限が変わる）の主判定。**この判定は2構成の対で初めて
      主張になる**——respect_limit 側だけでは「常に制限を守る実装」も通り、ignore_limit 側だけ
      では「道路を一度も読まない実装」も通る。バッチは同一 xosc を variant で2行持つ。
  - from: matcher:speed_capped_at
    to: req-vd-ad:REQ-AD-030
    type: verifies
    source: resources/xosc/verification/10_manualdrive_adas/md_msl_throttle_cap.expectations.yaml
    note: 段a（全開スロットルでも設定速度を超えない）の主判定。cap_key で実効キャップを毎フレーム読む。
  - from: matcher:no_brake_output
    to: req-vd-ad:REQ-AD-030
    type: verifies
    source: resources/xosc/verification/10_manualdrive_adas/md_msl_throttle_cap.expectations.yaml
    note: >-
      段a の**負系**（リミッターはブレーキを出さない）の主判定。検証計画が当初この負系に
      当てようとした下り坂資産（MDA-XODR-02）は作らなかった: RealVehicle は道路ピッチを
      姿勢にしか使わず（terrain_pitch_ は縦運動に入らない）、勾配路は「下り坂に見えて平地の
      ように振る舞う」——起こせない現象の名前を持つ資産になる。同じ主張は平坦路で、
      クランプが実際に効いている最中に取っている。
  - from: matcher:stop_hold_stationary
    to: req-vd-ad:REQ-AD-031
    type: verifies
    source: resources/xosc/verification/10_manualdrive_adas/md_sng_lead_stop_restart.expectations.yaml
    note: >-
      段a（v=0 到達後の停止保持でクリープが抑止される）の主判定。段b（信号・一時停止標識を
      停止対象に構成した場合）にも md_sng_stop_sign で使う。実測: 保持 11.6 秒で変位
      0.032 m（GT_esmini/docs/virtualdriver/measurements/manualdrive_creep_stop_hold_2026-08-05.md）。
  - from: matcher:restart_after_trigger
    to: req-vd-ad:REQ-AD-031
    type: verifies
    source: resources/xosc/verification/10_manualdrive_adas/md_sng_lead_stop_restart.expectations.yaml
    note: >-
      段a の後半（人間のアクセル操作を唯一の再発進トリガとする）の主判定。先行車は停止した
      まま run が終わるので、発進の説明はパルス以外に存在しない——「先行車が動いたから
      追従した」で通ってしまう構成では、段a が禁じている自動再発進と区別できない。
  - from: matcher:driver_override_reported
    to: req-vd-ad:REQ-AD-026
    type: verifies
    source: resources/xosc/verification/10_manualdrive_adas/md_acc_cancel_resume.expectations.yaml
    note: >-
      段b（ブレーキ踏下で解除、アクセル踏下は一時上書き）の上書きチャネル側の判定。
      フェーズBで作った matcher が、フェーズCで初めて **REASON_BRAKE_PEDAL を実際に生む
      producer** を得た（ACC の解除）。同一 run でアクセル起因の一時上書きも
      custom_state=DRIVER_OVERRIDE_ACCEL として出るため、規格の2値制約とその補完が
      1本の刺激の中で並んで観測できる。

  # ---- ②刺激: req -> stimulated-by -> policy（フェーズC） ----
  # 登録ハンドルは policy 名前空間（REQ-AD-025 と同じ扱い）。MSL は policy を持たない
  # ＝ ITrafficPolicy を一つも使わない純粋なペダルクランプなので、この型の辺を張る先が
  # 無い。無理に既存 policy へ張ると「MSL が lead を発火させる」という嘘になるため張らない
  # ——②刺激欠として台帳に残す方が正しい（名前空間設計の穴であって、資産が無いのではない。
  # 刺激資産そのものは md_msl_throttle_cap / md_msl_kickdown として実在し緑）。
  - from: req-vd-ad:REQ-AD-026
    to: policy:lead
    type: stimulated-by
    source: resources/xosc/verification/manualdrive_adas_batch.yaml
    note: >-
      md_acc_follow_lead / md_acc_cancel_resume / md_acc_setting_changes /
      md_acc_speed_limit_cap（2構成）/ md_acc_speed_range_gate / md_acc_aeb_independence
      （controller: manualdrive、adas_acc_enabled: true）が AdasCoexistenceStack 経由で
      LeadVehicleAware(policy:lead) を毎フレーム発火させ、その constraint 列を
      EvaluateAccCeiling が現在位置1点の速度上限へ畳む（design §4-2、policy 本体はゼロ改修）。
      手動運転中ADASの刺激は xosc だけでは決まらない: 入力プロファイル
      （profiles/acc_ops_*.json）が「運転者」を、xosc が「世界」を決め、両方の組で1観点が
      発火する（検証計画§1）。実測 20/20 緑（test_results/mdadas_phasec）。
  - from: req-vd-ad:REQ-AD-031
    to: policy:stop_yield
    type: stimulated-by
    source: resources/xosc/verification/manualdrive_adas_batch.yaml
    note: >-
      md_sng_stop_sign を stop_at_stop_sign の true/false 2構成（variant）で回し、
      StopYieldSignAware(policy:stop_yield) を手動スタックへ Add する/しないで両極性を作る。
      **負側では policy がそもそも生成されない**ので、フィルタの緩和で漏れる余地が構造的に無い
      （design §4-3）。段a（先行車のみ）は policy:lead 側の同一バッチ行
      md_sng_lead_stop_restart が発火させる。
      この2構成は同時に design §12 の残確認事項——TrafficLightAware / StopYieldSignAware が
      コントローラ非依存か——の実走確認でもあった。ManualDrive の ego は Route を持たず、
      両 policy は ego の Position から前方を歩いて標識を探す（RouteSignalScan の CopyRoute）ため、
      「インタフェースに適合するか」ではなく「Route が無いとき歩行が何か見つけるか」が
      未確認だった。実測で見つかる（201フレーム stop_requested、
      GT_esmini/docs/virtualdriver/measurements/manualdrive_creep_stop_hold_2026-08-05.md）。

  # ---- ⑥常設: フェーズC の新規C++ユニットも同じ傘バイナリに乗る ----
  - from: vd-func:FUNC-079
    to: gate:unit-ctest
    type: sustained-by
    source: GT_esmini/test/CMakeLists.txt
    note: >-
      test_AccLonController.cpp / test_ManualAdasPhaseC.cpp が傘バイナリ常設
      （**731/731緑**、2026-08-05 フェーズC実測。フェーズB時点は673件）。
      matcher 側の赤実証は GT_esmini/scripts/verification/test_manualdrive_matchers.py
      （フェーズCで6 matcher分を追加、計77テスト緑）。
  - from: vd-func:FUNC-081
    to: gate:unit-ctest
    type: sustained-by
    source: GT_esmini/test/CMakeLists.txt
    note: >-
      MSL（SpeedLimiter）の単体は test_ManualAdasPhaseC.cpp に同居する（ACC と段の順序を
      共有し、順序こそが「リミッターが安全段を拒否できない」を決めるため、別ファイルに
      分けると順序のテストが宙に浮く）。

  # ---- ⑥常設: vd-func:FUNC-075 の69新規C++ユニットがgate:unit-ctest傘バイナリに乗る ----
  # feature:F7 -> gate:unit-ctest（本ファイル上部）と同型。manualdrive_adas_batchはphase E待ちの
  # 候補ゲートであり常設ではない（design §10）ため、この辺は claim しない。
  - from: vd-func:FUNC-075
    to: gate:unit-ctest
    type: sustained-by
    source: GT_esmini/test/CMakeLists.txt
    note: >-
      test_ManualAdasFunctionReport.cpp / test_KickdownDetector.cpp / test_PedalArbitrator.cpp /
      test_ManualDriveAdasConfig.cpp / test_AdasCoexistenceStack.cpp / test_ScriptedInputSource.cpp
      が傘バイナリ常設（ManualDrive ADAS 関連 81ケース、**673/673緑**の内数、2026-08-05
      フェーズB実測。フェーズA時点は69ケース/661件で、フェーズBが上書きチャネル5件・
      accel producer 5件・FCWゲート config 2件を追加した）。
      matcher実装自体の赤実証（Python側）は
      GT_esmini/scripts/verification/test_manualdrive_matchers.py（50テスト）が別途担うが、
      これは gt_sim_test 検証ハーネス側であり ctest 傘バイナリの外＝この辺には含めない。

  # ---- フェーズD（req-vd-ad:REQ-AD-027、2026-08-05）: LKA / LDW ----
  # 新設 signal を1つ起こした（signal:manualdrive_lka_lateral）。手動運転中ADASで初めての
  # 横ドメイン観測量で、既存の縦系と読み方の注意が2つ違う（レーン相対偏差は境界で参照が
  # 張り替わる／補正量は機能自身の寄与であって車両の操舵ではない）。詳細は catalog の note。
  - from: matcher:lane_kept_within
    to: signal:manualdrive_lka_lateral
    type: observes
    source: GT_esmini/web/backend/services/vd_metrics.py
    note: >-
      `gt.lka.offset_m` と `gt.lka.lane_id` を**対で**読む。偏差だけを読まないのが設計の肝で、
      この偏差はレーン相対であり roadmanager の Position::GetOffset() はレーン境界で参照を
      張り替える（本プロジェクト実測 -1.7482 → +1.9425 が1フレーム）。つまり逸脱した run ほど
      |offset| は小さく戻り、偏差だけの matcher は**車線を出た run にこそ最もきれいな pass を
      返す**。レーンID不変を併せて要求することでこの穴を塞ぎ、同時に `expect_kept: false`
      （両極性ペアの逸脱側）に観測できる中身を与えている。
  - from: matcher:steer_output_absent
    to: signal:manualdrive_lka_lateral
    type: observes
    source: GT_esmini/web/backend/services/vd_metrics.py
    note: >-
      `gt.lka.correction`（**機能自身の寄与**）を読み、窓内で恒等的に 0 であることを見る。
      車両の実効操舵ではないのが肝で、この matcher が使われる場面——明確な操舵入力・指示器つき
      車線変更・速度域外——はいずれも**人間が意図的にハンドルを切っている**。実効操舵を見る
      matcher は、それを証明したい当の run で必ず赤くなる（no_brake_output が実効ブレーキでなく
      gt.msl.brake_out を読むのと同型）。チャネルが一度も書かれていなければ skip。

  # ---- ⑤判定: フェーズD matcher -> verifies -> req-vd-ad ----
  - from: matcher:lane_kept_within
    to: req-vd-ad:REQ-AD-027
    type: verifies
    source: resources/xosc/verification/10_manualdrive_adas/md_lka_drift.expectations.yaml
    note: >-
      段a（弱ドリフトで補正が入り車線内に留まる）の主判定。**左右対で回すことが判定の一部**
      ——補正則の符号誤りは機能を弱めるのではなく車を車線の外へ押すので、片側だけでは
      「弱すぎる実装」と区別できない。実測は完全な鏡像（t=5.0 で offset +0.317/補正 +0.004
      対 -0.317/-0.004、両極ともピーク |offset| 0.363m でレーン-1不変）。
      `expect_kept: false` 方向は同一 xosc の warning_only / below_band 構成で使い、同じ刺激が
      補正なしでは |offset| 4.330m・レーン-1→-2 の逸脱になることを示す——これが無いと正例の
      「留まった」は刺激が弱かっただけの可能性を排除できない。
  - from: matcher:steer_output_absent
    to: req-vd-ad:REQ-AD-027
    type: verifies
    source: resources/xosc/verification/10_manualdrive_adas/md_lka_human_steer.expectations.yaml
    note: >-
      段b（人間の明確な操舵入力・指示器作動中は介入しない/即時中断）と段f（警報のみモードで
      cmd.steering 不変）と段e（速度域外で介入しない）の負系判定。3段が同一 matcher なのは、
      いずれも「機能自身の操舵寄与がゼロ」という同じ観測だからで、違うのは**理由**の方
      （gt.lka.suppressed_* / in_speed_band に別々に出る）。
  # matcher:driver_override_reported -> req-vd-ad:REQ-AD-028 の辺はフェーズBで既に張って
  # あるので重ねない（curated 辺は1本）。フェーズDが足したのは辺ではなく **producer** で、
  # 経緯はその辺の note に追記した。ここに残しておくべき恒久事実は producer の**条件**の方:
  #
  #   producer 条件は「抑制が立っている間」であって「このフレームで補正を握り潰したか」では
  #   ない。狭い条件を最初に実装して実走で壊れた——md_lka_human_steer で運転者が道路を横切って
  #   操舵している最中、車両がたまたま通過中の車線の中心に来た1フレーム（t=7.30、offset
  #   0.115m）だけ逸脱判定が false に落ち、上書き欄が 50ms だけ消えた。運転者の手は前後で
  #   何一つ変わっていない。フェーズBがアクセル経路で退けたのと同じ失敗様式を実データが
  #   再現した形で、OSI の DriverOverride が問うのは「その機能が運転者に上書きされたか」＝
  #   運転者の**入力**の性質であって、そのフレームの幾何ではない。

  # ---- ②刺激: req -> stimulated-by（フェーズD） ----
  # LKA は ITrafficPolicy を一つも使わない純粋な横ロジックなので、MSL（REQ-AD-030）と同じく
  # policy 名前空間に張る先が無い。刺激資産は md_lka_drift（5構成）/ md_lka_human_steer /
  # md_lka_lane_change_with_indicator として実在し緑だが、②刺激欠として台帳に残す方が正しい
  # （名前空間設計の穴であって、資産が無いのではない）。

  # ---- ③実装: vd-component -> realizes -> vd-func（フェーズD） ----
  - from: vd-component:lane-keep-assist
    to: vd-func:FUNC-080
    type: realizes
    source: GT_esmini/docs/virtualdriver/design/manualdrive_adas_design.md
    note: >-
      レーン中心偏差→補正操舵の本体。**FUNC-080 は既存部品からの流用がゼロだった唯一の
      手動運転中ADAS機能**で（設計 §5-1 の調査どおり、PIDPurePursuit はトラジェクトリ
      preview 点列への追従でレーン中心を追わない）、AEB/ACC/Stop&Go が ITrafficPolicy 実装を
      無改修で載せ替えるだけだったのに対し、こちらは判定も出力も新規に書いた。
      実現範囲は補正と警報の判定・出力まで。FFB 反力として実ハンドルに伝わるか（段d）は
      このユニットの外＝IFFBSink 側であり、headless では代替できない G29 実機限定観点。

  # ---- ⑥常設: フェーズD の新規C++ユニットも同じ傘バイナリに乗る ----
  - from: vd-func:FUNC-080
    to: gate:unit-ctest
    type: sustained-by
    source: GT_esmini/test/CMakeLists.txt
    note: >-
      test_LaneKeepAssist.cpp が傘バイナリ常設（**771/771緑**、2026-08-05 フェーズD実測。
      フェーズC時点は731件）。matcher 側の赤実証は
      GT_esmini/scripts/verification/test_manualdrive_matchers.py（フェーズDで
      lane_kept_within / steer_output_absent の13テストを追加、計90緑）。
      ユニットが実装欠陥を2件捕まえている: envelope の振幅上限が rate 段で押し戻される
      （AdSteeringEnvelope のジャーク段が shipped-disabled のままである当の非対称）と、
      抑制時のランプダウンが要求の「即時中断」に反していたこと。
