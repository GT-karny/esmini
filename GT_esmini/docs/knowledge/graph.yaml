      の signal_active/armed/direction と frames[i]["indicator"] の left/right を**両方**読む。
      片方だけでは判定にならない（lane_change_initiation.md §11-8）: signal_active だけだと
      意図が AutoIndicatorPolicy に握り潰されていても真になり、indicator だけだと
      DetectJunctionTurn の交差点旋回による点灯と区別できない。両ブロックとも欠けていれば
      skip（「何も評価しないものを pass にしない」規律、route_lane_plan_holds と同型）。

  - from: matcher:indicator_leads_junction_turn
