      ギャップ受容（隣接レーンの前後車）・軌道（ResumeMergeProfile 流用、アンカーを
      目標レーンへ）・優先順位（storyboard LC > resume-merge > AD発起）を担う。
      FUNC-055 のうち**経路要求を動機とする発起のみ**を実現し、遅い先行車・専用レーン
