  # --- matcher -> verifies -> req-vd-ad（RouteLanePlan 分。2026-08-02 に宛先を差し替えた） ---
  # 当初は vd-func:FUNC-050 を直接指していた（「policy を経由しないので3段チェーンが使えない」
  # という判断）。しかし matcher(face:3) -> vd-func(face:2) は capability_model.md §0.2 の
