  # ---- 引けなかった辺（縦串の切れた箇所・2026-07-20 実測の一次記録） ----
  # observes を引けなかった matcher（読む量に対応する signal が canonical 面に無い）:
  #   - ~~lane_keep / lane_change_count -> ego の lane_id~~
  #     ★2026-07-24 解消: 7baf202d（assigned_lane_id の走行レーン由来化）→ c22aeb5d
  #     （lane 面1化）で signal:ego_lane が成立し、observes 辺を結線済み（上記）。
  #     「同名の量が2面に別経路で存在し検証は面2側を見ている」状態は終了。
  #   - steer_not_saturated -> `driver.steer`（面2の操舵指令）。
  #     ★2026-07-20 訂正: 当初「乗り換え先の signal:hvd_steering_angle は (b′) 誤配線なので
  #     先に直す必要がある」と書いたが、**その (b′) 判定自体が誤診だった**
  #     （OSI VehicleSteeringWheel.angle はハンドル角で、12.9 はギア比＝変換は正当）。
  #     hvd_steering_angle は健全に emit されており **面1側の乗り換え先になり得る**。
  #     ただし単位が異なる（面2=操舵指令 / 面1=ハンドル角 rad）ため、
  #     「飽和」の閾値定義を面1の量で立て直す必要がある＝依存ではなく再定義の作業。
  #   - no_constraint_kind -> `midlong.constraints[].kind`（面2プランナ内部）。
  #     OSI に受け皿となる概念が無い。
  # sustained-by を引けなかった matcher（常設ゲートで守られていない）:
  #   min_obb_separation_above / impact_speed_below / no_emergency_without_conflict /
  #   lane_keep / lane_change_count / deceleration_profile_smooth /
  #   speed_reduction_before_landmark / steer_not_saturated / no_constraint_kind
  #   = 9件。使用先は junction_conflict / junction_priority / 07_aeb 等の**手動実行マニフェストのみ**。
  #   AEB(REQ-AD-001家族)を判定する matcher が常設ゲートに1件も乗っていない。
  #
  # ★2026-07-21 更新（この穴のうち AEB 分を実際に塞いだ）:
  #   gate:aeb-safety-regression を新設し（run_regression_gate.ps1 Step 2.6 +
  #   resources/xosc/verification/aeb_safety_batch.yaml + committed baseline）、
  #   min_obb_separation_above / impact_speed_below / no_emergency_without_conflict の3件が
  #   常設で発火するようになった。**残る sustained-by 欠は6件**:
  #     lane_keep / lane_change_count / deceleration_profile_smooth /
  #     speed_reduction_before_landmark / steer_not_saturated / no_constraint_kind
  #   （いずれも 05_anticipation 系の手動マニフェスト専用）。
  #   常設ゲートが発火させる matcher は 6件 → **9件**（16 中）。
  #   ただし新ゲートは **CI 未配線＝ローカル限定**なので、「常設」の強度は
  #   gate:vd-behavior-regression（CI にも Windows job がある）より一段弱い。次の一手。
  #   min_separation_above は依然0件だが、これは穴ではなく **DEPRECATED 確定**
  #   （min_obb_separation_above の厳密な劣位版。上の observes 辺の note に根拠）。
  #   min_separation_above はどの資産からも参照されず（実測0件）＝実装のみのデッド matcher。
  #
  # ★2026-07-21 更新その2（残る6件のうち先読み運転分5件を塞いだ / spine-work:anticipation-gate-wiring）:
  #   gate:anticipation-driving-regression を新設し（run_regression_gate.ps1 Step 2.7 +
  #   resources/xosc/verification/anticipation_driving_batch.yaml=旧 anticipation_batch+traffic_lights_regression
  #   を統合 + committed baseline、osi:true）、lane_keep / deceleration_profile_smooth /
  #   speed_reduction_before_landmark / steer_not_saturated / no_constraint_kind の5件が常設で発火。
  #   **残る sustained-by 欠は lane_change_count の1件のみ**（本バッチのどのシナリオも車線変更を
  #   しないため未カバー。閉じるには車線変更シナリオの追加が要る）。
  #   常設ゲートが発火させる matcher は 9件 → **14件**（16 中）。今回は AEB と違い CI にも配線
  #   （vd-behavioral-regression job へ相乗り・別 artifact・continue-on-error）＝AEB より一段強い。
  # capability_model.md §7 の②刺激欠 25件（req 12 + scene 13）を全件手作業で吟味した結果。
  # 根拠は verification 資産の実読（batch の policies: 指定 ＋ expectations の must matcher）。
  # **結線できたのは req 7件（辺8本）＝ ②刺激欠 25 → 18**。scene は13件全て引けなかった。
  #
  # 【結線した req 7件（上の stimulated-by 節）】
  #   001,013 -> policy:aeb ／ 002 -> policy:lead ／ 003 -> policy:traffic_light ／
  #   004 -> policy:stop_yield ／ 005 -> scenario-variant:09_crosswalk_pedestrian__p005 ／
  #   006 -> scenario-variant:07_oncoming_yield__p017（title）+ :08_unsignalized_junction__p004（rationale）。
  #
  # 【(i) 真の②刺激欠＝台帳に残すべき数字（辺を引けない・資産が無い）】
  #   （2026-07-24 更新: REQ-AD-010/011 は aeb_c2c_grid_batch.yaml（CCRs 7 + CCRm 5 + CCRb 4 の
  #    16セル・パラメトリック格子、探索スイープ層・非ゲート）で解消 → 上の stimulated-by 節に結線。
  #    req の刺激欠は 5件 → 3件。）
  #   req 3件:
  #     REQ-AD-012(VRU-AEB) — aeb_implementation_plan.md:27 が「Out(後続波)」と明記。crosswalk バッチは
  #       compliance/courtesy tier の計画的停止＝別 tier の主張（AEB でない）。
  #     REQ-AD-014(層調停) — deceleration_profile_smooth は 05_anticipation（policy 指定なし・カーブ/右折/
  #       制限速度の快適減速）でのみ走り、AEB と comfort の調停状態へ追い込む資産は無い（別文脈）。
  #     REQ-AD-015(規制フロア) — verified_by:[] が自認、aeb_activation_envelope matcher 自体が未実装。
  #   scene 13件（全て）: 生成 scenario-variant 56件は SCN-005/006/009(covered) のみを覆い、
  #     対象13シーンには layer-1 生成対象が及んでいない。to に使える __pNNN が1件も無い。
  #     完全に資産無し: SCN-007(ラウンドアバウト)/012(工事)/013(緊急車)/015(共存空間)/017(車車間認知)/018(動物)。
  #
  # 【(ii) 資産は在るが登録名前空間の ID が無い＝**登録提案**（親判断・勝手に新設しない）】
  #   - 検証xosc が face:3 の scenario-variant として未登録: 07_aeb/06_lead/03_traffic_signals/
  #     04_traffic_signs の手書き xosc（001-004,013 の発火資産）。今回は唯一の登録ハンドルである
  #     policy(face:2) に結線したため、これらは coupling-audit の**面3→面2 直結として +5 計上される**
  #     （下記 coupling 注記）。face-clean にするには検証xosc を scenario-variant 化するか、
  #     検証シナリオ用の face:3 名前空間を新設する必要がある＝**登録提案**。
  #   - scene の非登録資産: SCN-001(01_vehicle_model/straight_constant_speed・05_anticipation/decelerate_for_curve)、
  #     SCN-002(02_basic_control/lane_change_simple.xosc)、SCN-008(highway_example_with_merge_and_split.xodr 等の
  #     道路単体)。いずれも走行関連の実資産だが scenario-variant 命名(__pNNN)未満＝未登録。coverage=partial の
  #     裏付け（資産はあるが検証未整備）と整合。SCN-011(トンネル xodr/xosc + F6 コード)・SCN-016(LHT は
  #     odr_fixtures/lht の**適合フィクスチャ**＝face:1、生成07系は全 lht:false)・SCN-014(駐車場デモ) は
  #     「資産らしきもの」はあるが VD 挙動主張を発火させる構成でない（上流デモ/適合フィクスチャ）ため(i)寄り。
  #
  # 【(iii) 主張が曖昧＝主張の書き直し候補（親調整）】
  #   - REQ-AD-006 は title「対向直進車」と rationale「優先権を評価」が別シーン(p017/p004)を指す2ファセット。
  #     今回は両ファセットに別辺を張って解消したが、要求文が単一シーンを名指ししていない点は要整理。
  #   - REQ-AD-011/014 の verified_by は「同名 matcher が存在する」事実だけを根拠にしており、実際に主張状態を
  #     発火させる資産と未一致（上記(i)）。verified_by を aspirational と実在で区別する記述整理が要る。
  #
  # 【親へ回す報告（本セッションでは直さない・触るなリスト内）】
  #   R1. requirements_vd_ad.yaml:68 REQ-AD-001 red_asset の policies:[lead] は陳腐化（実バッチ [lead,aeb]）。
  #   R2. REQ-AD-011 verified_by / REQ-AD-014 verified_by が充足資産と未一致（(iii)）。
  #   R3. REQ-AD-015 verified_by:[] ＋ aeb_activation_envelope 未実装（matcher 新規が前提）。
  #   R4. scene coverage は正確（partial=資産あり検証未／none=資産無し）だが、SCN-001/002/008 の非登録資産を
  #       face:3 に登録すれば scene も stimulated-by で結線可能＝**scenario-variant 化 or 新名前空間の登録提案**。
  #   R5. **coupling 副作用**: 今回の req->policy 5辺は face:3->face:2 ＝ spine-report の coupling_direct_edge が
  #       0 → 5 に増える。stimulated-by は「観測」ではなく「刺激」の辺であり §0.2 が禁じる面3→面2 *観測*直結とは
  #       別物だが、check_knowledge_graph.py の coupling_direct_edge は edge type を問わず face3->face2 を一律計上する。
  #       ＝ **coupling-audit を stimulus 辺で除外するか（監査側の修正）／検証xosc を face:3 化するか（資産側）**の
  #       いずれかを親が判断する事項（check_knowledge_graph.py は本セッションの触るなリスト）。

