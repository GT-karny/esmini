  # ---- ②刺激: req -> stimulated-by -> policy / scenario-variant（capability_model.md §5） ----
  # 「その主張を実際にどの資産が発火させるか」。根拠は必ず batch の policies: 指定 ＋
  # expectations の must matcher（実行が主張の状態へ追い込む証拠）で、シナリオ名の類似では引かない。
  # **face 注記**: policy は face:2、req-vd-ad は face:3 → req->policy は coupling-audit の
  # 面3→面2 直結として計上される。検証シナリオが登録済み scenario-variant(face:3) の場合は
  # そちらを優先し face-clean にする（005/006）。検証xosc が手書き（07_aeb / 06_lead / 03/04）で
  # scenario-variant 化されていない 001/002/003/004/013 は policy が唯一の登録ハンドル
  # ＝ 面3→面2 は名前空間設計の穴の症状（末尾の一次記録・登録提案を参照）。
  - from: req-vd-ad:REQ-AD-001
    to: policy:aeb
    type: stimulated-by
    source: resources/xosc/verification/aeb_safety_batch.yaml
    note: >-
      cutin_hard_brake(_curve).xosc が policies:[lead,aeb]（:47,:50）で AebSafety を発火させ、
      impact_speed_below(直進, 閾10.0)/min_obb_separation_above(カーブ, 閾0.5) で判定。
      判定を担うのは lead ではなく aeb 側 matcher。
      ※ requirements_vd_ad.yaml:68 の red_asset は policies:[lead] と記すが陳腐化（実バッチは [lead,aeb]）。
  - from: req-vd-ad:REQ-AD-013
    to: policy:aeb
    type: stimulated-by
    source: resources/xosc/verification/aeb_safety_batch.yaml
    note: >-
      負例3本 normal_following/benign_cutin/parallel_overtake が policies:[lead,aeb]（:58,:61,:64）で
      AEB パイプラインの各段（ゲート非発火/候補拒否）を狙い撃ち、no_emergency_without_conflict で
      誤発火ゼロを判定。正例(001)と同一バッチ・同一ベースライン（sustained-by:aeb-safety-regression 参照）。
  - from: req-vd-ad:REQ-AD-010
    to: policy:aeb
    type: stimulated-by
    source: resources/xosc/verification/aeb_c2c_grid_batch.yaml
    note: >-
      CCRs 7セル（aeb_c2c_grid/ccrs_ego10..70.xosc, policies:[lead,aeb], osi:true）＝停止先行車への
      パラメトリック接近（初期ギャップ=閉じ速度x6s）。判定は expectations でなく探索スイープ層の
      score_aeb_c2c_grid.py（obb_separation/_closing_speed を vd_metrics から流用）で帯分類。
      2026-07-24 実測: 全セル avoid(no_aeb)＝AEB は armed だが不発火（min TTC 2.78s > 閾2.5s）、
      回避は AD 層（max 3.9 m/s²）。aeb はバックストップとして毎フレーム gt.aeb.* で観測済み。
      行列は GT_esmini/docs/virtualdriver/measurements/aeb_c2c_grid_matrix.md に固化。
  - from: req-vd-ad:REQ-AD-011
    to: policy:aeb
    type: stimulated-by
    source: resources/xosc/verification/aeb_c2c_grid_batch.yaml
    note: >-
      CCRm 5セル（ccrm_ego30..70_lead20.xosc）＋ CCRb 4セル（ccrb_hw{12,40}_d{2,6}.xosc,
      NCAP 車間12/40m・制動-2/-6 m/s²）、policies:[lead,aeb]。判定は score_aeb_c2c_grid.py の帯行列。
      2026-07-24 実測: 全セル avoid(no_aeb)。ただし ccrb_hw12 系は max 8.6 m/s² の強制動での回避
      ＝本物のニアミス（min TTC 2.83s、Claim B「IDM経路は快適天井を迂回」の実証セル）。
      avoid/mitigate 境界は本グリッドの外側＝格子細分化/ギャップ短縮が後続課題。
  - from: req-vd-ad:REQ-AD-002
    to: policy:lead
    type: stimulated-by
    source: resources/xosc/verification/car_following_traffic_control_batch.yaml
    note: >-
      06_lead_vehicle/follow_steady.xosc が policies:[lead]（:59）。
      maintained_following_distance（min_thw 1.0/max_thw 3.5/percentile 50）で快適車間維持を判定。
  - from: req-vd-ad:REQ-AD-003
    to: policy:traffic_light
    type: stimulated-by
    source: resources/xosc/verification/car_following_traffic_control_batch.yaml
    note: >-
      03_traffic_signals/red_stop_green_go.xosc が policies:[traffic_light]（:25）。
      stopped_at_signal(require_red=true, signal_id:1/road_id:3) で停止線手前停止を判定。red_hold も同 policy で補強。
  - from: req-vd-ad:REQ-AD-004
    to: policy:stop_yield
    type: stimulated-by
    source: resources/xosc/verification/car_following_traffic_control_batch.yaml
    note: >-
      04_traffic_signs/stop_sign_full_stop.xosc が policies:[stop_yield]（:38）。
      stopped_at_stop_sign(sign_id:10/road_id:1/min_duration 1.0) で完全停止を判定。
  - from: req-vd-ad:REQ-AD-005
    to: scenario-variant:09_crosswalk_pedestrian__p005
    type: stimulated-by
    source: resources/xosc/verification/crosswalk_pedestrian_batch.yaml
    note: >-
      p005（crosswalk_pedestrian_batch.yaml:36-38, policies:[crosswalk]）が横断中歩行者へ発火。
      min_obb_separation_above(閾0.3, 歩行者 footprint 0.6x0.5 実寸との分離)＋speed_below で衝突回避を判定。
      登録済み scenario-variant を直指し＝face:3 で face-clean（policy:crosswalk 迂回を回避）。
  - from: req-vd-ad:REQ-AD-006
    to: scenario-variant:07_oncoming_yield__p017
    type: stimulated-by
    source: resources/xosc/verification/junction_conflict_batch.yaml
    note: >-
      p017（junction_conflict_batch.yaml:31-33, policies:[conflict]）＝Ego 左折が 14m/s 対向直進車を横切る
      ＝要求 title「対向直進車に譲る」に字句一致。min_obb_separation_above/speed_below で判定。
      face:3 scenario-variant を直指し。
  - from: req-vd-ad:REQ-AD-006
    to: scenario-variant:08_unsignalized_junction__p004
    type: stimulated-by
    source: resources/xosc/verification/junction_priority_batch.yaml
    note: >-
      p004_nonpriority_yield（junction_priority_batch.yaml:38-40, policies:[conflict,junction_priority]）＝
      非優先(MINOR)側が優先側に譲り STOP_AT_S で待つ＝要求 rationale「優先権を評価…非優先側は STOP_AT_S」
      および realized_by FUNC-029(交差点優先権) に一致（直交交差車で title の「対向直進」とは別ファセット）。
      title=p017／rationale=p004 の2ファセットを別辺で明示（要求が両面を包含）。

  # ---- ④観測: matcher -> observes -> signal（capability_model.md §5, フェーズ1） ----
  # vd_metrics.py::eval_must の全分岐を実読して引いた辺。**引けなかった辺こそ情報**で、
  # 末尾の「引けなかった列」コメントに残す（縦串の切れた箇所の一次記録）。
  - from: matcher:speed_above
    to: signal:ego_speed
    type: observes
    source: GT_esmini/web/backend/services/vd_metrics.py
    note: frames[i]["ego"]["speed"]（面2テレメトリ投影経由）
  - from: matcher:speed_below
    to: signal:ego_speed
    type: observes
    source: GT_esmini/web/backend/services/vd_metrics.py
    note: 同上（speed_above と同一分岐）
  - from: matcher:lane_keep
    to: signal:ego_lane
    type: observes
    source: GT_esmini/web/backend/services/vd_metrics.py
    note: >-
      ★2026-07-24 結線（c22aeb5d lane 面1化）: _ego_state が is_host の assigned_lane_id
      （classification 優先・field4 fallback）を scene.lane_map で解決（scene 優先・
      telemetry fallback・使用面は verdict の ego_source に記録）。
  - from: matcher:lane_change_count
    to: signal:ego_lane
    type: observes
    source: GT_esmini/web/backend/services/vd_metrics.py
    note: 同上（lane_keep と同じ _ego_state 経由の判定車線）。
  - from: matcher:min_speed_above
    to: signal:ego_speed
    type: observes
    source: GT_esmini/web/backend/services/vd_metrics.py
    note: 同上
  - from: matcher:speed_reduction_before_landmark
    to: signal:ego_speed
    type: observes
    source: GT_esmini/web/backend/services/vd_metrics.py
    note: ego.speed ＋ ego.s（ランドマーク手前の減速率）
  - from: matcher:speed_reduction_before_landmark
    to: signal:ego_pose
    type: observes
    source: GT_esmini/web/backend/services/vd_metrics.py
    note: ego.s（走行距離）で窓を切る
  - from: matcher:deceleration_profile_smooth
    to: signal:ego_speed
    type: observes
    source: GT_esmini/web/backend/services/vd_metrics.py
    note: >-
      **本来は signal:ego_accel_long を観測すべき matcher**。OSI に加速度が emit 済み
      (GT_OSIReporter_Moving.cpp:772-774) なのに speed の中心差分で自前推定している
      (vd_metrics.py:253-259)。この辺を ego_accel_long に付け替えるのが §2.3a の
      「配線差し替えだけで面1経由に移せる最有力候補」。
  - from: matcher:stopped_at_stop_sign
    to: signal:ego_speed
    type: observes
    source: GT_esmini/web/backend/services/vd_metrics.py
    note: _sustained_stop（速度が閾値未満の継続時間）
  - from: matcher:stopped_at_signal
    to: signal:ego_speed
    type: observes
    source: GT_esmini/web/backend/services/vd_metrics.py
    note: 主判定は面2テレメトリの速度（vd_metrics.py:565-595）
  - from: matcher:stopped_at_signal
    to: signal:traffic_light_state
    type: observes
    source: GT_esmini/web/backend/services/vd_metrics.py
    note: >-
      require_red サブチェックのみ OSI GroundTruth 経由（scene.traffic_lights[].color）
      ＝14 matcher 唯一の混在型。`--osi`/batch `osi: true` が無いと scene=None で skip。
  - from: matcher:stopped_at_stop_sign
    to: signal:traffic_sign_classification
    type: observes
    source: GT_esmini/web/backend/services/vd_metrics.py
    note: >-
      require_sign サブチェック（2026-07-21 新設）。`_gt_to_scene` が静的GTの traffic_sign を
      scene に載せるようになったため引けた辺（従来は「OSI が出しているのに scene 変換層で
      せき止められる」(b)の代表例）。分類 stop/give_way を positive にのみ使い、esmini が
      カタログ未分類を "unmapped:" 番兵で返すため否定側では判定しない。ゲート実測で
      stop_sign_full_stop / semantic_stop_sign_full_stop（P4 意味論 fallback 経路）の
      両方が "stop sign confirmed in scene" を出すことを確認済み。
  - from: matcher:stopped_at_signal
    to: signal:traffic_light_assigned_lane
    type: observes
    source: GT_esmini/web/backend/services/vd_metrics.py
    note: >-
      require_red サブチェックの多灯交差点向け絞り込み（2026-07-21 新設）。must の `lane_id`
      指定時のみ classification.assigned_lane_id で信号頭を選ぶ。既存 expectations は
      lane_id を持たないため現行ゲートの判定は不変（deviation 0 で実証済み）。
  - from: matcher:impact_speed_below
    to: signal:pedestrian_velocity_vector
    type: observes
    source: GT_esmini/web/backend/services/vd_metrics.py
    note: >-
      _closing_speed が scene.objects[].vx,vy（OSI 速度ベクトル）を第一候補として読む
      （2026-07-21）。従来は速度スカラー＋heading から再構成しており、**自機の heading と
      逆向きに動く物体（後退車・車道から後ずさる歩行者）の符号を落としていた**。
      heading 再構成は旧テレメトリ向けの後方互換 fallback として残置。
  - from: matcher:maintained_following_distance
    to: signal:object_poses
    type: observes
    source: GT_esmini/web/backend/services/vd_metrics.py
    note: scene.objects[]（正規IF＝面1 OSI 直結の4件のうち1件）
  - from: matcher:maintained_following_distance
    to: signal:ego_speed
    type: observes
    source: GT_esmini/web/backend/services/vd_metrics.py
    note: THW = gap / speed の分母
  # DEPRECATED→削除済み: matcher:min_separation_above -> signal:object_poses の observes 辺は
  # 2026-07-24 に実装削除と同時に撤去（辺だけ残すと lint が id_pattern 不一致で落ちるため）。
  # 判断の記録（2026-07-21 確定）: 中心間ユークリッド距離は min_obb_separation_above の
  # 厳密な劣位版であり復活させる価値が無い。中心間距離は隣接レーン通過（中心間 ~2.8m）を
  # 「接近」と誤読するのに対し OBB 版は車体が重ならないことを正しく安全と読む
  # （vd_metrics.py の OBB 実装コメント自身がこの移行理由を述べている）。参照資産0件（実測）。
  # 実装削除時に namespaces.yaml の matcher id_pattern / count 16→15 も同時更新済み。
  - from: matcher:min_obb_separation_above
    to: signal:obb_separation
    type: observes
    source: GT_esmini/web/backend/services/vd_metrics.py
    note: SAT による OBB 分離（隣接レーン通過での誤検出を避けるため中心間距離から移行）
  - from: matcher:impact_speed_below
    to: signal:obb_separation
    type: observes
    source: GT_esmini/web/backend/services/vd_metrics.py
    note: OBB 接触判定と接近速度の組み合わせ
  - from: matcher:impact_speed_below
    to: signal:object_poses
    type: observes
    source: GT_esmini/web/backend/services/vd_metrics.py
    note: 相手の位置・方位・速度
  - from: matcher:no_emergency_without_conflict
    to: signal:aeb_trigger_flag
    type: observes
    source: GT_esmini/web/backend/services/vd_metrics.py
    note: policy.constraints[].source == "aeb"（負matcher＝誤作動ゼロ）

  # ---- ⑥常設: matcher -> sustained-by -> gate（capability_model.md §5, フェーズ1） ----
  # 常設ゲート gate:vd-behavior-regression（12シナリオ）が実際に発火させる matcher だけを引く。
