# Curated knowledge-graph edges (hand-authored judgment relations ONLY).
#
# Rules (enforced by scripts/check_knowledge_graph.py):
#   - from/to are "<namespace-slug>:<local-id>"; slug must be registered in
#     namespaces.yaml and the local id must fullmatch its id_pattern.
#   - type must be a *curated* edge type (namespaces.yaml edge_types.curated).
#     Generated types (implements/closes/refs) are extracted from git history
#     by "check_knowledge_graph.py --extract-commits" and never written here.
#   - source = where the relation is stated (repo-relative path); note = why.
#
# Staleness policy: keep this file small. If a relation can be derived from a
# machine-readable source (commit messages, manifests, expectations), derive
# it — do not copy it here.

