      強い加速 0.40 → **2.30 s**、ギャップ待ち 4.45 → **7.00 s**、
      定速 **3.05 s**（t_sig 近傍の加速度 0.00066 m/s²）、緩加速 2.10 → **3.05 s**。
      チャタリングは4本とも signal_active・ランプの立ち上がりが各1回でゼロ。
      **プロンプト段階で想定された数値微分形は採らなかった** — 実トレースに当てると 0.70 s
