  - id: REQ-AD-023
    title: 遅い先行車を追い越して巡航速度へ戻る
    tier: comfort
    agent: AD
    kind: positive
    statement: >-
      WHILE 目標速度より遅い先行車に拘束されているとき、VD は安全な隙間を選んで
      追い越しレーンへ移り、先行車を抜いたのち元のレーンへ復帰すること。
    scenario: >-
      resources/xosc/verification/08_overtake/ の4本（overtake_batch.yaml、
      policies は overtake と lead）。段 a-d は overtake_slow_lead_on_two_lane_road
      （片側2車線・同方向追い越しの完遂）、段 e は
      overtake_into_oncoming_lane_when_clear（片側1車線・対向車線を使う追い越し、
      policies に overtake_opposing_lane を追加）。道路は生成器
      resources/scenario_authoring/road_catalog/gen_straight_restricted_exit.py
      の出力（800 m 直線＋接続レーンを1本に絞った分岐）。既存 xodr には
      「直線・片側2車線以上・数百 m・その先に junction」を満たすものが無かった。
    acceptance_ladder:
      - { step: a, claim: 目標速度より遅く自車を拘束している先行車を追い越しの動機として検出できる, met: true,  verified_by: [matcher:overtake_decision_holds] }
      - { step: b, claim: 追い越しレーンの隙間を受容して追い越しレーンへ移る,                       met: true,  verified_by: [matcher:overtake_decision_holds] }
      - { step: c, claim: 先行車を抜いたのち元のレーンへ復帰する,                                   met: true,  verified_by: [matcher:overtake_decision_holds] }
      - { step: d, claim: 往路・復路の両方で進路変更の前から方向指示器で予告する,                   met: true,  verified_by: [matcher:indicator_leads_lane_change] }
      - { step: e, claim: 同方向の追い越しレーンが無い道路で対向車線を使って追い越す,               met: true,  verified_by: [matcher:overtake_decision_holds] }
      - { step: f, claim: 追い越し禁止区間・実線を遵守して発起を抑止する,                           met: false, verified_by: [] }
      - { step: g, claim: 対向車線追い越しで見通し距離（遮蔽）を考慮する,                           met: false, verified_by: [] }
    acceptance: >-
      段 a は signal:overtake_decision の considered が真になること。**この段は
      他の全段の前提でもある** — considered が一度も立たない緑は、機能が働いた
      証拠ではなく「そもそも検討していない」偽 PASS である（overtake_maneuver.md §9-1）。
      段 b/c は phase が signal_out → out → pass → signal_back → back → idle の順に
      観測されること（matcher の expect_phases は部分列一致）。段 c の完遂側は
      cleared_lead が真になることで、中断側（req-vd-ad:REQ-AD-024 段 c）と
      **同じフィールドの逆極性**で判定する — 定数のフィールドは何も判別しないので、
      2本の刺激が逆極性を主張して初めてこの観測量は意味を持つ。
      段 d は matcher:indicator_leads_lane_change を **window で往路・復路に分けて
      2回**呼ぶ（matcher は窓内の最初の signal_active / armed しか拾わないため）。
      閾値 min_lead_s 2.9 は法定 3.0 s（道交法 第53条第1項／同施行令 第21条第1項）から
      フレーム量子化（dt=0.05）ぶんを引いた値で、主張の緩和ではない
      （req-vd-ad:REQ-AD-018 段 b/c と同じ根拠づけ）。
      **段 f は未達＝本実装は追い越し禁止区間を無視して追い越す。** vd-func:FUNC-030 が
      未実装であり、道路標示データを読む層が無い。対向車線追い越しを
      overtake_use_opposing_lane_enabled で二重に閉じ既定 OFF にしているのはこのため。
      **段 g も未達** — overtake_oncoming_lookahead_m（既定 400 m、AASHTO 追い越し視距の
      設計速度 60 km/h 相当）は**スキャン距離であって見通し距離ではない**。縦断勾配・
      カーブ・遮蔽物による視距のモデルはこの層に無く、「その範囲に対向車が居ないこと」
      しか主張しない。
    realized_by: [vd-func:FUNC-056, vd-func:FUNC-061]
    verified_by: []
    related: [req-vd-ad:REQ-AD-017, req-vd-ad:REQ-AD-018, req-vd-ad:REQ-AD-024, vd-func:FUNC-030, vd-func:FUNC-044]
    status: partial
    note: >-
      2026-08-04 実装（vd-component:overtake-maneuver、vd-func:FUNC-055 の1ホップ機構の上に
      「動機」を1つ足す形）。**既定 OFF**（overtake_enabled。lane_change_initiation_enabled
      とは独立キー — 同居させると「経路追従の車線変更だけ欲しい」利用者が追い越しまで
      有効化してしまう）。
      設計の主題は「**追い越しには締切が無い**」こと（overtake_maneuver.md §1）。
      vd-func:FUNC-055 は「3秒前に合図する」を時間で遡れないので距離で解いた（同 §11-1）が、
      追い越しは待つことに代償が無いので**合図してから T 秒待って発起するタイマ形**にした。
      結果として法定リードは近似ではなく設計上ちょうど T になる。前進予測形も v_cap の罠も
      チャタリング用ラッチも要らない。
      **「遅い」に定数を置いていない。** 追い抜きは相対的に L_clear = g0 + g1 + L_ego + L_lead だけ
      前へ出る運動なので、t_pass = L_clear / dv <= overtake_max_pass_time_s に畳むと
      速度差の下限 dv_min = L_clear / t_max が**導出量**になり config に現れない。
      t_max の既定 10.0 s は AASHTO 追い越し視距の左車線占有時間 t2（9.3-11.3 s）由来の
      **出典ベースの設計値であって本プロジェクトの実測ではない**。
      追い越しレーンは「レーン id が 0 に近づく側の隣接レーン」の1規則で RHT/LHT 両方が
      正しくなる（どちらもセンターライン側＝追い越し側）。
      **制限速度は守り切る** — v_pass = min(last_action_target_, GetSpeedLimit())
      （respect_speed_limit 既定 true）。追い越し中だけ速度を上乗せする経路は無い。
      帰結として自車が制限速度に張り付いていると dv が小さくなり t_pass が伸びて
      pass_too_long で見送られる＝閾値を別に置かずに構造的に抑止される。
      **実測（2026-08-04、実 Release ビルド、dt=0.05、overtake_batch.yaml 4/4 pass・21/21 must）**:
      overtake_slow_lead_on_two_lane_road は signal_out@0.05 → out@3.00（**往路リード 2.95 s**、
      dir=+1・ランプ L）→ lane -2→-1@5.00 → pass@6.40 → signal_back@10.25 →
      back@13.25（**復路リード 3.00 s**、dir=-1・ランプ R）→ lane -1→-2@15.15 → idle@16.65。
      最終 route_lane は road_id=2 / on_target_lane=true / **deviation_count=0** で、
      ego は track 0→101→2 と junction を実際に渡っている（deviation_count は road が
      切り替わる瞬間にしか増えないので、渡っていなければ 0 のまま自明に緑になる）。
      対向車線側は lane -1 → **+1** → -1 で同じリード（2.95 / 3.00 s）。
      Position::Delta は基準レーンを跨ぐとき dLaneId の絶対値を1減らすので
      対向レーンへの direction_step は **±1**（±2 ではない。RoadManager.cpp:12279-12287）。
      判別子は dOppLane と dDirection で、dLaneId だけでは同方向隣接レーンと区別できない。

