    verified_by: []                       # 段 a/b/c は matcher が担保（ladder 側に記載）。要求
                                          # そのものに verifies を張るのは段 d が未達のため overclaim
    related: [req-vd-ad:REQ-AD-017, vd-func:FUNC-055]
    status: partial
    note: >-
      2026-08-02 に段 a 達成（lane_change_initiation.md §11、DetectManeuverDir を4段へ拡張し
      lc_signal_dir_ で先行合図を出す）。**既定 OFF**（lane_change_initiation_enabled）。
      実測（同日、実 Release ビルド）: 隣接車なし t_sig=2.30 / t_arm=2.70 = リード 0.40 s、
      ギャップ待ちあり t_sig=3.10 / t_arm=7.55 = リード 4.45 s。
      2026-08-03 に**段 b・段 c 達成**（同 §11-11）。距離形
      `dist <= required(v) + v*T` を**前進予測形**へ置き換えた:
      `dist - (v+v_pred)/2*T <= required(v_pred)`、`v_pred = min(v + max(0,a)*T, max(v, v_cap))`。
      a=0 で旧式と厳密に一致するので**定速時の挙動は不変**（実測でも定速側のリードが
      修正前後で 2.95 s のまま動かず、`t_arm` は4本とも完全に同一＝発起側は不変）。
      実測（2026-08-03、実 Release ビルド、route_lane_batch.yaml）:
      強い加速 0.40 → **2.30 s**、ギャップ待ち 4.45 → **7.00 s**、
      定速 **3.05 s**（t_sig 近傍の加速度 0.00066 m/s²）、緩加速 2.10 → **3.05 s**。
      チャタリングは4本とも signal_active・ランプの立ち上がりが各1回でゼロ。
      **プロンプト段階で想定された数値微分形は採らなかった** — 実トレースに当てると 0.70 s
      しか出ない。required_m が床の枝にいる間 微分が 0 になり、直後に来る枝の乗り換えを
      予見できないためである（同 §11-11）。前進予測形は n_remaining を微分しないので、
      ホップ完了時の不連続も微分のリセットも平滑化も要らない。
      チャタリング対策は EMA ではなく**ホップ単位のラッチ**（時定数を正当化せずに済み、
      §11-6「ギャップ待ちでも消さない」と筋が通る）。
      なお最終バンド（dist_to_connection == -1）では ShouldAttemptLaneChangeHop が true・
      ShouldSignalLaneChangeHop が false となり先行しない（同 §11-3 の「既知の非対称性」）。
      **これは段 c の未達分ではなく独立した既知欠陥として残る**（発起側を変えることになり
      車線変更そのものの挙動が動くため、今回もスコープ外とした）。
      ウィーン条約（1968）は秒数を規定せず「マニューバ中継続・完了で消灯」のみ、独 StVO §5 は
      定性規定、米国は多くの州が距離規定 — 次元が国ごとに違うため国別テーブルは作らず、
      秒パラメータ1本を config で可変にして既定を日本の法定値に置く方針（同 §11-2）。

