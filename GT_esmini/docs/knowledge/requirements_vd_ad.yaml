      出して判定する＝「設定した」と「効いた」を別の観測量で示す。段 f は域外進入で
      ACTIVE→STANDBY の遷移が起き、かつ介入出力が止むことの両極性判定（負系を兼ねる）。
      段 g は有効/無効の2構成で同一刺激を走らせ、実効値の差で示す。段 h は定常追従中に
      設定を切り替え、収束後の実測 THW が段階に応じて変わることで示す（1本の刺激で
