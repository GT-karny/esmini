    acceptance_ladder:
      - { step: a, claim: 追い越しマニューバの所要距離を見積もれる,                                met: true,  verified_by: [matcher:overtake_decision_holds] }
      - { step: b, claim: 復帰後に経路上の残ホップを完了できない配置では追い越しを発起しない,      met: true,  verified_by: [matcher:overtake_decision_holds] }
      - { step: c, claim: 追い越し中に経路の締切が来たら追い抜きを中断して経路を優先する,          met: true,  verified_by: [matcher:overtake_decision_holds] }
      - { step: d, claim: 中断して戻ろうとしたが隙間が空かない場合の振る舞いが観測できる,          met: false, verified_by: [] }
    acceptance: >-
      許可条件は
      d_out + d_pass + d_back + RequiredLaneChangeDistance(n_back, v, cfg) + reserve <= dist_to_connection
      （overtake_maneuver.md §2）。**n_back は「現在レーンから」ではなく
      「追い越しレーンから」目標レーン帯までのホップ数である** — 追い越しは
      on_target_lane == true の状態から始まるので、現在レーンを基準に取ると
      n_remaining == 0 で式が自明に通り、ガードが素通りになる（同 §2-1）。
      段 b の一次証拠は **considered == true かつ blocked_reason == route_budget かつ
      phase が終始 idle** の3点同時成立である。considered を落とすと
      「そもそも追い越しを検討していないから緑」＝偽 PASS と区別できない。
      段 c は phase が pass → signal_back へ移り、かつ **cleared_lead == false が全フレームで
      成立**すること（＝抜き切らずに戻った）と blocked_reason == route_budget が
      signal_back/back で立つこと。**段 d は未達** — 復路の隙間が空かない場合は
      追い越しレーンに留まり既存の deviation_count が逸脱を記録する設計だが
      （overtake_maneuver.md §5-2、lane_change_initiation.md §5 の決定を継承）、
      それを発火させる刺激が未整備で一度も観測していない。
    realized_by: [vd-func:FUNC-056]
    verified_by: []
    related: [req-vd-ad:REQ-AD-017, req-vd-ad:REQ-AD-023]
    status: partial
    note: >-
      2026-08-04 実装・実測。**ガードは事前条件であって保証ではない** — 発起の時点で
      「戻れるだけの距離がある」ことしか確かめないので、発起後に隣が詰まって復路の隙間が
      空かなければ距離があっても戻れない（段 d）。この残余リスクは消したことにしない。
      緩和として §5-2 の安全弁（追い越し中に経路の締切が来たら追い抜きを打ち切って戻りにかかる）を
      1つ置いてある。
      **dist_to_connection == -1 の極性が3か所で全部違う**（RouteLanePlan.hpp:77 の
      「-1 = unknown / 接続点なし」）: ShouldAttemptLaneChangeHop は true（もう待つ先が無いので即断）、
      ShouldSignalLaneChangeHop は false（負のセンチネルに <= は常に真＝出っぱなしになる）、
      **本ガードは true（逃す分岐がそもそも無い）**。単体テストで明示的に固定してある。
      **安全弁は「合図しきい値」で開く（2026-08-04、実測にもとづく訂正）。** 当初
      ShouldAttemptLaneChangeHop（発起しきい値）で書いたところ、開いた時点で残距離が
      ちょうど1ホップぶんしかなく法定ドウェルを置く余地が無いため、初回実装は締切時に
      ドウェルを飛ばしていた。**実測で復路の指示器リードが 0.05 s**（クリア経路では 3.00 s）となり
      req-vd-ad:REQ-AD-023 段 d を破っていた。ShouldSignalLaneChangeHop へ替えて解決
      （合図しきい値は発起しきい値より v×T だけ手前にあり、その v×T こそドウェルが使う距離）。
      **締切はギャップ受容も飛ばさない** — 安全でないと判定した隙間へ分岐に間に合わせるために
      突っ込む取引はこの層ではしない。
      **実測（2026-08-04、実 Release ビルド）**: overtake_declined_before_route_branch は
      全フレーム phase=idle・considered=true・blocked_reason=route_budget
      （required=496.667 m > dist_to_connection=399.0 m）。
      overtake_aborted_for_route_branch は signal_out@0.05 → out@3.00 → pass@6.40 →
      **signal_back@31.75（route_budget_m=199.1 ≒ 合図しきい値 140+60）** →
      back@34.75（route_budget_m=139.1 ≒ 発起しきい値 140。**ドウェルが合図しきい値の買った
      距離をちょうど使い切っている**）→ idle@38.15、cleared_lead は全 1240 フレームで false、
      最終 deviation_count=0。
      **cleared_lead の意味論は実装当初壊れていた（2026-08-04 修正）。** PASS の判定が
      弁と幾何クリア判定を1つのフラグに畳んで短絡していたため、**弁で戻った場合も
      cleared_lead=true を publish していた**＝「抜かずに諦めた」と「抜いて戻った」が
      区別できず、§9-1 がこの観測量を作った目的そのものを壊していた。幾何判定を
      無条件評価に変え、cleared_lead はそこからのみ立て、戻った理由は blocked_reason へ
      分離した。**検知器の両極性は2本の刺激が逆極性を主張することで実証してある。**

  # ===== ManualDrive 中 ADAS 並行稼働ファミリ（vd-func:FUNC-075/079/080）: 2026-08-04 新設 =====
  # 方式決定（ユーザー判断 2026-08-04）: (1) AEB と人間指令の境界 = 実車型（運転者の明確な
  # 加速意思で介入を抑制する。UN R152 の運転者上書き規定に相当 — 二次資料経由・原文未確認）、
  # (2) ACC 操作系 = 実車標準（ブレーキ=解除 / アクセル=一時上書き / set・resume・cancel）、
  # (3) 面3の観測面 = HVD 直読（signal=OSI canonical の3面契約に整合。VDテレメトリ型ゲート
  # 緩和は面3→面2結合負債の再生産になるため不採用）、(4) FUNC-079/080 を凍結例外で新設。
  # アーキテクチャは案A（ManualDriveCoordinator の cmd 確定後・StepPedalSteer 前に
  # AdasCoexistenceLayer を挿入。ポリシー本体はゼロ改修＝TrafficPolicyContext{ego,entities,
  # sim_time} は upstream Controller 基底のメンバで ManualDrive も既に保持）。
  # 検証は F7 の HeadlessFfbInput（frozen=無反応ドライバ等、決定論的合成入力）を正とし、
  # G29 実機限定観点（FFB反力伝達）は駐車検証計画 §6 と同じ流儀で区分する。

