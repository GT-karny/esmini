      （「合図してから待つ」、段 a）、lane_change_to_exit_ramp_at_constant_speed
      （真の定速、段 b）、lane_change_to_exit_ramp_during_gradual_acceleration
      （加速の継続中に発起、段 c）。後半2本は 2026-08-03 追加で、どちらも
      ego を lane -3 発進（n_remaining=1）にして助走を確保している — lane -1/-2 発進では
      required_m=270 m が道路の 190 m を超え、ego が生成時点で既にしきい値の内側に入る。
      FUNC-056..059 由来の進路変更（追い越し・交差点・発進・合流）を刺激する資産は未整備。
    acceptance_ladder:
      - { step: a, claim: 車線変更の発起より前に方向指示器が点灯する,                     met: true,  verified_by: [matcher:indicator_leads_lane_change] }
      - { step: b, claim: 定速走行時に法定のリード（進路変更の3秒前）を満たす,             met: true,  verified_by: [matcher:indicator_leads_lane_change] }
      - { step: c, claim: 加速中もリードが縮まない,                                       met: true,  verified_by: [matcher:indicator_leads_lane_change] }
      - { step: d, claim: 経路要求以外の車線変更発起（追い越し・車線外からの発進・非経路の合流）にも同期する, met: false, verified_by: [] }
    acceptance: >-
