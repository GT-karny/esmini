      - { step: a, claim: "前進駐車（直角枠）: 空き枠へ前進のみで進入し枠内に停止できる",                                  met: false, verified_by: [] }
      - { step: b, claim: "バック駐車（直角枠）: 後退を含むマヌーバで枠内に停止できる（切り返し3回以内）",                 met: false, verified_by: [] }
      - { step: c, claim: "定量基準の充足 — 必須: 車体外形が四輪とも枠内・ヨー偏差±5°以内・前後端はみ出しなし・切り返し3回以内 / 望ましい: ヨー偏差±3°以内（ISO 16787 の実務水準）・枠中心横偏差0.3m以内・切り返し1回以内", met: false, verified_by: [] }
      - { step: d, claim: 複数回切り返しの高度化・縦列駐車（将来スコープ、本要求では未達でよい）,                          met: false, verified_by: [] }
    acceptance: >-
      段 a/b は枠内停止（四輪とも枠内）の到達可否。段 c は定量基準（必須/望ましい
      の2水準）。段 d は将来スコープであり本要求の受入対象外。
    realized_by: [vd-func:FUNC-077]
    verified_by: []
    related: [req-vd-ad:REQ-AD-019]
    status: future
    note: >-
