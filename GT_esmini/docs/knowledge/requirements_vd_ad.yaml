# VirtualDriver 自動運転 / ADAS 対応シーン要求（namespace: req-vd-ad）
#
# status: DRAFT (phase 0). 設計軸は GT_esmini/docs/virtualdriver/design/adas_axis.md を参照。
# 各要求は「動機層(tier) × 主体(agent)」の交点に置く。
#   tier  : safety(安全機能) | compliance(法規遵守機能) | courtesy(譲り合い機能) | comfort(快適機能)
#   agent : AD(連続計画・交渉) | ADAS(離散ガーディアン/アシスト)
#
# ID書式: REQ-AD-NNN (namespaces.yaml の id_pattern REQ-AD-[0-9]{3})。
# 知識グラフの辺は graph.yaml 側に持つ（policy -> realizes -> 要求 / matcher -> verifies -> 要求）。
# realized_by / verified_by / related は可読性のための冗長コピー（真実源は graph.yaml）。

tiers:
  safety:     { ja: 安全機能,     arbitration: override,         note: 快適・法規の上限を破ってよい唯一の層（emergency_decel） }
  compliance: { ja: 法規遵守機能, arbitration: hard-constraint,  note: 破れない下限。安全にのみ譲る }
  courtesy:   { ja: 譲り合い機能, arbitration: soft,             note: 法規を超えた協調・譲歩。快適とトレードオフ }
  comfort:    { ja: 快適機能,     arbitration: soft,             note: 走行品質（車間・滑らかさ） }

agents:
  AD:   連続的な計画・交渉レイヤ（経路追従＋ルール遵守＋協調）
  ADAS: 離散的なガーディアン/アシスト機能（特定トリガで介入する保険。AD計画の上に override 層として乗る）

kinds:
  positive:    介入必須（〜すべき）。ぶつかりそうなら止まる等
  negative:    誤作動抑止（〜すべきでない）。ぶつからない時に緊急制動しない等（SOTIF対）
  arbitration: 層間調停。快適で回避可能なら緊急介入しない等
  regulatory:  規制フロア（UN R152等の最低作動域・応答）

# 拡張スキーマ（AEBファミリ以降の要求で使用。NCAP/R152セルから逆算・詳細は aeb_requirements.md）:
#   kind        : positive | negative | arbitration | regulatory
#   statement   : EARS構文（トリガ時=WHEN / 状態時=WHILE / 異常時=IF ＋ 〜すること）
#   scenario    : 前提シーン（target種別・接近形態）
#   trigger     : 作動条件（TTC/必要減速度が閾値超過 等）
#   parameters  : 試験行列（ego速度域・target速度/減速・overlap）。値は要校正
#   response    : 要求される応答（定量。emergency_decel/警報リード 等）
#   acceptance  : 合否（低速=完全回避 / 高速=衝突速度低減≥Δv）＋測定量
#   source      : 出典標準（翻案元。Euro NCAP コード / UN R152）
#   acceptance_ladder : 段階受入（2026-08-02 導入）。[{step, claim, met, verified_by}] の列。
#                 `verified_by` は**段ごとの**判定資産（matcher:*）。graph.yaml の
#                 `matcher -> verifies -> req` 辺は要求単位までしか表現できず、辺だけを見ると
#                 「要求全体が検証済み」に読めてしまう。段ごとの実体はここが真実源で、
#                 辺は「この要求のどこかを検証している」以上を主張しない。
#                 「達成/未達」の2値でしか書けない粒度の要求は、途中まで進んだ実装を
#                 全て "未達" に見せてしまい、正直に記帳するほど成果が消える。段で書けば
#                 要求を割りすぎずに増分が見える。met: は実装状況であって承認状態ではない。
#                 段を持つ要求は status に partial を使ってよい（全段達成で built）。
# realized_by / verified_by / related は可読性のための冗長コピー（真実源は graph.yaml）。

requirements:
  # ===== AEB 機能ファミリ（vd-func:FUNC-001 前方AEB / FUNC-002 VRU-AEB を落とす） =====
  # 詳細と出典は GT_esmini/docs/virtualdriver/design/aeb_requirements.md。数値は要校正。
  - id: REQ-AD-001
    title: 先行車がカットイン後に急制動しても追突しない（複合・本命）
    tier: safety
    agent: ADAS
    kind: positive
    statement: >-
      WHEN 隣接レーンの車両が自レーンへ割り込み（cut-in）、その後に減速して、
      快適減速では接触回避が不可能な TTC/必要減速度になったとき、VD は
      emergency_decel までの緊急制動を発生させ接触を回避（不能域では衝突速度を低減）すること。
    scenario: >-
      acc-test.xosc = Cut-in 幾何（3.5m 横移動・TTC同期）+ CCRb 減速（先行車が制動）の複合。
      Ego 120km/h、Target が t=7 でEgoレーンへカットイン→t=11 で -4m/s² 制動。
    trigger: TTC < 閾値 かつ 必要減速度 a_req > comfort_decel（要校正）
    parameters:
      ego_speed_kmh: [50, 130]            # Cut-in protocol 域（acc-test は 120）
      target_speed_kmh: [10, 70]
      target_decel_ms2: [-2, -6]          # CCRb
      cut_in_lateral_m: 3.5
    response: emergency_decel まで（例 ≤8 m/s²、要校正）。緊急制動の ≥0.8s 前に警報相当フラグ（R152）
    acceptance: >-
      閉じ速度が作動域下限（〜60km/h相当）以下は ego-target OBB 分離>0（完全回避）。
      それ以上は衝突速度を Δv 以上低減（NCAP カラーバンド相当）。
    source: "Euro NCAP Assisted Driving Cut-in + AEB C2C CCRb v4.3.1 / UN R152（複合・単一コード無し）"
    red_asset: >-
      resources/xosc/verification/07_aeb/cutin_hard_brake.xosc（parametric, road straight_500m_2lane）。
      aeb_safety_batch.yaml policies:[lead]。現状=RED実証済み（OBB分離0.00m/overlap、gt_sim_test）。
      本質はカットインの遅い検知（LeadVehicleAwareは同一レーンのみ）。avoid/mitigate最終校正はAEB実装と同時。
    realized_by: [vd-func:FUNC-001]       # 前方AEB（未実装。フェーズ1で policy を追加）
    verified_by: [matcher:min_obb_separation_above, matcher:impact_speed_below]  # impact_speed_below=衝突速度低減(緩和域, 07_aeb直進)
    related: [issue:34, proposal:P11, proposal:P12]
    status: draft

  - id: REQ-AD-010
    title: 停止先行車に追突しない（CCRs）
    tier: safety
    agent: ADAS
    kind: positive
    statement: WHEN 自レーン前方に停止車両があり接触が予測されるとき、VD は緊急制動で接触を回避すること。
    scenario: 直進で停止 GVT に接近（Euro NCAP CCRs）
    parameters: { ego_speed_kmh: [10, 50], target: stationary, overlap_pct: [-50, 50] }
    response: emergency_decel まで（要校正）
    acceptance: 作動域内は完全回避（OBB分離>0）、上限超は衝突速度低減
    source: "Euro NCAP AEB C2C CCRs v4.3.1 / UN R152 stationary"
    realized_by: [vd-func:FUNC-001]
    verified_by: [matcher:min_obb_separation_above]
    related: [proposal:P11, proposal:P12]
    status: draft

  - id: REQ-AD-011
    title: 等速/制動先行車に追突しない（CCRm/CCRb）
    tier: safety
    agent: ADAS
    kind: positive
    statement: WHEN 自レーン前方の先行車が等速走行または急制動し接触が予測されるとき、VD は緊急制動で接触を回避すること。
    scenario: 等速 GVT（CCRm）／制動 GVT（CCRb, -2/-6 m/s², 車間 12/40m）に追従接近
    parameters: { ego_speed_kmh: [30, 80], target_decel_ms2: [-2, -6], headway_m: [12, 40] }
    response: emergency_decel まで（要校正）
    acceptance: 作動域内は完全回避、上限超は衝突速度低減
    source: "Euro NCAP AEB C2C CCRm/CCRb v4.3.1"
    realized_by: [vd-func:FUNC-001]
    verified_by: [matcher:min_obb_separation_above]
    related: [proposal:P11, proposal:P12]
    status: draft

  - id: REQ-AD-012
    title: 横断する歩行者/自転車に衝突しない（VRU-AEB）
    tier: safety
    agent: ADAS
    kind: positive
    statement: WHEN 自経路を横断する歩行者/自転車があり接触が予測されるとき、VD は緊急制動で接触を回避すること。
    scenario: 近側/遠側からの横断（Euro NCAP CPNA/CPFA/CBNA）。遮蔽変種は静止遮蔽物を追加
    parameters: { ego_speed_kmh: [10, 60], ped_speed_kmh: 5, cyclist_speed_kmh: [15, 20] }
    response: emergency_decel まで。低速歩行者（3km/h）も検知
    acceptance: ≤40km/h は速度低減率で評価、>40km/h は速度低減 ≥20km/h（NCAP VRU）
    source: "Euro NCAP AEB VRU v4.4 / UN R152 pedestrian"
    realized_by: [vd-func:FUNC-002]       # VRU向けAEB（未実装）
    verified_by: [matcher:min_obb_separation_above]
    related: [proposal:P11, proposal:P12]
    status: draft

  - id: REQ-AD-013
    title: 衝突コース不在時に緊急制動を出さない（誤作動抑止）
    tier: safety
    agent: ADAS
    kind: negative
    statement: >-
      WHILE 自経路上に衝突コースの物体が存在しないとき、VD は comfort_decel を超える減速
      （emergency_decel）を発生させないこと。
    scenario: 通常追従・レーンチェンジ・隣接レーン併走など非衝突シーン（R152 Annex3 誤作動群のうちGT再現可なもの）
    response: emergency_decel の発火 0 回
    acceptance: 非衝突シナリオ群で誤発火ゼロ
    source: "UN R152 誤作動最小化（Annex3 App2 のうち ground-truth 再現可な範囲）"
    realized_by: [vd-func:FUNC-001]
    verified_by: [matcher:no_emergency_without_conflict]  # 衝突コース不在で緊急制動不発火（07_aeb負3本）
    related: [proposal:P11]
    status: draft

  - id: REQ-AD-014
    title: 快適減速で回避可能なら緊急制動を使わない（層調停）
    tier: safety
    agent: ADAS
    kind: arbitration
    statement: >-
      WHERE 快適減速（comfort_decel 以内）で余裕をもって接触回避が可能なとき、VD は
      emergency_decel を用いず快適減速を優先すること。
    scenario: 緩やかな先行車減速など、快適域で収まるケース
    response: 安全 override は a_req が comfort_decel を超える時のみ発火
    acceptance: 快適域ケースで emergency_decel 不発火かつ接触ゼロ、減速プロファイルが滑らか
    source: "設計方針（adas_axis.md 調停ヒエラルキー）"
    realized_by: [vd-func:FUNC-001]
    verified_by: [matcher:deceleration_profile_smooth]
    related: []
    status: draft

  - id: REQ-AD-015
    title: AEB作動包絡線と応答フロア（規制フロア）
    tier: safety
    agent: ADAS
    kind: regulatory
    statement: >-
      WHERE AEB が有効なとき、VD は Car-to-Car 10–60 km/h（対歩行者 20–60 km/h）で作動し、
      緊急制動開始の ≥0.8s 前に警報相当を発し、サービス制動 ≥5.0 m/s² を要求すること。
    scenario: UN R152 の作動域・警報・制動フロア
    parameters: { active_c2c_kmh: [10, 60], active_ped_kmh: [20, 60], warn_lead_s: 0.8, min_decel_ms2: 5.0 }
    response: 上記フロアを満たす
    acceptance: 作動域・警報リード・要求減速度が R152 フロア以上
    source: "UN R152 Rev.2"
    realized_by: [vd-func:FUNC-001]
    verified_by: []                       # aeb_activation_envelope matcher（要新規）
    related: []
    status: draft

  - id: REQ-AD-002
    title: 先行車定常追従で車間(THW)が規定範囲かつ加減速が滑らか
    tier: comfort
    agent: AD
    rationale: LeadVehicleAware(IDM)による快適な車間維持。ACC相当。
    realized_by: [vd-func:FUNC-013]        # ACC (policy:lead)
    verified_by: [matcher:maintained_following_distance]
    related: []
    status: draft

  - id: REQ-AD-003
    title: 赤信号で停止線手前に停止する
    tier: compliance
    agent: AD
    rationale: 信号法規の遵守（黄色は制動距離マージンで判断）。
    realized_by: [vd-func:FUNC-023]        # 信号遵守 (policy:traffic_light)
    verified_by: [matcher:stopped_at_signal]
    related: []
    status: draft

  - id: REQ-AD-004
    title: 一時停止標識で停止線手前に停止する
    tier: compliance
    agent: AD
    rationale: STOP標識の遵守（dwell+creep FSM）。
    realized_by: [vd-func:FUNC-024]        # 一時停止 (policy:stop_yield)
    verified_by: [matcher:stopped_at_stop_sign]
    related: []
    status: draft

  - id: REQ-AD-005
    title: 横断中の歩行者を優先し衝突しない
    tier: compliance
    agent: AD
    rationale: 歩行者優先（横断中は無条件回避、待ち歩行者は譲り合い層）。
    realized_by: [vd-func:FUNC-027]        # 横断歩道歩行者優先 (policy:crosswalk)
    verified_by: [matcher:min_obb_separation_above]
    related: []
    status: draft

  - id: REQ-AD-006
    title: 非優先の交差点で対向直進車に譲る
    tier: courtesy
    agent: AD
    rationale: コリドー衝突判定で優先権を評価し、非優先側は STOP_AT_S で待つ。
    realized_by: [vd-func:FUNC-038, vd-func:FUNC-029]  # 非制御交差点譲り+交差点優先権
    verified_by: []                       # 交差点譲りの専用matcherは未整備（TODO）
    related: []
    status: draft

  # ===== B1 ミッション/経路計画（strategic層。凍結例外としてID発行、2026-08-02 承認） =====
  # capability_model.md §2.1 の layer 軸が炙り出した strategic built=0 に対する最初の①主張。
  # 既存要求が全て「所与の経路上での挙動」だったのに対し、これらは経路そのものを主張する。
  #
  # **段階受入（acceptance_ladder）を使う 2 要求**。初出は 2026-08-02。
  # 動機: 当初この 2 本は「起終点だけ与えて目的地まで走り切る」の 1 本だった。
  # 「経路が分かる」と「経路どおりに走れる」は要素技術が別で、片方だけ完成しうるのに、
  # 1 文にまとめたせいで RouteLanePlan 実装（レーン帯算出＋逸脱検出）の成果を写す場所が
  # 無く、"未達" としか記帳できなかった。粗い要求は**あらゆる増分を失敗に見せる**。
  # 対策は辺に partial を足すこと（＝症状への絆創膏）ではなく、要求を割り、
  # かつ受入基準を段で書いて要求の内側で進捗が見えるようにすること。
  - id: REQ-AD-016
    title: 起点と目的地だけから走行可能な経路を導ける
    tier: '-'                             # 動機層でなくタスク達成そのもの（vd-func:FUNC-049 と同じ扱い）
    agent: AD
    kind: positive
    statement: >-
      WHEN シナリオが自車の起点と目的地のみを与えたとき、VD は起点から目的地まで
      レーン単位で連続する road/lane 列を導出し、経路として保持すること。
    scenario: >-
      未整備。junction を含む市街路で起点 arm と目的地 arm のみを指定するシナリオが要る。
      既存の verification 資産は全て Waypoint 列を明示しており該当なし。
    acceptance_ladder:
      - { step: a, claim: 与えられた Waypoint 列の隙間を埋め、レーン単位で連続する経路に解決できる, met: false, verified_by: [] }
      - { step: b, claim: 解決に失敗した場合それを検出し外へ出せる（沈黙しない）,                    met: true,  verified_by: [matcher:route_lane_plan_holds] }
      - { step: c, claim: 起点と目的地のみから経路を探索できる（Waypoint 列を要さない）,             met: false, verified_by: [] }
    acceptance: >-
      段 a/c は導出経路がレーン単位で連続すること（静的に判定でき、走行を要しない）。
      段 b は解決失敗が warning とテレメトリに出ること。定量閾値は未校正。
    realized_by: [vd-func:FUNC-049]
    verified_by: []                       # 経路連続性を静的に判定する matcher が未整備
    related: [issue:31, issue:42, req-vd-ad:REQ-AD-017]
    status: future
    note: >-
      段 b のみ 2026-08 の RouteLanePlan で達成（ルート解決失敗の可視化）。
      段 a は esmini の Route が中間 road を自動補完するため部分的に成立するが、
      レーン接続が切れている場合は失敗する（成否が道路依存＝実測で確認済み）。
      段 c が「起終点だけ与える」の本体で未着手。

  - id: REQ-AD-017
    title: 与えられた経路のとおりに、必要な車線変更込みで走り切る
    tier: '-'
    agent: AD
    kind: positive
    statement: >-
      WHILE 経路が与えられているとき、VD は経路上のレーン接続が要求する車線へ
      自発的に移り、経路から逸脱せずに終点まで到達すること。
    scenario: >-
      段 a/b/c は整備済み。resources/xosc/verification/06_route_lane/ の4本
      （route_lane_batch.yaml）が刺激。段 a/b は merge_required_for_exit_ramp と
      route_valid_off_target_lane_for_exit_ramp（是正しないことの確認）。段 c は
      lane_change_to_exit_ramp（隣接車なし・3ホップ）と
      lane_change_to_exit_ramp_with_traffic（隣接車あり・2ホップ・ギャップ待ちを強制）。
      段 d 用の「逸脱後に復帰する」シナリオは未整備。
    acceptance_ladder:
      - { step: a, claim: 経路が各 road で要求する目標レーン集合を算出できる,      met: true,  verified_by: [matcher:route_lane_plan_holds] }
      - { step: b, claim: 現在レーンが目標レーン集合から外れていることを検出できる, met: true,  verified_by: [matcher:route_lane_plan_holds] }
      - { step: c, claim: 接続点までに目標レーンへ自発的に車線変更する,             met: true,  verified_by: [matcher:route_lane_plan_holds] }
      - { step: d, claim: 逸脱した場合に経路へ復帰する,                             met: false, verified_by: [] }
      - { step: e, claim: 経路終点で安全に停車しミッション終了を宣言する,           met: false, verified_by: [] }
    acceptance: >-
      段 a/b は signal:route_lane_conformance をテレメトリで観測できること
      （matcher:route_lane_plan_holds が判定）。段 c は接続点通過時に目標レーン内で
      あること＝road 遷移時に逸脱を記録しないこと（matcher の max_deviations: 0 が判定。
      deviation_count は road が切り替わる瞬間にしか増えないので、これは「接続点を
      目標レーン帯に乗ったまま通過した」と同値）。段 d は逸脱後の on-route 復帰。
      段 e は終点許容範囲内での停車。段 d/e の定量閾値は未校正。
    realized_by: [vd-func:FUNC-050, vd-func:FUNC-052, vd-func:FUNC-054, vd-func:FUNC-055]
    verified_by: []                       # 段 a/b/c は matcher:route_lane_plan_holds が acceptance_ladder[].verified_by
                                          # で担保。要求そのものに verifies を張るのは段 d/e が未達のため overclaim
    related: [issue:31, req-vd-ad:REQ-AD-016]
    status: partial
    note: >-
      段 a/b は 2026-08 の RouteLanePlan（vd-component:route-lane-plan）で達成。
      段 c は 2026-08-02 の LaneChangeInitiation（vd-component:lane-change-initiation、
      vd-func:FUNC-055）で達成＝**目標レーンへ自分で寄せるようになった**。
      **ただし既定 OFF**（lane_change_initiation_enabled）。有効化しない限り従来どおり
      診断のみで是正せず、そのまま通過して逸脱を記録する。入れなかったときに通過して
      逸脱を記録する振る舞い自体は有効時も維持（2026-08-02 の設計決定。復帰は段 d）。
      issue #31 は本要求の段 c 不在が生んだ症状 — VD が車線を自分で寄せられないため、
      レーン接続の辻褄を人間が Waypoint で手当てする必要があり、その記述漏れが表面化した。
      段 c 達成により、その手当ての必要性は（機能を有効化すれば）原理的に解消する。
  - id: REQ-AD-018
    title: 進路変更の前から方向指示器で予告する
    tier: compliance
    agent: AD
    kind: positive
    statement: >-
      WHILE 自発的な進路変更（車線変更）を行うとき、VD は変更を開始する前から
      方向指示器で予告を始め、マニューバが完了するまで継続すること。
    scenario: >-
      resources/xosc/verification/06_route_lane/ の後半2本（route_lane_batch.yaml、
      policies: [lane_change_initiation]）が刺激。lane_change_to_exit_ramp は
      ギャップ待ちの無い純粋な先行点灯を、lane_change_to_exit_ramp_with_traffic は
      「合図してから待つ」挙動を刺激する。FUNC-056..059 由来の進路変更
      （追い越し・交差点・発進・合流）を刺激する資産は未整備。
    acceptance_ladder:
      - { step: a, claim: 車線変更の発起より前に方向指示器が点灯する,                     met: true,  verified_by: [matcher:indicator_leads_lane_change] }
      - { step: b, claim: 定速走行時に法定のリード（進路変更の3秒前）を満たす,             met: false, verified_by: [] }
      - { step: c, claim: 加速中もリードが縮まない,                                       met: false, verified_by: [] }
      - { step: d, claim: 経路要求以外の発起（追い越し/交差点/発進/合流）にも同期する,      met: false, verified_by: [] }
    acceptance: >-
      段 a は signal:lane_change_signal_timing をテレメトリで観測できること
      （matcher:indicator_leads_lane_change が判定。signal_active の立ち上がりが armed の
      立ち上がりに先行し、その区間ランプが実際に点いていて、点灯側が hop の方向と一致）。
      **段 a は「先行する」までしか主張しない — 秒数は主張しない。**
      段 b/c の閾値は法定値 3.0 s（道路交通法 第53条第1項／同施行令 第21条第1項）。
      段 b は定速区間での実測が要る（現行の刺激2本はどちらも加速中またはギャップ待ちで、
      定速リードを分離できていない＝段 b 用の資産が未整備）。
      段 d は FUNC-056..059 の実装待ち。
    realized_by: [vd-func:FUNC-061]
    verified_by: []                       # 段 a のみ matcher が担保。要求そのものに verifies を
                                          # 張るのは段 b/c/d が未達のため overclaim
    related: [req-vd-ad:REQ-AD-017, vd-func:FUNC-055]
    status: partial
    note: >-
      2026-08-02 に段 a 達成（lane_change_initiation.md §11、DetectManeuverDir を4段へ拡張し
      lc_signal_dir_ で先行合図を出す）。**既定 OFF**（lane_change_initiation_enabled）。
      実測（同日、実 Release ビルド）: 隣接車なし t_sig=2.30 / t_arm=2.70 = リード 0.40 s、
      ギャップ待ちあり t_sig=3.10 / t_arm=7.55 = リード 4.45 s。
      **段 b/c が未達な理由は同一で、決断距離 required_m が速度比例だから**である。定速なら
      required_m が動かずリードは lane_change_indicator_lead_time_s（既定 3.0）ちょうどに
      なるが、加速中は required_m が n_remaining×lead_time_s×a（実測 ~70 m/s）で膨張し、
      自車の閉じ込み速度（~8 m/s）を大きく上回るため v×3.0 のリード距離が 0.4 秒で消える。
      根治にはしきい値自身の移動速度を閉じ込み速度に含める必要がある（同 §11-3）。
      なお最終バンド（dist_to_connection == -1）では ShouldAttemptLaneChangeHop が true・
      ShouldSignalLaneChangeHop が false となり先行しない（同 §11-3 の「既知の非対称性」）。
      これも段 c の一部として残る。
      ウィーン条約（1968）は秒数を規定せず「マニューバ中継続・完了で消灯」のみ、独 StVO §5 は
      定性規定、米国は多くの州が距離規定 — 次元が国ごとに違うため国別テーブルは作らず、
      秒パラメータ1本を config で可変にして既定を日本の法定値に置く方針（同 §11-2）。

  # ===== 駐車機能（凍結例外としてID発行、2026-08-03 承認） =====
  # scene:SCN-014（駐停車・後退ファミリ、coverage: none）の第2段要求導出。
  # OpenDRIVE <object type="parkingSpace"> は GT_RoadManager でパース済み・OSI GroundTruth
  # 出力済みだが、VD側に消費経路が無い＝①主張が無い状態だった。REQ-AD-016/017 と同じ理由で
  # 「枠を選ぶ」と「枠へ入る」を1本の要求にまとめない — 要素技術が別（探索・選定は認識/判断、
  # マヌーバ実行は軌道生成/制御）で片方だけ完成しうるため、最初から2本に割って
  # acceptance_ladder で段階受入にする。
  - id: REQ-AD-019
    title: 駐車枠の探索・選定
    tier: '-'                             # 動機層でなくタスク達成そのもの（REQ-AD-016/017 と同じ扱い）
    agent: AD
    kind: positive
    statement: >-
      WHEN 自車が駐車を計画しているとき、VD は自車 route 近傍の parkingSpace
      オブジェクトを列挙し、他車両の占有状況と access 属性を考慮して駐車候補枠を
      選定し、選定後に枠が占有された場合は再選定すること。
    scenario: >-
      未整備。scene:SCN-014 の駐車場走行シーンで、複数の parkingSpace（一部占有・
      一部 access=handicapped 等）を含む道路資産が要る。既存の検証資産は駐車場
      デモ相当のものはあるが VD 挙動主張を発火させる構成でない（上流デモ/適合
      フィクスチャに留まる）。
    acceptance_ladder:
      - { step: a, claim: 自車route近傍の parkingSpace オブジェクトを列挙し、駐車候補枠として認識できる,               met: false, verified_by: [] }
      - { step: b, claim: 他車両が占有する枠を除外し空き枠を選定できる（枠ポリゴンと他エンティティOBBの交差判定）,     met: false, verified_by: [] }
      - { step: c, claim: access属性（handicapped等）を尊重した選定ができる,                                          met: false, verified_by: [] }
      - { step: d, claim: 選定枠が接近中に占有された場合、再探索できる,                                               met: false, verified_by: [] }
    acceptance: >-
      段ごとの受入基準は acceptance_ladder のとおり。定量閾値（探索半径・再探索の
      トリガ距離等）は未校正。
    realized_by: [vd-func:FUNC-076]
    verified_by: []
    related: [req-vd-ad:REQ-AD-020]
    status: future
    note: >-
      OpenDRIVE の parkingSpace オブジェクトは面1（GT_RoadManager）で既にパース・OSI
      GroundTruth 出力されており、本要求は VD 側（面2）の消費経路が無いことに対する
      ①主張。実装（vd-func:FUNC-076）・検証資産とも未着手。

  - id: REQ-AD-020
    title: 駐車マヌーバの実行（前進・後退）
    tier: '-'
    agent: AD
    kind: positive
    statement: >-
      WHEN 自車が選定済みの直角駐車枠へ進入するとき、VD は前進駐車または
      バック駐車のマヌーバを実行し、枠内に許容範囲内の姿勢で停止すること。
