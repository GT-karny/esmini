      - { step: e, claim: 走行中にハンコン等の操作（ボタン）で設定速度を増減でき、変更が即座に追従目標へ反映される,  met: false, verified_by: [] }
      - { step: f, claim: 利用可能速度域（作動下限/上限）が設定可能で、域外では ACTIVE にならず STANDBY へ遷移する（域内復帰で resume 可）, met: false, verified_by: [] }
      - { step: g, claim: 制限速度制御（設定速度を道路の制限速度でキャップ）の有無が設定可能で、有効時は制限速度超の設定が実効値でキャップされる, met: false, verified_by: [] }
      - { step: h, claim: 車間距離設定（段階式 THW）が走行中にハンコン等の操作で変更でき、変更が追従車間へ反映される, met: false, verified_by: [] }
    acceptance: >-
      段 a は VD 版 REQ-AD-002 の THW レンジ判定を流用（自車状態は OSI scene の is_host から
      読む＝面1化済みの経路）。段 b は操作イベントと状態遷移・ペダル実効値の時系列判定。
      段 c/d の状態は HVD vehicle_automated_driving_function の State 3値規律
      （ACTIVE/STANDBY/UNAVAILABLE）に従う。段 e/g/h は設定値と実効値を
