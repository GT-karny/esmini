# 常設検証ゲートカタログ（gate:<name> の単一真実源）
#
# 検証スパイン⑥常設（capability_model.md §1 / §4）。「一度検証したきり」と
# 「回帰で恒久的に守られている」を区別するためのノード。
#
# 実行系（root CLAUDE.md §5 ／ scripts/ ／ .github/workflows/ci.yml）が実体で、
# 本ファイルはその索引。実行系を変えたらここも直す。
#
# フィールド:
#   id        gate:<id> のローカルID（kebab-case、ハイフンを1つ以上含む）
#   title     日本語の短い説明
#   command   実際の起動コマンド（実行系の正準形）
#   context   local / ci:<job名> / both
#   blocking  true=落ちたら止まる / false=warning（報告のみ・止めない）
#   requires  前提（Release build / venv / thirdparty zip 等）
#   covers    **実際に**何を検証しているか
#   not_covers  名前から期待されるが検証していないもの（あれば必須）
#   note      運用上の注意
#
# **covers を名前から推測して書かないこと**。`gate:unit-ctest` の ctest 標的
# `test_ScenarioReaderParsing` は名前に反し GT_ScenarioReader の現行パース対象を
# 検証していない（2026-07-20 訂正）。グラフは lint と派生レポートの根拠になるため、
# 誤った covers は自動化され増幅される。名前が主張を偽装している場合は
# `not_covers` に明記する。
#
# 要求 / matcher との接続（req|matcher -> sustained-by -> gate）は graph.yaml に
# curated辺として置く（関係の単一置き場。本ファイルには重複記載しない）。

meta:
  derived_from: CLAUDE.md  # §5 テスト戦略 ＋ scripts/ ＋ .github/workflows/ci.yml
  seeded: 2026-07-20

gates:
  # ---- ユニット ----
  - id: unit-ctest
    title: GTユニットゲート（ctest 傘バイナリ）
    command: scripts/run_gt_tests.ps1  # → ctest -R "test_ScenarioReaderParsing" -C Release
    context: both  # local ＋ ci.yml `test` job（ubuntu/macos/windows × Debug/Release）
    blocking: true
    requires: [release-build]
    covers: >-
      ctest標的 `test_ScenarioReaderParsing` は**28本のユニットソースを束ねた傘バイナリ**
      （GT_esmini/test/CMakeLists.txt:8-35、TEST/TEST_F 計278件、2026-07-20実測）。
      内訳の柱: ODR道路層13ファイル（fork patches / virtual junction / signal semantics /
      LHT road transitions 等）／VirtualDriver 6ファイル（traffic policies 61件・
      PID pure-pursuit・auto indicator・telemetry JSON・PolicyDetail・AdasFunctionReport）／
      RealDriver utils・LonProfilePlanner／ConfigLoader・SimpleJson・HeadlightLogic。
    not_covers: >-
      **`GT_ScenarioReader` の現行パース対象（TrafficSignalController系）は非カバー**。
      GT_esmini/test 配下を `TrafficSignalController|GT_ScenarioReader` で grep して0件
      （2026-07-20実測）。標的名の由来は `unit/test_ScenarioReaderParsing.cpp` が28本中
      唯一 `int main()` を持つこと。当の.cpp の中身は R5-U3 以降 VehicleLightBridge /
      ScenarioLightRegistry の残置テスト13件で、名前の示すパース検証ではない。
      ManualDrive / Kinematic / RouteDrive / pitch-roll に言及するテストも0件
      （capability_model.md §2.3 ⑥実測）。
    note: >-
      **名前が主張を偽装しているゲート**。covers を標的名から推測すると
      「OSC拡張パースはCI常設で厚い」という誤結論になる（実際の検出手段は
      E2E の gate:vd-behavior-regression のみ）。root CLAUDE.md §5 の「25 unit sources」も
      実測28で陳腐化している（本カタログの数字が実測）。

  - id: integration-ctest
    title: GT_Loader 統合テスト26本（opt-in・既定ゲート外）
    command: scripts/run_gt_tests.ps1 -IncludeIntegration
    context: local
    blocking: false  # opt-in。regression-gate Step 1 は -IncludeIntegration 無しで呼ぶ
    requires: [release-build]
    covers: >-
      `GT_esmini_Integration_*` 26本 = AutoLight/LightStateAction 6（うち縮退負2）＋
      F6環境ヘッドライト5（夜間/トンネル/自動ハイビーム）＋ControllerRealDriver 15。
      per-test アサーション（init rc==0・エンティティ存在・完走・灯火状態変化/移動）。
    not_covers: 実行時間の都合で既定ゲート外＝**回帰で自動的には守られていない**。
    note: 凍結 pythondriver_* 17本は GT_ENABLE_EMBEDDED_PYTHON=ON でのみ登録され、どの緑ゲートにも属さない。

  # ---- 統合ラダー ----
  - id: regression-gate
    title: マージ前回帰ラダー（Step 1 → 1.5 → 2）
    command: scripts/run_regression_gate.ps1
    context: local  # CI は同じ中身を個別 job に分解して実行（この ps1 自体は CI 非経由）
    blocking: true  # Step 1 / Step 1.5 がハード。Step 2 は既定 WARN
    requires: [release-build, venv]
    covers: >-
      Step 1 = gate:unit-ctest（ハード）／Step 1.5 = gate:odr-conformance-quick（ハード、
      -SkipOdr で除外可）／Step 2 = gate:vd-behavior-regression（既定 WARN、-FailOnBehavioral で
      ハード化）／Step 2.5 = gate:telemetry-golden（-TelemetryGolden 指定時のみ）。
    note: 傘ゲート。実質の検証内容は各サブゲートのノードを見ること。

  - id: vd-behavior-regression
    title: VirtualDriver 挙動回帰（car_following_traffic_control バッチ vs committed baseline）
    command: >-
      gt_sim_test.py batch resources/xosc/verification/car_following_traffic_control_batch.yaml →
      scripts/check_regression_baseline.py --baseline GT_esmini/test/regression_baseline/car_following_traffic_control_expected.yaml
    context: both  # local（regression-gate Step 2）＋ ci.yml Windows job（非ブロッキング）
    blocking: false
    requires: [release-build, venv]  # GT_esminiLib.dll を in-process ロード（ctypes）
    covers: >-
      12シナリオ × matcher の **per-scenario / per-matcher 判定を committed baseline と照合**
      （バッチ自身の粗い overall=fail は意図的にゲートではない）。OSC拡張パース
      （TrafficSignalController系）の**唯一の検出手段**でもある — matcher:stopped_at_signal 経由。
    not_covers: >-
      `check_regression_baseline.py` 自体は観測量を持たず `verdict.json` の event/status/detail を
      読むだけ（:75-119）＝**判定根拠は完全に上流に従属**。baseline も matcher名＋status を
      凍結するのみで、面3→面2 直結（14 matcher中10）の実態を追認する構造（§2.3a）。
    note: 既定 WARN。逸脱でマージが止まるのは -FailOnBehavioral 指定時のみ。

  - id: aeb-safety-regression
    title: AEB安全層 挙動回帰（aeb_safety バッチ vs committed baseline）
    command: >-
      gt_sim_test.py batch resources/xosc/verification/aeb_safety_batch.yaml →
      scripts/check_regression_baseline.py --baseline GT_esmini/test/regression_baseline/aeb_safety_expected.yaml
    context: both  # local（regression-gate Step 2.6）＋ ci.yml vd-behavioral-regression job（非ブロッキング）
    blocking: false  # 既定 WARN。ローカルは -FailOnBehavioral でハード化／CI は continue-on-error
    requires: [release-build, venv]  # GT_esminiLib.dll を in-process ロード。osi:true 必須
    covers: >-
      AEB(vd-func:FUNC-001)の主張を**両方向**で判定。正例 REQ-AD-001 2件＝
      cutin_hard_brake（`impact_speed_below` 10 m/s＝緩和。完全回避は ~1.38g を要し
      モデル車の 10 m/s² 天井を超えるため不可）／cutin_hard_brake_curve
      （`min_obb_separation_above` 0.5 m＝完全回避）。負例 REQ-AD-013 3件＝
      normal_following・benign_cutin・parallel_overtake で `no_emergency_without_conflict`
      （policy.constraints に source:"aeb" が一度も現れない）。負例3件は AebSafety の
      **別々の段**で弾かれる設計（ゲート非発火／検知は正当だがゲートが弾く／候補採用の入口で弾く）。
      2026-07-21 時点 5/5 緑＝**known-red を持たないベースライン**。
    not_covers: >-
      幾何軸は直進/カーブのみで**交差点内 AEB は未カバー**（conflict 系と重複するため保留）。
      `impact_speed_below`/`min_obb_separation_above` は OSI scene 依存で、
      `osi:true` が無いと matcher が **skip＝黙って緑になる**（マニフェストで担保している）。
    note: >-
      **本ゲート新設(2026-07-21)以前、AEB を判定する matcher は常設ゲートに1件も無かった**
      （実装済み・ユニット緑・OSI配線済みなのに壊しても CI が気づかない＝capability_model.md §5.1 の
      「縦串の切れた列」の最重要例）。Step 2 に合流させず独立ゲートにしたのは
      (1)赤が出た時「どの主張が壊れたか」がレポートを開かずに分かる
      (2)Step 2 の baseline が抱える known-red（red_stop_green_go）が AEB の退行を覆い隠さない、の2点。
      正負を同一 baseline に置いたのは、片方だけを守ると「閾値を下げて正例を通し負例を壊す」
      取引がゲートを素通りするため。既定 WARN で開始し、数回グリーンを確認してから hard へ昇格する方針
      （ユーザー判断 2026-07-21）。
      **CI 配線（2026-07-21・ユーザー判断）**: 独立 job ではなく既存の `vd-behavioral-regression`
      job に相乗りさせた。同 job は GT_esminiLib の Release ビルドを丸ごと行っており（externals は
      キャッシュされるがビルド成果物は非キャッシュ）、独立 job にすると**その重いビルドが二重化**する。
      赤の切り分けはステップ名と artifact を分けること（`aeb-safety-regression-report`）で担保＝
      ローカルで Step 2 に合流させず独立ゲートにしたのと同じ目的を、CI では job 分割なしで満たす。
      CI も non-blocking（`continue-on-error`）で開始したのはローカル方針との一貫性に加え、
      GT_esminiLib.dll の in-process ロードと `osi:true` 依存が CI 環境で想定通り動くかが未確認で、
      初回から hard にすると赤が「AEB 退行」か「CI 環境差」か弁別できなくなるため。
      **昇格手順**: compare ステップの `continue-on-error` を外す（ローカル側は既定を
      -FailOnBehavioral 相当へ）。

  - id: anticipation-driving-regression
    title: 先読み運転 挙動回帰（anticipation_driving バッチ vs committed baseline）
    command: >-
      gt_sim_test.py batch resources/xosc/verification/anticipation_driving_batch.yaml →
      scripts/check_regression_baseline.py --baseline GT_esmini/test/regression_baseline/anticipation_driving_expected.yaml
    context: both  # local（regression-gate Step 2.7）＋ ci.yml vd-behavioral-regression job（非ブロッキング）
    blocking: false  # 既定 WARN。ローカルは -FailOnBehavioral でハード化／CI は continue-on-error
    requires: [release-build, venv]  # GT_esminiLib.dll を in-process ロード。osi:true 必須（a=osi パス）
    covers: >-
      中長期の先読み運転 matcher を5シナリオ（decelerate_for_curve / decelerate_for_left_turn /
      cross_straight_junction / speed_limit_change / traffic_lights_junction）で常設判定。
      deceleration_profile_smooth（滑らかな減速＝bounded decel/jerk、**a=osi の面1直読加速度**で判定）／
      speed_reduction_before_landmark（ランドマーク手前で目標速度到達）／lane_keep（操舵飽和由来の
      レーン逸脱なし）／steer_not_saturated（コーナーで操舵が飽和しない）／no_constraint_kind
      （直進通過の接続路で junction 制約を上げない）。2026-07-21 時点 5/5 緑＝**known-red を持たない
      ベースライン**（D=ego-anchor-face1 移行後の実装で採取）。
    not_covers: >-
      **lane_change_count は未カバー**：本バッチのどのシナリオも車線変更を行わないため、
      6件の sustained-by 欠のうち5件のみ閉じ、lane_change_count は依然どの常設ゲートにも乗らない
      （閉じるには車線変更シナリオの追加が要る）。速度系（speed_above/below・min_speed_above）も
      本バッチで発火するが常設保証は gate:vd-behavior-regression 側で済み＝二重結線しない。
      geometry は curve/turn/junction のみ。
    note: >-
      §5.1 が検出した「05_anticipation 系 matcher が手動実行のみ＝退行が master へ素通り」を塞ぐ
      （AEB 常設化 gate:aeb-safety-regression と同型）。run_regression_gate.ps1 Step 2.7 として配線、
      CI は vd-behavioral-regression job に相乗り（Release ビルド二重化回避）＋別 artifact
      （anticipation-driving-regression-report）で赤の切り分けを担保。osi:true で自車アンカーが面1
      （deceleration_profile_smooth a=osi）になった実装でベースラインを採ったのが、E を D の後に置いた理由。
      **昇格手順**: CI で数回ベースライン安定を確認後、compare ステップの continue-on-error を外す
      （ローカルは既定を -FailOnBehavioral 相当へ）。

  # ---- ODR 適合（面1を測る系＝§0.3 の「手本」） ----
  - id: manualdrive-adas-regression
    title: 手動運転中ADAS 挙動回帰（manualdrive_adas バッチ vs committed baseline）
    command: >-
      gt_sim_test.py batch resources/xosc/verification/manualdrive_adas_batch.yaml →
      scripts/check_regression_baseline.py --baseline GT_esmini/test/regression_baseline/manualdrive_adas_expected.yaml
    context: both  # local（regression-gate Step 2.10）＋ ci.yml vd-behavioral-regression job（非ブロッキング）
    blocking: false  # 既定 WARN。ローカルは -FailOnBehavioral でハード化／CI は continue-on-error
    requires: [release-build, venv]  # GT_esminiLib.dll を in-process ロード。osi:true＋HVD直読が必須
    covers: >-
      **人間が運転している最中に並行稼働する ADAS**を 30 シナリオ・82 matcher で常設判定
      （2026-08-06 時点 30/30・**known-red を持たないベースライン**）。列は
      REQ-AD-025（AEB＋FCW、vd-func:FUNC-075）／REQ-AD-026（ACC、FUNC-079）／
      REQ-AD-027（LKA＋LDW、FUNC-080）／REQ-AD-030（MSL、FUNC-081）／
      REQ-AD-031 段a/b（Stop&Go）／REQ-AD-028（面3観測性＝State 3値規律と
      DriverOverride の accel/brake/steering 3経路）。
      正負が同一マニフェスト・同一ベースラインに同居し、さらに**同一 xosc を2構成で回す
      `variant` 対**（adas_off／左右／warning_only／速度域の域内外／制限速度キャップ有無）が
      「切ってあった」と「見張っていて撃たなかった」の区別そのものを判定している。
      本ゲート以前、**ManualDrive 文脈の ADAS を判定する matcher は常設ゲートに1件も無かった**
      （C++ ユニットは gate:unit-ctest で常設だが、それは部品の単体であって
      ManualDriveCoordinator 経由の統合挙動ではない）。
    not_covers: >-
      **G29 実機限定の観点は原理的に入らない**（検証計画 §6 の区分）: LKA 補正が実ハンドルの
      反力として手に届くか（REQ-AD-027 段d）、AEB 介入中の触感、実ホイールのコラムジッタに
      対する人間操舵優先の誤発火（field-test/realmachine_open_items.md R-5〜R-8）。
      合成入力（ScriptedInputSource）はノイズがゼロなので、**ジッタ由来の誤発火は
      このゲートが緑のまま実機で機能が死ぬ**形になりうる — 名前が「手動運転中ADAS」で
      あることが実機での動作を含意しない、という意味でここは特に注意が要る。
      REQ-AD-029（HMI 提示）も入らない: 描画はフロントの領分で、供給側（HVD への emit と
      その web バックエンド射影）だけが自動判定の対象（射影のテストは pytest
      GT_esmini/web/backend/tests/test_osi_stream_adas_functions.py が担い、本ゲートの外）。
      REQ-AD-031 段c/d（時限・自動再発進）は実装スコープ外。
    note: >-
      **本ゲートの新設(2026-08-06)は gate:aeb-safety-regression の前例をそのままなぞっている**
      — Step 2 に合流させず独立ゲートにしたのは (1)赤が出た時「どの主張が壊れたか」が
      レポートを開かずに分かる (2)Step 2 の baseline が抱える known-red が退行を覆い隠さない、の2点。
      正負を同一 baseline に置いたのは、片方だけを守ると「閾値を下げて正例を通し負例を壊す」
      取引がゲートを素通りするため。
      **ベースライン凍結の前提を先に測った**: 同一ビルドで3回連続実行し、30/30・error=0・
      access violation なし、かつ決定フィールド（調停後の実効ペダル/操舵＋機能別 State＋
      DriverOverride＋custom_state）が 20,400 フレーム全てで完全一致することを確認してから
      凍結した（GT_esmini/docs/virtualdriver/measurements/manualdrive_adas_determinism_2026-08-06.md。
      比較器自体は 1e-6 の単一フィールド差で発火することを負の対照で実証済み）。
      断続的なネイティブクラッシュ（既知欠陥 measurements/gt_sim_test_intermittent_crash_2026-08-05.md）
      が混ざった凍結は、以後の赤が退行か揺れか永久に弁別できなくなるため。
      **赤を読む順序**: `error` が 1 以上なら **deviations より先に access violation を疑う**
      — 測定されていないシナリオについて deviations は何も言っていない。
      **本バッチの全機能は既定 OFF** で、バッチが注入 config で個別に有効化する。
      したがってここが赤い＝ManualDrive ADAS スタックが変わった、であって既定挙動が
      変わったではない。
      **CI 配線（2026-08-06）**: 独立 job ではなく既存の `vd-behavioral-regression` job に
      相乗り（AEB 前例と同じ＝Release ビルドの二重化回避）。赤の切り分けはステップ名と
      artifact 分離（`manualdrive-adas-regression-report`）で担保。
      **CI 上での初回実走はまだ観測していない**（同 job は PR / dev_v* / master /
      手動 dispatch でしか起動しない）。非ブロッキングで開始したのはこれが理由で、
      本バッチは ManualDriveController 配下で OSI scene ＋ in-process HVD からフレームを
      取る唯一のバッチであり、その経路が CI ランナーで同じに振る舞うかが未確認である。
      初回から hard にすると赤が「退行」か「CI 環境差」か弁別できなくなる。
      **昇格手順**: compare ステップの `continue-on-error` を外す（ローカル側は既定を
      -FailOnBehavioral 相当へ）。

  - id: odr-conformance-quick
    title: ODR適合 quick プロファイル（schema + rm + motion）
    command: scripts/run_odr_conformance.py --profile quick
    context: local  # regression-gate Step 1.5
    blocking: true
    requires: [release-build, venv]  # esminiRMLib.dll。ASAM公式fixtureは zip 非同梱時 auto-SKIP
    covers: >-
      schema層＝XSD検証／rm層＝esminiRMLib RM_Init プローブ vs golden／
      motion層＝RM_PositionMoveForward walk vs golden。
    not_covers: >-
      **golden は回帰(change-detection)であって真偽ではない**（§1.1）。資産とエンジンが
      揃って誤っている場合を検出できない。LHT正しさ・lane-id符号・road間 reciprocity の
      意味論オラクルは不在（Annex F 275ルール中 gap 259）。
    note: OSI層は含まない（gate:odr-conformance-full 参照）。

  - id: odr-conformance-schema-ci
    title: ODR適合 schema層のみ（CI）
    command: scripts/run_odr_conformance.py --layers schema --check-matrix
    context: "ci:test-no-external-modules"  # ubuntu-22.04 / Release のみ
    blocking: true
    requires: [venv]  # DLL不要（意図的に CI-friendly）
    covers: XSDスキーマ層＋マトリクス被覆チェック。
    not_covers: RM/OSI golden 層はクロスOSの浮動小数リスクのため CI 非実行＝**ローカル限定**。
    note: >-
      この起動でも下記 fork-census / fork-drift / resync-guards は走る
      （run_odr_conformance.py:1556-1558 はプロファイル分岐より前で無条件）。

  - id: odr-conformance-full
    title: ODR適合 full プロファイル（+ OSI層）
    command: scripts/run_odr_conformance.py --profile full --smoke
    context: local
    blocking: false  # 手動実行のみ
    requires: [release-build, venv]
    covers: quick の3層＋OSI層（GT_esminiLib SE_GetOSIGroundTruth 実デコード vs golden）。
    not_covers: >-
      **どの常設ゲートにも配線されていない**。capability_model.md §2.3 D9 が
      OSI層を (b)（実装済みだが未配線）と採点している当の対象。
    note: パーサ変更後に手動で回す運用。⑥常設の穴として graph に残す価値がある。

  - id: fork-census
    title: フォーク会計（AUTHORITATIVE outbound census）
    command: scripts/check_core_census.py  # run_odr_conformance.py が全プロファイルで内包
    context: both
    blocking: true  # census["ok"] が false なら exit_bad++（run_odr_conformance.py:1622-1626）
    requires: [venv]
    covers: >-
      マニフェスト（gt_roadmanager_patches.md）に対する fork/2nd-class 逸脱の
      **マーカーid単位の帰属**。selftest 同梱。
    not_covers: >-
      **フォーク予算の会計であって正しさ検査ではない**（§1.1）。repo唯一のLHTツールだが
      LHT挙動の正誤は一切見ない。
    note: 独立スクリプトだが実運用の起動点は run_odr_conformance.py の内包経路（CI schema-only 起動でも走る）。

  - id: fork-drift
    title: フォーク粗ドリフト検査（legacy outbound）
    command: scripts/check_fork_drift.py  # 同上、run_odr_conformance.py が内包
    context: both
    blocking: true
    requires: [venv]
    covers: GT_RoadManager.cpp vs pristine の純テキスト差分行数（近傍帰属）。
    not_covers: ミラーされた vj ハンクはファイル差分に現れない（P6 S2）＝census が権威。
    note: 15行射程の帰属罠あり（memory lht_road_transition_fixes）。

  - id: resync-guards
    title: resync 二重処理ガード検査
    command: scripts/check_resync_guards.py  # 同上、run_odr_conformance.py が内包
    context: both
    blocking: true
    requires: [venv]
    covers: upstream resync 時の二重処理ガード（静的検査）。
    note: 挙動側（重複RMObject id 等）は ctest 側 test_OdrResyncGuards が担当。

  - id: fork-sync
    title: フォーク同期（INBOUND・上流未取込コミットの列挙）
    command: scripts/check_fork_sync.py --fetch
    context: "ci:test"  # Linux / Release のみ
    blocking: false
    requires: [venv, git-full-history]  # fetch-depth: 0。--fetch で upstream を FETCH_HEAD へ
    covers: >-
      3系譜（gt_roadmanager / gt_osireporter / roadgen）の upstream コミットのうち
      GT_esmini に未 port のものを列挙。
    not_covers: 取り込みの要否・正しさは判断しない（列挙のみ）。
    note: >-
      **WARNING-ONLY を二重に担保**: `--strict` 非指定でスクリプト自身が exit 0
      （check_fork_sync.py:250-253）＋ ci.yml:227 の continue-on-error。
      未取込コミットが CI を止めてはならない、という設計判断。

  # ---- グラフ自身 ----
  - id: kg-lint
    title: 知識グラフ構造lint（本グラフの自己検証）
    command: scripts/check_knowledge_graph.py
    context: both  # ci.yml `test` job（Linux/Release）＋ run_gt_tests.ps1 Step 0
    blocking: true
    requires: [venv]
    covers: >-
      namespace slug一意/ id_pattern コンパイル/ active な source_of_truth の実在／
      辺端点の `<slug>:<local>` 形式・登録済み curated型・pattern fullmatch／
      openx参照の語彙収載／重複辺／**graph_view.md の陳腐化（ハッシュ照合）**。
    not_covers: >-
      **ノードファイルの中身は一切検証しない**（signal_catalog.yaml / gate_catalog.yaml /
      scene_catalog 等は開かれない）。exposure/state/covers の値域も未検査＝
      **本カタログの正しさは人間の規律に依存**。face: タグも現状は inert
      （coupling-audit はフェーズ3で実装）。
    note: ローカルは venv 不在時 WARN スキップ。CI はハードゲート。

  # ---- 資産カタログ ----
  - id: catalog-validate
    title: 生成シナリオ/道路カタログ検証（F1）
    command: resources/scenario_authoring/validate_catalog.py
    context: local
    blocking: false  # CI 非配線（workflows に出現せず・2026-07-20 grep 実測）
    requires: [release-build, venv]
    covers: esmini headless EXIT==0 の道路プローブ＋gt_sim_test in-process 実行（VDテレメトリ frames>0）。
    not_covers: >-
      frames>0 は §1.1 の言う「意図適合の**弱い代理**」＝走ったことしか言わない。
    note: 常設ではなく手動。

  - id: telemetry-golden
    title: テレメトリ golden 差分（opt-in）
    command: scripts/run_regression_gate.ps1 -TelemetryGolden  # → telemetry_golden.py diff
    context: local
    blocking: false  # 既定オフ。指定時のみ Step 2.5 としてハード
    requires: [release-build, venv]
    covers: テレメトリ列の golden 差分。
    not_covers: 既定で走らない＝常設ではない。
    note: 回帰オラクルであり真偽オラクルではない（§1.1 と同じ限界）。
