    version: "1.4.0"
    category: "road.lane_section"
    status: implemented_gt
    status_reason: "Direct presence check (root.iter for at least one laneSection anywhere under the road); synthetic positive fixture fires correctly, 0 flags on corpus (all corpus roads that parse have at least one laneSection)."
    checker: "GT_esmini/docs/knowledge/opendrive_gap_checkers/check_road_lane_layer_link_section.py::run_checks"
