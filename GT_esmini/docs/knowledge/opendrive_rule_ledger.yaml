    status: implemented_gt
    status_reason: "Category/supplementary tag sets verified 1:1 against spec Table 135 and the t_signals_semantics XSD complexType (9 category + 6 supplementary elements, exact match). BUG FOUND AND FIXED during this audit: original code only scanned <signal> elements via r.iter(\"signal\"), missing that <semantics> is declared on the shared abstract base type also extended by <sign> (board sub-signs under <staticBoard>/<vmsBoard>) -- spec Table 135 explicitly frames the rule as '<signal> or <sign>'. Fixed by also iterating r.iter(\"sign\"); verified no XSD tag collision, re-ran full corpus (still 0 exceptions/0 flags, no committed fixture exercises this path) and confirmed the fix fires on a new scratchpad-only synthetic <sign>+supplementary-only fixture, while the original <signal>-scoped synthetic fixture still fires unchanged."
    checker: "GT_esmini/docs/knowledge/opendrive_gap_checkers/check_road_signal_ref_validity.py::run_checks"
    description: "Signal semantics shall not be specified for signs if no category for the desired traffic behavior exists."
  - uid: "asam.net:xodr:1.7.0:road.signal.validity.left_hand_traffic_lane_ids"
