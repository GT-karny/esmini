    category: "road.lane_section"
    status: implemented_gt
    status_reason: "FIXED during verification: original code checked ALL lane types, causing a false-positive storm on official fixtures (4/5 flags were type=\"border\" lanes legitimately at 0 width for a long stretch, e.g. UC_Motorway-Exit-Entry). Added a driving-relevant @type allowlist matching esmini RoadManager's own LANE_TYPE_ANY_DRIVING set (driving/entry/exit/offRamp/onRamp/connectingRamp/bidirectional) so structural/decorative lane types (border, shoulder, curb, sidewalk, median, etc.) are correctly excluded. Re-verified: official-set flags for this rule dropped from 4 to 0; the one remaining corpus flag (GT-authored resources/xodr/tunnels.xodr, an entire-road 0-width type=driving lane) is a genuine finding. Synthetic positive (driving) and negative (border) fixtures both behave as expected post-fix."
