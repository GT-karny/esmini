  - uid: "asam.net:xodr:1.9.0:road.lane.layer.lane_group_width_temporary"
    rule_name: "road.lane.layer.lane_group_width_temporary"
    version: "1.9.0"
    category: "road.lane.layer"
    status: implemented_gt
    status_reason: "Sums left/right lane-group widths + laneOffset per side (verified 11.3 'lane group' = <left>/<right>, not left+right combined) at each temporary laneSection start vs the covering permanent section; independently re-derived the arithmetic by hand for the one official finding (Ex_Lane_MultiLaneLayer.xodr road 1: temp 16.300 > perm 15.500, confirmed correct, not a bug) -- 2 genuine locations in 1/36 official files, near-zero per contract bar."
    checker: "GT_esmini/docs/knowledge/opendrive_gap_checkers/check_road_lane_layer_link_section.py::run_checks"
    description: "For each lane group, the sum of all lane widths and lane offsets on the temporary lane layer shall not be greater than the sum of lane widths and lane offsets on the permanent lane layer."
  - uid: "asam.net:xodr:1.9.0:road.lane.layer.lane_phys_attr_temporary"
