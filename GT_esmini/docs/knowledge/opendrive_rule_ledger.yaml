    status: implemented_gt
    status_reason: "FIXED during verification: original implementation only unioned border+width elem_asc_order; spec section 11.7 'Lane geometry' intro explicitly names width/border/height as the three 'lane geometry' types this generic F.6.12.20 rule covers, so height was missing. Added height to the union; re-verified 0 regression on full corpus (0 official flags) and confirmed positive-fire on a height-only violation via a new standalone check against the existing synthetic fixture (road 106)"
    checker: "GT_esmini/docs/knowledge/opendrive_gap_checkers/check_road_lane_attrs.py::run_checks"
