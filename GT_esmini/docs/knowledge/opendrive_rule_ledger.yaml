  - uid: "asam.net:xodr:1.7.0:header.offset.centered_coords"
    rule_name: "header.offset.centered_coords"
    version: "1.7.0"
    category: "header.offset"
    status: implemented_gt
    status_reason: "Reads exactly the planView geometry x/y and signal positionInertial x/y values the rule text is concerned about (float-precision risk), flags >1e5m magnitude. 0 hits on real corpus (max observed well below threshold); confirmed alive via synthetic ~5.6e6m case."
    checker: "GT_esmini/docs/knowledge/opendrive_gap_checkers/check_misc_header_ids.py::run_checks"
    description: "The &lt;offset&gt; element should be such that the x and y coordinates of ASAM OpenDRIVE are approximately centered around (0;0). If the x and y coordinates are too large, applications using float coordinates internally might not be able to process them accurately enough due to the limited precision of IEEE 754 double precision floating point numbers."
  - uid: "asam.net:xodr:1.9.0:header.proj.max_one_proj"
    rule_name: "header.proj.max_one_proj"
    version: "1.9.0"
    category: "header.proj"
