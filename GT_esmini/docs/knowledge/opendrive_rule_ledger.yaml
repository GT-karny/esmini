    status_reason: "det. wrong-sign-only sub-case, guarded to driving lanes + expected-sign-side-exists (official FP storm 40->10; residual 10 = genuine literal violations on ASAM motorway examples). spans-both left as documented ambiguous residual."
    checker: "GT_esmini/docs/knowledge/opendrive_gap_checkers/check_road_signal_ref_validity.py::run_checks"
    description: "For left-hand-traffic, @orientation=\"-\" implies that the &lt;validity&gt; element shall only span negative lane ids, while @orientation=\"+\" implies that the &lt;validity&gt; element shall only span positive lane ids. If the given &lt;validity&gt; elements span both, positive and negative lane ids, @orientation=\"none\" shall be used."
