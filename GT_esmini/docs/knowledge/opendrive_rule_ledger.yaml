    status: implemented_qc
    description: "Lane that continues across the lane sections shall be connected in both directions."
  - uid: "asam.net:xodr:1.4.0:road.lane.link.multiple_connections"
    rule_name: "road.lane.link.multiple_connections"
    version: "1.4.0"
    category: "road.lane.link"
    status: implemented_gt
    status_reason: "Implements the rule's 2nd sentence only (non-zero width required at a declared connection point) -- the 1st sentence (multi-link required for abrupt splits/merges) needs cross-section lane-topology-change detection, out of attribute-only scope, left unimplemented and documented in-code. Verified this rule needs no junction-connecting-road guard: lane-level <link> semantics on connecting roads are unchanged from normal roads (confirmed by scanning all 1023 connecting-road lane links in the corpus -- none produce a false positive, computed width at the declared connection point is never near-zero). Synthetic positive fixture fires correctly; 1 genuine finding on the official Ex_Motorway_roadworks_temporary_layer_lane_offset.xodr (an intra-road cross-layer lane-renumbering chain where a temp lane's own width is 0 with a declared predecessor -- investigated, matches the literal rule text, not a clear false positive) plus a handful on GT-authored fixtures."
    checker: "GT_esmini/docs/knowledge/opendrive_gap_checkers/check_road_lane_layer_link_section.py::run_checks"
    description: "Multiple predecessors and successors shall be used if a lane is split abruptly or several lanes are merged abruptly. All lanes that are connected shall have a non-zero width at the connection point."
  - uid: "asam.net:xodr:1.4.0:road.lane.link.new_lane_appear"
    rule_name: "road.lane.link.new_lane_appear"
    version: "1.4.0"
    category: "road.lane.link"
    status: implemented_qc
    description: "If a new lane appears besides, only the continuing lane shall be connected to the original lane, not the appearing lane."
  - uid: "asam.net:xodr:1.4.0:road.lane.link.no_link"
    rule_name: "road.lane.link.no_link"
    version: "1.4.0"
    category: "road.lane.link"
    status: gap_ambiguous
    status_reason: "RE-CONFIRMED truly ambiguous (high conf): Distinguishing 'physically-connected, unambiguous lane linkage legitimately expressed at lane level despite the road formally touching a junction' (the slip-lane connector road 77 pattern, sanctioned by ASAM's own official example) from 'a lane link "
    description: "The &lt;link&gt; element shall be omitted if the lane starts or ends in a junction or has no link."
  - uid: "asam.net:xodr:1.9.0:road.lane.link.temporary_layer_section_link_permanent"
    rule_name: "road.lane.link.temporary_layer_section_link_permanent"
    version: "1.9.0"
    category: "road.lane.link"
    status: implemented_gt
    status_reason: "Checks both authoring directions (own predecessor/successor targeting layer=permanent, or the reciprocal permanent lane declaring layer=temporary back) at the aggregate start/end of the temporary-layer run, restricted to drivable (@type=driving) non-zero-width lanes per the rule text; synthetic positive fixture fires correctly, 2 genuine findings on GT-authored g2_lanes_layer_19.xodr (filename-confirmed intended positive case), 0 on official set."
    checker: "GT_esmini/docs/knowledge/opendrive_gap_checkers/check_road_lane_layer_link_section.py::run_checks"
    description: "At the start and at the end of a temporary lane layer section, all drivable lanes with non-zero width on the temporary lane layer shall be linked to lanes on the permanent lane layer."
  - uid: "asam.net:xodr:1.4.0:road.lane.link.use_junctions"
    rule_name: "road.lane.link.use_junctions"
    version: "1.4.0"
    category: "road.lane.link"
    status: gap_ambiguous
    status_reason: "RE-CONFIRMED truly ambiguous (high conf): 'Clear' vs 'ambiguous' relationship to a predecessor/successor is a real-world-topology/authorial-intent judgment (would a driver's or router's continuation onto that specific lane be unambiguous) with no corresponding XML attribute. A structural pro"
    description: "Two lanes shall only be linked if their linkage is clear. If the relationship to a predecessor or successor is ambiguous, junctions shall be used."
