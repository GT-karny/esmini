    checker: "GT_esmini/docs/knowledge/opendrive_gap_checkers/check_misc_header_ids.py::run_checks"
    description: "There shall be no more than one definition of the projection. If the definition is missing, a local Cartesian coordinate system is assumed."
  - uid: "asam.net:xodr:1.4.0:ids.id_unique_in_class"
