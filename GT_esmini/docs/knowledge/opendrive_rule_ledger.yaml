    status: implemented_gt
    status_reason: "Verified against OpenDRIVE_Core.xsd: <speed>/<priority> are only reachable within defaultRegulations via roadRegulations|signalRegulations/<semantics>, whose shared type (t_signals_semantics) also allows lane/prohibited/warning/etc; the check correctly flags non-speed/priority semantics children in that context. 0 hits on 208-file corpus (0 official, 0 GT); confirmed alive via synthetic injected <lane> child."
