    version: "1.8.0"
    category: "junctions.direct"
    status: implemented_gt
    status_reason: "Structural check: groups sibling <laneLink> elements by (incomingRoad,@from) and (linkedRoad,@to) per Annex 12.6.2's own overlap-detection method, and flags a group where more than 2 (\"a pair\") carry @overlapZone; validated against real official Ex_Entry_Exit/Ex_Slip_Lane overlap patterns (0 false positives) and a synthetic 3-way-overlap positive fixture."
