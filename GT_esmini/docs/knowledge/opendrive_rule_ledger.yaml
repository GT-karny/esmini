    version: "1.9.0"
    category: "road.lane.layer"
    status: implemented_gt
    status_reason: "Flags any @length attribute on a permanent-layer laneSection (XSD allows it on the element type but the prose forbids it for this layer specifically -- a genuine XSD-can't-express gap); synthetic positive fixture fires correctly, 1 genuine finding on GT-authored g1_lanesection_length_19.xodr (the fixture's own filename confirms it's the intended positive case), 0 on official set."
    checker: "GT_esmini/docs/knowledge/opendrive_gap_checkers/check_road_lane_layer_link_section.py::run_checks"
    description: "Lanes in the permanent lane layer shall not use the attribute @length."
  - uid: "asam.net:xodr:1.4.0:road.lane.link.lanes_across_laneSections"
    rule_name: "road.lane.link.lanes_across_laneSections"
    version: "1.4.0"
