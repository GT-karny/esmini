    version: "1.8.0"
    category: "junctions.direct"
    status: implemented_gt
    status_reason: "Structural check: a direct junction's connections must share one common hub road (as @incomingRoad or @linkedRoad, either side, to accommodate bidirectional hubs) with the other side varying; flags junctions with no such hub (many-to-many, Annex 12.6.3 Figure 92's unsolvable case). Validated on real official direct-junction topologies (Ex_Entry_Exit, Ex_Slip_Lane, UC_Motorway-Exit-Entry -- 0 false positives) and a synthetic many-to-many fixture."
    checker: "GT_esmini/docs/knowledge/opendrive_gap_checkers/check_junctions_direct_geometry.py::run_checks"
    description: "Direct junctions shall connect one road on one side with multiple roads on the other side."
