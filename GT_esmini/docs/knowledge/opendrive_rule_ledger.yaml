    description: "Lanes in the \"temporary\" layer shall not contain &lt;height&gt; or &lt;material&gt; elements. The height and material is instead determined by the permanent layer."
  - uid: "asam.net:xodr:1.9.0:road.lane.layer.layer_limits"
