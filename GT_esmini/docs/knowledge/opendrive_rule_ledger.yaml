    category: "road.lane_section"
    status: implemented_gt
    status_reason: "Direct arithmetic check (s + @length > road @length) restricted to sections that actually declare @length (i.e. temporary-layer sections, since length_only_temporary already forbids @length on permanent); synthetic positive fixture fires correctly, 0 flags on corpus."
    checker: "GT_esmini/docs/knowledge/opendrive_gap_checkers/check_road_lane_layer_link_section.py::run_checks"
    description: "A lane section with @length shall not extend beyond the end of the road."
  - uid: "asam.net:xodr:1.4.0:road.lane_section.lanesec_usage_lane_num"
    rule_name: "road.lane_section.lanesec_usage_lane_num"
    version: "1.4.0"
    category: "road.lane_section"
    status: gap_geometry_math
    status_reason: "Detecting a within-section lane-count change (as opposed to a change that already coincides with a laneSection boundary, which is definitionally never a violation) requires evaluating each lane's cubic width polynomial for a genuine zero-crossing strictly inside the section's s-span -- real numeric root-finding beyond attribute/count inspection, not decidable from laneSection/lane presence or counts alone."
    description: "A new lane section shall be defined each time the number of lanes change."
  - uid: "asam.net:xodr:1.9.0:road.lane_section.new_lanesec_link_temp_to_perm"
