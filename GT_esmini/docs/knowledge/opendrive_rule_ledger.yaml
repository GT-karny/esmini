    category: "road.lane_section"
    status: implemented_gt
    status_reason: "Checks that wherever a cross-layer (temporary<->permanent) lane link is actually declared at the temporary run's start/end, the permanent layer has a matching laneSection boundary at that s (exempting the road's own start/end, which the permanent layer's outermost sections inherently reach without a new split); synthetic positive fixture (cross-layer link with no matching permanent boundary) fires correctly, 0 flags on corpus."
    checker: "GT_esmini/docs/knowledge/opendrive_gap_checkers/check_road_lane_layer_link_section.py::run_checks"
    description: "A new lane section on the permanent lane layer shall be defined each time lanes on the permanent layer are linked to lanes on the temporary layer."
