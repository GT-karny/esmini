# VirtualDriver 実装ユニット台帳（namespace: vd-component）
#
# 3段チェーン「実装 -> realizes -> vd-func -> realizes -> req-vd-ad」の実装側ノードのうち、
# **ITrafficPolicy 実装ではないもの**を登録する。ITrafficPolicy 実装は namespace `policy`
# （source_of_truth: resources/xosc/verification）が持つ。二重登録は禁止。
#
# 2026-08-02 新設。それ以前、実装側に登録できるのは policy だけで、プランナー・ドライバー
# モデル・横断層を指す語彙が無かった。function_catalog_vd_ad.yaml の `by:` に未登録の
# 擬似ID（'planner' / 'driver'）が使われていたのが、その欠落の露出である。
#
# フィールド:
#   id        内容 slug（namespaces.yaml の id_pattern。序数を使わない＝§7.1 規約4）
#   title     人間可読名（ja）
#   layer     プラガブル層の所属。roadmap.md §3 のアーキ図に対応
#             mid-long-planner | short-planner | driver-model | indicator-policy | cross-cutting
#   interface 実装している純抽象インターフェース（無ければ '-'）
#   path      実装の主ファイル（repo 相対）
#   note      何をするユニットか。1-2文
#
# 実装が何の機能を実現するかは graph.yaml の realizes 辺が真実源。ここは所属だけを持つ。

components:
  - id: route-lane-plan
    title: 経路レーン計画
    layer: cross-cutting
    interface: '-'
    path: GT_esmini/src/control/virtualdriver/RouteLanePlan.cpp
    note: >-
      経路が各 road で要求する目標レーン集合を接続点から後ろ向きに伝播させて算出し、
      ego との適合をテレメトリへ出す。ルート解決の失敗も検出して外へ出す。
      **診断のみで是正しない**（自発的な車線変更は vd-func:FUNC-055 のスコープ）。

  - id: lane-change-initiation
    title: 車線変更の発起
    layer: cross-cutting
    interface: '-'
    path: GT_esmini/src/control/virtualdriver/LaneChangeInitiation.cpp
    note: >-
      route-lane-plan が出した目標レーン帯へ、自分から車線変更を起こす層。決断距離を
      残ホップ数に比例させ、隣接レーンの前後車に対するギャップ受容を判定して1回1レーンずつ移る。
      軌道生成は ResumeMergeProfile を無改造で流用し、アンカーを目標レーンへ向ける。
      **既定 OFF**。入れなかった場合は通過して逸脱を記録する（復帰は vd-func:FUNC-052）。

  - id: maneuver-aware-speed-planner
    title: マニューバ考慮 速度プランナー
    layer: mid-long-planner
    interface: IMidLongPlanner
    path: GT_esmini/src/control/virtualdriver/ManeuverAwareSpeedPlanner.cpp
    note: >-
      Route 前方を等間隔スキャンして v_target(s) の速度上限プロファイルを出す。
      曲率・右左折・SpeedLimit 変化点・勾配を織り込む。

  - id: trajectory-short-planner
    title: 短期トラジェクトリプランナー
    layer: short-planner
    interface: IShortPlanner
    path: GT_esmini/src/control/virtualdriver/TrajectoryShortPlanner.cpp
    note: v_target(s) と Action から等時間刻みの (x,y,v,t) preview を生成する。

  - id: pid-pure-pursuit-driver
    title: PID + Pure Pursuit ドライバーモデル
    layer: driver-model
    interface: IDriverModel
    path: GT_esmini/src/control/virtualdriver/PIDPurePursuitDriver.cpp
    note: >-
      preview と自車状態から throttle/brake/steer を逆算する。既定の IDriverModel で
      roadmap.md §6 により以後は凍結扱い。

  - id: auto-indicator-policy
    title: 自動方向指示器ポリシー
    layer: indicator-policy
    interface: IIndicatorPolicy
    path: GT_esmini/src/control/virtualdriver/AutoIndicatorPolicy.cpp
    note: >-
      横アクションと経路情報から LightMask を決める。名前に Policy と付くが
      ITrafficPolicy ではない（namespace policy には属さない）。

  - id: ad-steering-envelope
    title: AD 操舵指令の安全包絡線
    layer: cross-cutting
    interface: '-'
    path: GT_esmini/src/control/virtualdriver/AdSteeringEnvelope.cpp
    note: AD 指令の操舵角・躍度に上限をかけ、手介入との調停で破綻しない範囲へ収める。

  - id: resume-merge-profile
    title: AUTO_RESUME 合流軌道
    layer: cross-cutting
    interface: '-'
    path: GT_esmini/src/control/virtualdriver/ResumeMergeProfile.cpp
    note: 手動介入から AUTO へ戻る際、ROUTE レーン中心へ滑らかに寄せる横方向プロファイル。

  - id: adas-function-report
    title: ADAS 機能状態レポート
    layer: cross-cutting
    interface: '-'
    path: GT_esmini/src/control/virtualdriver/AdasFunctionReport.cpp
    note: >-
      作動中の ADAS 機能とその状態を OSI HostVehicleData の
      vehicle_automated_driving_function[] へ出す。

  - id: domain-ownership-ledger
    title: ドメイン所有台帳
    layer: cross-cutting
    interface: '-'
    path: GT_esmini/src/control/common/DomainOwnershipLedger.cpp
    note: >-
      横/縦の各ドメインを誰（人間 / シナリオ / AD）が書くかを一元管理する。
      ManualDrive と共有するため control/common に置かれている。

  - id: overtake-maneuver
    title: 追い越しマヌーバ
    layer: tactical
    interface: '-'
    path: GT_esmini/src/control/virtualdriver/OvertakeManeuver.cpp
    note: >-
      遅い先行車の追い越しを、vd-component:lane-change-initiation の1ホップ機構の上に
      「動機」を1つ足す形で実現する。純関数層（trigger / 経路ガード / 対向ギャップ /
      追い越しレーン選択 / クリア判定 / 合図ドウェル）がここにあり、フェーズ状態機械と
      エンジン依存の走査は ControllerVirtualDriver 側にある（ScanAdjacentLaneGap が
      LaneChangeInitiation.hpp で同じ分割をしているのと同型）。
      軌道は ResumeMergeProfile を無改造で流用し、往路・復路とも同じ1ホップ機構を
      目標レーンだけ差し替えて2回まわす。設計は
      GT_esmini/docs/virtualdriver/design/overtake_maneuver.md。

  # 2026-08-05 フェーズD（req-vd-ad:REQ-AD-027）。名前空間の題は「VirtualDriver 実装ユニット」
  # だが、この台帳は既に ad-steering-envelope / domain-ownership-ledger /
  # adas-function-report のようなコントローラ横断のユニットを持っており、
  # LaneKeepAssist も同じ性格（純ロジック・エンジン非依存・単体テスト可能）である。
  # 置き場所を分けるより、cross-cutting として同居させる方が「実装側ノード」の語彙が
  # 割れずに済む。
  - id: adas-coexistence-stack
    title: 手動運転中 ADAS の並行稼働スタック
    layer: cross-cutting
    interface: '-'
    path: GT_esmini/src/control/manualdrive/AdasCoexistenceStack.cpp
    note: >-
      ManualDriveCoordinator の cmd 確定後・バス publish 前という一点で、AEB / FCW / ACC /
      LKA / LDW / MSL を人間の入力の上に重ねる。ここが持つのは**調停の順序と報告**であって
      個々の判断ではない——判断は AebSafety（既存 policy、ゼロ改修で流用）や
      AccLonController / LaneKeepAssist / SpeedLimiter が持つ。
      PedalArbitrator（縦の合成規則＝安全段は max 合成で上乗せしない）と
      KickdownDetector（アクセル全踏みのラッチ、AEB 抑制と MSL 一時解除が共有）も
      このユニットの内側にある。段の順序こそが「リミッターが安全段を拒否できない」を
      決めるので、順序を持つ場所を1つにしてある。

  - id: acc-lon-controller
    title: 手動運転中の ACC（Stop&Go 含む）
    layer: operational
    interface: '-'
    path: GT_esmini/src/control/manualdrive/AccLonController.cpp
    note: >-
      設定速度を上限とし THW を維持する縦制御を、人間がステアを握ったまま重ねる。
      速度ループは**加速度領域**で回して envelope で clamp してからペダル参照値で割る
      ——ペダル領域で作ると誤差が大きい瞬間に指令が飽和し、快適上限の config が
      何も制限しない飾りになる（設計 §12 の一般化: 上限はそれが定義されている次元で掛ける）。
      停止保持の判定しきい値は AT クリープの実測床より上に置く必要がある（同）。

  - id: speed-limiter
    title: 手動運転中の速度リミッター（MSL）
    layer: operational
    interface: '-'
    path: GT_esmini/src/control/manualdrive/SpeedLimiter.cpp
    note: >-
      人間のスロットルを設定速度で片側クランプするだけの縮退版 envelope。ブレーキは
      出さない（`gt.msl.brake_out` が恒等的に 0 なのはそのため）。キックダウンによる
      一時解除は AEB 抑制と同じ KickdownDetector を共有する＝2つの機能が同じ入力事象を
      別々に解釈しないことを部品の共有で保証している。

  - id: lane-keep-assist
    title: 手動運転中のレーンキープ補助（LKA / LDW）
    layer: cross-cutting
    interface: '-'
    path: GT_esmini/src/control/manualdrive/LaneKeepAssist.cpp
    note: >-
      レーン中心からの偏差と横速度だけを入力に、TLC 主・margin 従で逸脱傾向を判定し、
      振幅・レート制限つきの補正操舵を cmd.steering へ加算する。判定と出力を別経路に
      分けてあり、警報のみモード（LDW）は判定を動かしたまま出力だけを止める。
