# Knowledge-graph namespace registry (single source of truth for ID systems).
#
# Every node reference in graph.yaml MUST be written as "<slug>:<local-id>".
# Rationale: the 2026-07-16 inventory found the same bare tokens reused across
# independent ID systems ("P<n>" in 5 systems, "PR-" in 2, "CORE-"/"WEB-" in 2,
# "R<n>" in 3 — even within a single file). Bare IDs are therefore forbidden
# in the graph; the namespace prefix is what makes an ID unambiguous.
#
# Fields:
#   slug            canonical namespace prefix (unique)
#   title           human-readable name (ja)
#   entity_type     coarse node type
#   id_pattern      fullmatch regex for the local part (after the colon)
#   source_of_truth repo-relative file/dir where the IDs are defined
#   status          active | reserved (no source yet) | implicit (git object)
#   count           approx. entity count at registration time (informational)
#   extract         optional; "commit-mentions" marks namespaces whose IDs are
#                   conventionally cited in commit messages (auto-extractable)
#   face            3面アーキテクチャのどの面に属すID体系か（capability_model.md §0.5）
#                     "1"     面1 OSI吐き出しOpenX対応シム（World / テストベンチ）
#                     "2"     面2 自動運転VD（SUT・被検体）
#                     "3"     面3 自動運転検証環境（刺激・観測・判定・常設）
#                     "cross" 面を跨ぐ運用軸（提案・監査・ディレクティブ・git実体）
#                   面をまたぐ辺が正規IF（signal）を経由しているかを検査する
#                   coupling-audit（capability_model.md §0.5, フェーズ3）の入力。
#

# Validated by scripts/check_knowledge_graph.py (CI: test job, Linux/Release).

edge_types:
  # Curated (hand-authored in graph.yaml — judgment relations only)
  curated:
    - merged-into        # duplicate absorbed by target (P24 -> P15)
    - supersedes         # source replaces target
    - depends-on         # source cannot start/land before target
    - shares-design-with # must be co-designed to avoid duplicate assets
    - complements        # runs alongside / mutually reinforcing
    - conflicts-with     # resource or design conflict (ports, budgets)
    - concerns           # bridge to a domain concept (openx:*)
    - informed-by        # decision/lesson provenance
    - upstream-candidate # fork patch -> upstream PR candidate
    - realizes           # implementation artifact realizes a plan item
    - verifies           # test asset verifies a requirement/feature (matcher -> req)
    # 検証スパインの縦串（capability_model.md §5, フェーズ1で追加）
    - stimulated-by      # ②刺激: req / scene -> scenario-variant / policy（主張を発火させる資産）
    - observes           # ④観測: matcher -> signal（matcher が読む生の観測量）
    - sustained-by       # ⑥常設: req / matcher -> gate（どの常設ゲートで守られるか）
  # Generated (extracted by tooling, never hand-maintained)
  generated:
    - implements         # commit -> ID (conventional-commit citation)
    - closes             # commit -> audit finding
    - refs               # commit -> ID (weak mention)

