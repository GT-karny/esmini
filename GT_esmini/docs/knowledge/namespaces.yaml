  # ---- 検証スパイン④観測・⑥常設（capability_model.md §1 / §4, フェーズ1で新設） ----

  - slug: signal
    title: 観測可能量（OSI GroundTruth / HostVehicleData が canonical）
    entity_type: observable
    face: "1"
    id_pattern: "[a-z][a-z0-9]*(_[a-z0-9]+)+"
    source_of_truth: GT_esmini/docs/knowledge/signal_catalog.yaml
    status: active
    count: 47
    notes: >-
      検証スパイン④観測の一級市民（capability_model.md §4）。canonical は
      **OSI .proto 面（GroundTruth / HostVehicleData）**で、`vd_metrics.py` の
      telemetry frame はその派生投影の一つに過ぎない（frame契約を canonical に
      置くと「OSIにemit済みだが frame未投影」= pitch/roll 型の(b)を、真の観測不能
      (a)と潰してしまうため）。各 signal は exposure（osi/hvd/frame/derived/debug）
      と state（●/(a)/(b)/(b′)/(–)）を持つ。**exposure=debug は「観測できるが
      verdict-trust の対象外」**＝面2内部を覗くデバッグ経路で、判定に使うと
      面3→面2 直結の結合負債になる（実装側の規約は `gt.dbg.*` 接頭辞、
      `PolicyDetail.hpp` に常駐）。**on-demand 原則**: OSI .proto の bulk import は
      しない（openx 346概念の轍を踏まない）— 主張/matcher が参照した signal だけ起こす。
      面タグが "1" なのは emit 面（面1が吐く観測IF）だから。読む側は matcher(面3)
      で、`matcher -> observes -> signal` が唯一の正規観測経路。

  - slug: gate
    title: 常設検証ゲート（回帰で恒久的に走る単位）
    entity_type: test-gate
    face: "3"
    id_pattern: "[a-z][a-z0-9]*(-[a-z0-9]+)+"
    source_of_truth: GT_esmini/docs/knowledge/gate_catalog.yaml
    status: active
    count: 14
    notes: >-
      検証スパイン⑥常設（capability_model.md §4）。カタログの真実源は実行系
      （root CLAUDE.md §5 ＋ scripts/ ＋ .github/workflows/ci.yml）で、本ノードは
      その索引。各ゲートは blocking（落ちたら止まる）/ warning（報告のみ）と
      **covers（実際に何を検証しているか）** を持つ。**covers を名前から推測して
      書かないこと** — `gate:unit-ctest` の ctest 標的 `test_ScenarioReaderParsing`
      は名前に反し GT_ScenarioReader の現行パース対象を検証していない（2026-07-20
      訂正、capability_model.md §2 行根拠）。名前が主張を偽装している実例であり、
      グラフは lint と派生レポートの根拠になるため誤った covers は自動化され増幅される。

